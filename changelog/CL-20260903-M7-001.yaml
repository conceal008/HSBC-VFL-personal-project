title: 三类隐私攻击实现，并用跨轮平均攻击推翻了加噪防护的有效性
what: '实现三类攻击（攻击者设定为诚实但好奇的协议内参与方）：

  A1 被动方从每轮下发的残差反推主动方标签；

  A2 主动方从被动方上传的嵌入用线性解码器重建被动方特征；

  A3 被动方从回传梯度反推标签（仅 SplitNN 形态A 存在此暴露面）。

  并评估逐轮加高斯噪声的防护效果，给出单轮 ε。'
key_finding: '**C3：逐轮加高斯噪声不是本协议的有效防护——本步骤的证伪推翻了自己的初期读数。**


  初期结果显示 σ=1.0 即可把泄露 AUC 从 1.00 压到 0.76 而几乎不损失可用性，看起来近乎免费。但攻击者只用了单轮残差。噪声在轮间独立而标签恒定，**跨轮平均即可消掉噪声**：

  σ=1.0 时跨轮平均攻击的泄露 AUC 回到 **1.0000**；要压到 0.67 需 σ=30，此时可用性 0.6352 **低于 L0 内地单方基线 0.7089**——防护到有效时，还不如不做联邦。

  → 可行路径只能是协议级手段（安全聚合 / 同态加密 / 秘密分享），或改变暴露面本身。


  **另一个反直觉结果：「冻结编码器 = 更安全」是错的。** 形态B 挡住了梯度标签泄露（A3 从 1.00 降到 0.50），但特征反演风险反而更高（自监督形态 R²=0.667 > 形态A 的 0.488）——PCA
  编码器是线性的、更易求逆。形态B 换掉的是标签暴露面，不是特征暴露面。


  过程中自查发现并修复两处实现缺陷：①残差记录的是加噪**前**的干净值，而被动方实际收到的是加噪后的值，导致 DP 防护看起来完全无效；②泄露强度取了原始 AUC 而非 max(auc, 1−auc)，而
  r = p − y 与标签负相关，攻击者翻转符号即可，故原始 AUC=0 实为**完全泄露**。'
why: 框架要求 M7 给出攻防结论以支撑 L3 形态选择。而攻防结论最容易出现「防护看起来有效」的假象——因为防护效果高度依赖攻击者的强度假设。因此本步在得到有利结论后主动设计更强的攻击自证，这正是框架的证伪纪律所要求的。
