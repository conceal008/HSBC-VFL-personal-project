# M9 · 证据链映射：每条对外结论 → 具体产出文件
# ---------------------------------------------------------------------------
# 本文件是「一致性核验」的对象。核验的是**可追溯性**，不是正确性——
# 证据文件存在不代表结论正确，只代表读者能查到它依据的是什么。
#
# nature 必须显式声明，取值含：实测 / 推论 / 假设 / 未复核
# ⚠️ 凡涉法结论一律标注「未复核」——本项目不设合规角色（豁免 W-001）。
# ---------------------------------------------------------------------------
step_id: S9.1

claims:
  - id: C1
    statement: L1（本地模型 + 对方 k-匿名聚合统计）只捕获纵向联邦价值的一小部分
    nature: 合成数据实测（三个独立口径：2.1% / 15.5% / 12.3%）
    evidence:
      - modules/m5_modeling/results/l1_vs_l3_critical.csv
      - modules/m5_modeling/results/l1_placebo_test.csv
      - modules/m5_modeling/results/hyperparam_search.csv
      - modules/m5_modeling/results/oracle_upper_bound.csv

  - id: C2
    statement: 价值高度依赖互补性这一个条件，λ 从 0 到 2.0 时增益跨度八倍
    nature: 合成数据实测
    evidence: [modules/m5_modeling/results/sweep_results.csv]

  - id: C3
    statement: 逐轮加高斯噪声防不住标签推断；压住泄露所需的噪声会先把价值清零
    nature: 合成数据实测（含跨轮平均攻击的证伪）
    evidence:
      - modules/m7_security/results/attack_results.csv
      - modules/m7_security/results/multiround_attack.csv

  - id: C4
    statement: 无防护的纵向联邦逻辑回归是双向完全泄露的——主动方拿特征，被动方拿标签
    nature: 合成数据实测（6 个辅助样本即可精确恢复特征，R²=1.000000）
    evidence:
      - modules/m7_security/results/feature_inference.csv
      - modules/m7_security/results/attack_results.csv

  - id: C5
    statement: 防护必须逐攻击面设计——同一种加噪手段对标签推断与特征推断效果完全相反
    nature: 合成数据实测（含加强版攻击的证伪）
    evidence:
      - modules/m7_security/results/feature_inference.csv
      - modules/m7_security/results/feature_inference_stronger.csv
      - modules/m7_security/results/uplink_defense_utility.csv

  - id: C6
    statement: 成员泄露由模型容量驱动，与是否联邦无关
    nature: 合成数据实测（LiRA 校准，32 影子模型）
    evidence:
      - modules/m7_security/results/membership_lira.csv
      - modules/m7_security/results/membership_capacity.csv

  - id: C7
    statement: 合成数据上的模型效果排序是生成假设的产物，不得用于选技术路线
    nature: 合成数据实测（分支卡 falsifier 触发）
    evidence:
      - modules/m5_modeling/results/nonlinear_ladder.csv
      - registry/branch_cards/BC-M5-001.yaml

  - id: C8
    statement: C1 不依赖数据生成机制，三种信号形式下 L1 捕获比例均 ≤1%
    nature: 合成数据实测
    evidence: [modules/m5_modeling/results/nonlinear_ladder.csv]

  - id: C9
    statement: 理论上限高不等于可实现比例高，用一个数字概括数据价值不可靠
    nature: 合成数据实测
    evidence:
      - modules/m5_modeling/results/nonlinear_ladder.csv
      - modules/m2_synthetic/results/correctness_validation.csv

  - id: C10
    statement: 上行加噪与残差合法性检查必须同时开启，任一单独存在时另一条即失效
    nature: 合成数据实测（恶意参与方设定）
    evidence: [modules/m7_security/results/malicious_probe.csv]

  - id: C11
    statement: 恶意被动方可定向操纵名单，且中等幅度不触发原有的稳定性告警
    nature: 合成数据实测（恶意参与方设定）
    evidence: [modules/m7_security/results/malicious_boost.csv]

  - id: C12
    statement: 下行加噪防不住标签推断，却防得住模型窃取——一类只需符号，另一类需要数值
    nature: 合成数据实测（恶意参与方设定）
    evidence:
      - modules/m7_security/results/model_stealing.csv
      - modules/m7_security/results/model_stealing_tail.csv

  - id: C13
    statement: 多次建模的信息累积不构成实际威胁，但该结论完全依赖残差合法性检查在场
    nature: 合成数据实测（恶意参与方设定）
    evidence: [modules/m7_security/results/multi_run_accumulation.csv]

  - id: A1
    statement: 实体对齐质量不是本项目的主要风险——漏配 10% 仅损失约 12% 增益
    nature: 合成数据实测（PSI 为行为仿真，非密码学实现）
    evidence:
      - modules/m3_alignment/results/psi_quality.csv
      - modules/m3_alignment/results/misattribution_impact.csv

  - id: L1
    statement: 八类跨境对象定性完成：禁止 1 · 协议内 1 · 需论证 6，无一类可自由跨境
    nature: 技术侧自评，未复核（本项目不设合规角色）
    evidence: [registry/cross_border_assets.yaml, modules/m0_compliance/legal_references.md]

  - id: L2
    statement: 三条合规路线的可用样本估计均低于可验证下界 N_eff ≥ 30,000
    nature: 依赖显式假设的推论，未复核
    evidence:
      - modules/m0_compliance/escalation_M0-001.md
      - modules/m0_compliance/results/route_A_funnel.csv
      - modules/m0_compliance/results/route_B_funnel.csv
      - modules/m0_compliance/results/mde_sample_size.csv

  - id: D1
    statement: L3a 与 L3c 形态A 的标签暴露面目前无解，不具备上线条件
    nature: 技术侧推论（基于 C3 与 C4 的实测），合规维度未复核
    evidence:
      - modules/m8_industrialization/路线取舍决议.md
      - modules/m7_security/results/multiround_attack.csv

risks:
  - id: R1
    risk: 被动方原始特征被主动方精确恢复
    severity: 高
    mitigation: 被动方对上行加噪 σ ≥ 0.1（实测使 R² 由 1.0000 降至 0.196，可用性损失 0.0014）
    evidence: [modules/m7_security/results/feature_inference.csv]

  - id: R2
    risk: 主动方标签被被动方完全推断
    severity: 高
    mitigation: 无有效防护——噪声已被证伪，须协议级手段（安全聚合/同态加密/秘密分享），本阶段未实现
    evidence: [modules/m7_security/results/multiround_attack.csv]

  - id: R3
    risk: 成员关系泄露（某人是否在建模样本内本身即个人信息）
    severity: 中
    mitigation: 控制模型容量，GBDT 树深 ≤4（实测深 3→6 使泄露由 0.528 升至 0.545）
    evidence: [modules/m7_security/results/membership_lira.csv]

  - id: R4
    risk: SplitNN 形态B 的特征反演风险高于形态A
    severity: 中
    mitigation: 形态B 必须配自监督预训练；标签面与特征面须分别评估，不得以「不回传梯度」概括
    evidence: [modules/m7_security/results/attack_results.csv]

  - id: R5
    risk: 实体错配导致个人信息被错误关联
    severity: 中
    mitigation: 错配率需监控；实测 40% 错配才使增益折半，但合规上错配本身即是事故
    evidence: [modules/m3_alignment/results/misattribution_impact.csv]

  - id: R6
    risk: 静默降级——被动方下线后下游把单方模型名单当作联邦模型名单
    severity: 中
    mitigation: 降级必须上报 degraded=True 并告警；故障注入 F2 已验证
    evidence: [modules/m8_industrialization/components/fault_injection.py]

  - id: R12
    risk: 恶意主动方用构造探针直接读出被动方原始特征
    severity: 高
    mitigation: 上行加噪 σ≥0.1 **与** 残差合法性检查必须同时开启——两者缺一即失效
    evidence: [modules/m7_security/results/malicious_probe.csv]

  - id: R13
    risk: 恶意被动方定向抬分操纵营销名单
    severity: 高
    mitigation: 名单稳定性阈值收紧至 0.95（仅为检测手段）；根治需可验证的部分 logit，本阶段未实现
    evidence: [modules/m7_security/results/malicious_boost.csv]

  - id: R14
    risk: 被动方窃取主动方模型，独立复现整份营销名单（商业资产直接转移）
    severity: 高
    mitigation: 下行加噪 σ≥1.0——它防不住标签，但能把名单复现度由 1.000 压到 0.13，且可用性代价几乎为零
    evidence: [modules/m7_security/results/model_stealing.csv]

  - id: R7
    risk: schema 变更后照常出分，名单全错而无人察觉
    severity: 高
    mitigation: schema 守卫抛异常停止出分，且不得被重试掩盖；故障注入 F4 已验证
    evidence: [modules/m8_industrialization/components/fault_injection.py]

deliverables:
  - name: DPIA（数据保护影响评估）
    path: modules/m9_documentation/DPIA.md
  - name: 对外表述红线
    path: modules/m9_documentation/对外表述红线.md
  - name: 模型卡
    path: modules/m9_documentation/model_card.md
  - name: 跨境流动清单
    path: modules/m9_documentation/results/cross_border_flow_registry.csv
  - name: 审计日志规格
    path: modules/m9_documentation/audit_log_spec.md
  - name: 同意管理规格
    path: modules/m9_documentation/consent_management_spec.md
  - name: 数据卡（合成数据）
    path: modules/m9_documentation/data_cards/synthetic_data_card.md
  - name: 剩余风险签署
    path: modules/m9_documentation/residual_risk_signoff.yaml
  - name: 路线取舍决议
    path: modules/m8_industrialization/路线取舍决议.md
  - name: 上线准入清单
    path: modules/m8_industrialization/上线准入清单.md

# —— 数字一致性核验：文档里声明的数字必须与仓库真值一致 ——
# 补的是证据链此前的盲区：它只查「证据文件在不在」，不查「文档里写的数字对不对」。
# 真值只能从仓库本身算出，不能从文档里抄——否则就是自己证明自己。
consistency_assertions:
  - id: F1
    what: 门禁回归用例数
    source:
      type: count_matching
      path: ci/tests/run_gate_tests.sh
      pattern: '^assert '
    context_keyword: 组用例
    must_appear_in: [ci/README.md, 项目进度总览.md, 项目目标与要求.md]

  - id: F2
    what: 带输出的 notebook 份数
    source:
      type: count_files
      glob: modules/*/notebooks/*.ipynb
    context_keyword: 份 notebook
    must_appear_in: [项目进度总览.md]

  - id: F3
    what: 组件声明份数
    source:
      type: count_files
      glob: registry/component_declarations/*.yaml
    context_keyword: 份组件声明
    must_appear_in: [项目进度总览.md]
