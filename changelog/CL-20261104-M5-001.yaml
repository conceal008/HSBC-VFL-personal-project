title: S5.M5 Orange 大版三任务 + M3 两方特征预筛：I2 + I3 与优化版联邦的增益成立，预筛在两个任务上不损失精度
what: |
  所有者 2026-11-03 19:39 回复「继续」，开方法筛选第三阶段（第二批，DR-M5-014，2 步）。本条为第 1 步：Orange KDD Cup 2009 大版三任务。
  - 两遍读取 50,000 行 × 15,000 个变量（先去掉全部行上全缺失或常数的数值变量），原始数值矩阵按列存放于磁盘映射；
  - M3 两方特征预筛只读 tune 视图 fit 行：内地按本方 XGBoost 总增益、香港按自己特征在联邦预拟合中被选为分裂的次数，各取前 300 个编码列；
  - 之后走 S5.M1 全流程与 S5.M3 交叉验证选组合；敏感性比较 k = 100 / 300 / 1000 / 全部。
  新增：
  - 决策记录 DR-M5-014（含 S5.M5 复核）；
  - 组件 method_screen_large 与单测、组件声明 M5-method_screen_large；
  - 运行配置 configs/s5_m5_orange_large.yaml；
  - 带汇总输出的运行入口 notebook S5.M5_1；
  - 公开汇总 results/method_screen_large_v1/。
  状态类字段同步：BC-M5-018（第二批拆为三条路线：orange_large_prescreen 完成、uplift_learners 运行中、lr_solver_m7 待所有者）、
  step_ledger（追加 S5.M5，新阶段 method_screen_3 预算 1 / 2）、registry/module_status.yaml 的 M5 与 governance、M5 README、
  项目进度总览（notebook 75 → 76、带输出 47 → 48；组件声明 99 → 100）。
why: |
  报告列为第二批的 Orange 大版（15,000 列）此前没有做，原因是三臂同等调参在全部列上不可行，需要先做候选文档 M3 的特征预筛。
  结果（测试 6 seed，两层 bootstrap；开发证据）：
  - I2 + I3 在流失 +0.036、追加销售 +0.011 显著，偏好 +0.025（区间下界 +0.0003，Holm 0.86）；原版联邦三个任务都不优于内地单边，优化版三个都优于。
  - M6 只在偏好上刚好成立（+0.005）；M1 在流失上变差（−0.007）；M4 无增益。
  - 单一验证集三个任务都选 M1；交叉验证 R1 1 优于（偏好 P+M6）、0 劣于。
  - 预筛「不损失精度」（D-3）在流失、追加销售上成立，偏好上不能排除（全部列 − 300 列 = +0.0050 [−0.0007, +0.0110]）。
