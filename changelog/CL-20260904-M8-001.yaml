title: 部署护栏、故障注入 7/7 与 L3 路线取舍决议
what: '把 M7 的攻防结论固化为**上线前不可绕过的机器检查**（六条防护基线 + guardrails 组件），并按框架 M8 放行判据实现 7 项故障注入，**真实注入 platform 主链路**而非仿真式假装失败。

  配套：platform 流水线新增重试与降级上报；门禁 7 的 E4 由提示转为必过检查；产出《路线取舍决议》与《上线准入清单》。'
key_finding: '**故障注入 7/7 全部通过**，达成 M8 放行判据的核心项。

  其中两项的判据是刻意写严的：

  - **F2 单方下线降级**：真正危险的不是崩溃，是**静默降级**——下游会把 L0 单方模型的名单当作联邦模型的名单来用。故要求降级后必须如实上报 degraded=True 并给出原因，只「不崩」不算通过。

  - **F4 schema 变更安全失败**：要求抛异常停止出分，且**不得被重试掩盖**——重试确定性错误只是把故障拖长，而期间照常出的是全错的名单。


  **路线取舍的依据已被 C7 改写**：合成数据上的效果排序不可用于选型，改以暴露面与合规成本为主依据。据此得出一条硬结论——**L3a 联邦逻辑回归与 L3c 形态A 的标签暴露面目前无解**（噪声防护已被实测证伪），在协议级手段落地前**不具备上线条件**；这不是效果不够，是暴露面无法闭合。


  《上线准入清单》列出 5 项阻塞，当前全部未解除。其中「标签暴露面无解」是技术性阻塞，「不设合规角色，D 类准入项无人可签」是组织性阻塞。'
why: '防护基线写在文档里，上线时没人会逐条核对——所以做成可执行检查，且每条拒绝都指回具体的实测证据文件与整改方向。

  故障注入同理：框架要求 7/7，但「跑一遍没报错」不等于扛得住故障，必须真的把故障注进去看行为。'
