title: S5.G0 冻结 G3 五臂对比预注册（S6.P3 frozen）并提交 G3 组件
what: |
  modules/m6_evaluation/configs/s6_p3_g3_preregistration.yaml 状态改为 frozen，新增 freeze 节：Santander 加盐哈希分组与样本量规则结果、
  各臂实现细节与搜索空间、十条冻结前修改（A-1 至 A-10）、新增推翻条件、组件与环境指纹。
  新增组件 modules/m5_modeling/components/g3_santander.py（流式分桶筛选、次月配对与业务切分、编码、样本量规则）、
  g3_arms.py（XGBoost 臂与共享候选调参、L1 k-匿名分段均值、B_T1 随机树嵌入 k 粗化、阴性对照打乱）、
  g3_sgb.py（隐语 SGB 单进程两方模拟训练与打分）；14 项单元测试；运行环境锁 environments/g3_sfenv.lock；
  阶段预算 DR-M5-009；组件声明三份；M5 台账、模块状态、S6.P3 声明的状态同步。
why: |
  DR-GOV-016 把 G3 定为恢复后的第一批，须先冻结、后执行。冻结前只看过训练组正例率（0.0378）与开发评估候选桶在 2016-03 的客户数，
  开发评估集标签未计算，封存确认集未抽取。冻结前修改的理由：团队仓库的旧 SGB 脚本与旧抽样无法在本会话取得（A-2、A-4）；
  SGB 单次拟合约一小时，确定性臂多 seed 重复不增加信息（A-3）；L1、B_T1、B_T2 在 proposed 版只有名字，须写成可执行定义（A-6 至 A-8）。
