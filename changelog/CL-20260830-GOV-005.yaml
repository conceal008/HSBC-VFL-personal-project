what: |
  按仓库所有者要求，删除《项目维护约束 v2》与《Loop 执行规范 v2》中阻碍推进的规模类强制约束：
  单步 ≤3 文件 / ≤300 行 / ≤15 次工具调用 / ≤1 路线 / ≤1 结论 / ≤1 会话六项上限，
  连同门禁 3（单步规模）、PR 规模自查表、附录 B 的 check_step_scope.py 一并取消。
  改为两条定性判据：自评有超过 1 项无法判定则必须拆；强行拆分会产生自相矛盾中间态则不得拆。

why: |
  三个步骤里这套上限触发了两次"例外说明"——仓库初始化 101 个文件、条款修订 10 个文件，
  两次都因为拆分会产生比大步子更糟的中间态（缺门禁的半截仓库、条款改了引用点没改）。
  一个在正常工作里频繁需要例外的上限，测量的不是它想控制的东西：
  它想控制"步子大到无法定位失败"，而这与文件数不同构。
  保留真正起作用的那条（自评有多项无法判定即拆），删掉算术式的外壳。

