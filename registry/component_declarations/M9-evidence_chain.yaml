component: evidence_chain
module: M9
path: modules/m9_documentation/components/evidence_chain.py
purpose: 证据链核验：把「结论 → 证据文件」的映射变成可执行检查，覆盖一致性核验、DPIA 风险溯源、交付清单三项。
inputs:
- modules/m9_documentation/configs/evidence_map.yaml
outputs:
- 逐条可追溯性判定与三项通过率
tests:
- modules/m9_documentation/tests/test_evidence_chain.py
cross_border_assets: []
cross_border_note: 本组件只读取仓库内的文件路径与元数据，不接触任何数据内容。
