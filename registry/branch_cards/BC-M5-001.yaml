# 分支卡 · M5 五级基线阶梯的多路线对照
#
# 本卡同时清偿《初版完成说明与降级清单》§5 第 2 项欠账：
# 初版把 L3 三条路线在同一提交中并行实现，未逐路线建卡（代偿为结果分别独立报告）。
# 本卡把全部七条路线的定位、判据、结果与去留一次性登记清楚。

card_id: BC-M5-001
title: 五级基线阶梯的七条路线对照
module: M5
status: active                    # active | archived | abandoned
opened_at: 2026-09-03
opened_by: Claude (Opus 5, Claude Code)
related_steps: [S5.1, S5.2, S5.3, S5.4]
related_changes: [CL-20260903-M5-001, CL-20260903-M5-002]
decision_records: [DR-GOV-009]

question: |
  纵向联邦（L3）相对于合规成本低得多的替代方案（L0/L1/L2），究竟多带来多少价值？
  L3 内部的三条技术路线各自的效果与暴露面如何权衡？

selection_criteria: |
  - 判别力：测试集 AUC，跨种子 95% 置信区间
  - 决策等价性：Top-10% 名单重合度（AUC 接近不等于名单一致）
  - 通信成本：轮数与浮点数量
  - 隐私暴露面：M7 的攻击结果（标签泄露、特征反演、成员推断）
  - 合规成本：跨境对象的性质（聚合量 / 逐人标记 / 逐人中间量 / 原始数据）

routes:
  - id: L0
    name: 内地单方建模
    role: 下界基准
    exposure: 无跨境
    tuned_test_auc: 0.7122
    verdict: keep
    note: 一切增益都相对它度量。

  - id: L1
    name: 本地模型 + 对方 k-匿名聚合统计
    role: "**VFL 的真正竞争者**——合规成本几乎为零"
    exposure: 聚合量，非个人信息
    tuned_test_auc: 0.7148
    verdict: keep
    note: |
      刻意给到最大搜索空间（60 组 = L0 的 12 倍）。三个口径下均只捕获小部分价值：
      正规选参 2.1% · oracle 上界（作弊）15.5% · 40 种子安慰剂对照 12.3%。
      瓶颈是结构性的——分段键只能用主动方特征，回传统计量因而是主动方特征的函数。

  - id: L2
    name: 本地模型 + 对方粗粒度标记
    role: 中间态
    exposure: 逐人低维标记
    tuned_test_auc: 0.7254
    verdict: keep
    note: 略优于 L1，但已构成逐人个人信息出境，合规成本跳档。

  - id: L3a
    name: 纵向联邦逻辑回归（残差 ↔ 部分 logit 交换）
    role: L3 路线一
    exposure: 逐人中间量（双向）
    tuned_test_auc: 0.8352
    verdict: keep
    note: |
      效果最好且与集中式数学等价（可用于实现正确性验收）。
      **但 M7 证明它在无防护时双向完全泄露**：主动方 6 个辅助样本即可精确恢复
      被动方特征（R²=1.0000），被动方从首轮残差即可完全推断标签。
      被动方必须对上行加噪（σ≈0.1，代价 0.0014）；标签侧须走协议级手段。

  - id: L3b
    name: 纵向 GBDT（SecureBoost 式 (g,h) 直方图交换）
    role: L3 路线二
    exposure: 逐人梯度与分桶统计
    tuned_test_auc: 0.7954
    verdict: keep_with_caveat
    note: |
      在本合成数据上始终落后于线性路线。**但这很可能是生成假设造成的**——
      本 SCM 的信号是潜变量的线性组合，天然对线性模型有利。
      **不得据此淘汰该路线**；待 S2.3 换第二种 SCM 结构后重估。
      另：M7 发现它的成员泄露随树深上升（深 3→6 为 0.528→0.545）。

  - id: L3c
    name: SplitNN（形态A 双向 / 形态B 冻结随机 / 形态B 冻结自监督）
    role: L3 路线三
    exposure: 形态A 含梯度回传；形态B 仅上行嵌入
    tuned_test_auc: 0.8210
    verdict: keep_pending_ruling
    note: |
      **本路线的存废取决于待裁定第 5 项**（7/29「不引入神经网络」是否仍有效）。
      DR-GOV-009 决定不预先裁定而是两条路线都实现，用实测支撑后续裁定。
      现已具备裁定所需数据：形态A 比形态B 自监督高 0.045 AUC（不回传梯度的代价）；
      形态B 随机编码器 0.7076 **低于 L0 基线**，故形态B 必须配自监督预训练。
      M7 另发现：形态B 挡住梯度标签泄露（1.00→0.50），但特征反演反而更严重
      （R² 0.667 > 形态A 的 0.488）——它换掉的是标签暴露面，不是特征暴露面。

  - id: L4
    name: 集中式（原始数据汇集）
    role: 上界基准
    exposure: 全量个人信息
    tuned_test_auc: 0.8390
    verdict: keep
    note: 仅作上界参照，合规上不可行。

falsifier: |
  若换用第二种 SCM 结构（非线性信号）后，L3b 纵向 GBDT 的排序反超线性路线，
  则「调参后 L3a > L3c > L3b」这一排序被判定为生成假设的产物，本卡的 tuned_test_auc
  一列不得再作为路线取舍依据，须重新登记。

next_review: S2.3 完成后（换第二种 SCM 结构）
