title: S6.P2 盈亏平衡与信息价值模型：先问哪个数
what: |
  新增组件 modules/m6_evaluation/components/breakeven.py（不做、L1、L3 三个选项的项目期净值蒙特卡洛模型；
  L3 出境机制按 S0.6R 规则选取并计入安全评估不获通过的风险；盈亏平衡命中提升；EVPI 与分箱 EVPPI）及 13 项单元测试、
  组件声明 M6-breakeven；配置 configs/s6_p2_breakeven.yaml（19 个参数逐项注明来源，全部为显式假设）；
  带输出的 notebook S6.P2_breakeven_value_of_information.ipynb；四张结果表 s6p2_decision_summary.csv、s6p2_evppi.csv、
  s6p2_evppi_by_contact_tier.csv、s6p2_breakeven_grid.csv。
  状态类字段同步：M6 README、step_ledger（追加 S6.P2）、registry/module_status.yaml 的 M6 条目与 governance、
  任务清单 T2 状态、项目进度总览.md 的 notebook 与组件声明计数（58→59、88→89）。
why: |
  任务清单 T2。需求方给出真实参数之前，「做不做联邦、做哪种」取决于一组未知数，须先排出哪个最值得问。
  验证的假设：是否为关键信息基础设施运营者是最先要问的问题（DR-MX-002 · D-3 的问题单顺序）。
  结果不支持该假设：全样本上合规相关参数的 EVPPI 都是 0；年联系人数（约占 EVPI 37%）、L3 命中提升（29%）、
  L1 捕获比例（13%）、因果占比（9%）依次排前。合规参数只在年联系 5 万人以上时才进入前列。
  年联系不足 2 万人时，任何单个参数都不改变「不做」的决策。
