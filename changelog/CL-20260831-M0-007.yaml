what: |
  推演 R-B（个人信息出境标准合同路径）。漏斗仍跑了一遍以确认同意率不是瓶颈
  （low 4 / mid 264 / high 6,395 人，三档依然全部低于 30,000），
  但本步的重点是适用窗口分析：把三种 L3 形态与《促进和规范数据跨境流动规定》
  第五、七、八条的阈值套在一起，用代码生成判定矩阵。

  结果：
  · 形态 A（双向，含梯度回传）在可验证规模下 → 数据出境安全评估
  · 形态 B（单向，仅嵌入 hk→cn）在可验证规模下 → **豁免**（非敏感且不满 10 万人）
  · 形态 C（无 cn→hk 流动）→ PIPL 出境条款不触发
  · **R-B 两头够不着**：形态 A 要落到标准合同需 <1 万人（低于可验证下界），
    形态 B 需 ≥10 万人（远超可用样本上限约 6 千）。

why: |
  S0.5 已经证明可用样本三档均不达标、双向 L3 必落安全评估。
  在这个前提下再算一遍结构相同的漏斗没有信息增量，
  真正未被回答的是「R-B 到底什么时候才用得上」。

  回答这个问题的过程带出了一个更重要的结论：
  **真正的决策不在「选哪条出境路径」，而在「L3 采用哪种形态」——
  形态一旦定下，路径就被法条自动决定了，没有选择余地。**
  这直接改变 S0.9 的判决性质：不再是三条路径的选择题，而是形态 A / 形态 B 的选择题。

  形态 B 的合规优势是压倒性的（安全评估 → 豁免），但代价在建模侧：
  不回传梯度则被动方编码器无法随标签迭代优化。**表示质量下降多少必须由 M5 实验回答**，
  已连同判据写入 M5 的 README——若下降幅度小于 L3 相对 L1 的增益，形态 B 是全局更优解；
  若下降到与 L1 无异，则 VFL 在本场景的价值须重新评估。

