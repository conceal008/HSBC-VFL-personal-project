dr_id: DR-GOV-005
title: 新增术语与表达规范，建立权威术语表并修正现存非规范术语
date: 2026-08-30T02:15:00+08:00
agent: Claude (Opus 5, Claude Code)
requested_by: conceal008（仓库所有者 / 本课题线负责人）
approved_by: conceal008（仓库所有者）
module: GOV
status: active
supersedes: null
related_change_id: CL-20260830-GOV-008
related_step: S-GOV.4

context: |
  所有者要求：后续术语一律使用规范、官方、正式的说法，表达要清晰，不让读者产生误解或疑惑；
  同时调整现有文档中的相应表述，并把这一条列入规范。

problem: |
  审查现存六份文档发现三类问题，都不是"读起来别扭"，而是会直接影响合规论证成立与否：
  ① **用非法定术语指代法定概念**：框架 v2 用「假名化」（GDPR 的 pseudonymisation）指代 PIPL 第 73 条的
     「去标识化」。法务复核时这是硬伤——中国法下没有「假名化」这个概念，用它做出的定性无法对应到法条。
  ② **法条编号写法不规范**：「PDPO 第 6A 部」的官方中文条文编号是罗马数字「第 VIA 部」；
     「出境三路径（安全评估/标准合同/认证）」是简称，未使用 PIPL 第 38 条的法定名称。
  ③ **同一概念多种说法与口语化术语**：「标签方」与学界/框架通用的「主动方（有标签方）」并存；
     「伪 VFL」是口语，且掩盖了它的真实含义（随机列切分模拟出的纵向场景会系统性高估增益）；
     「数据不出域」易被误解为「所有数据都不出去」，掩盖中间层表示与梯度仍可能泄露的事实。

decisions:

  - key: glossary_registry
    decision: |
      建立 registry/glossary.yaml 作为全项目唯一术语来源，append-only，与 cross_border_assets.yaml 同级维护。
      首批登记 31 条，覆盖联邦学习、隐私与安全、内地法规、香港法规、评估与实验、工程与治理六类。
      每条至少给出 term / definition / source（法定术语 · 学界通用 · 业界通用 · 本项目定义），
      按需给出 en / abbr / legal_basis / scope / forbidden / note。
    rationale: |
      术语散落在六份文档里时，"改一个说法"意味着全文搜索且必然漏改。
      集中到一个 append-only 登记表后，术语变更与跨境资产变更走同一套纪律：新增、标 superseded、修正全部引用。

  - key: clause
    decision: |
      《项目维护约束 v2》新增第 13 部分：13.1 权威术语表 · 13.2 术语使用规则 T1–T7 ·
      13.3 表达规范 E1–E8 · 13.4 与既有条款的关系 · 13.5 执行方式。
      同步：1.3 目录纪律补 glossary 条目 · 附录 A 检查卡加一项 · 附录 B 初始化清单加 glossary.yaml。
      仓库侧：AGENTS.md 第 12 条硬约束 · PR 模板新增「术语与表达」5 项自查 · README 目录导航。
    key_rules: |
      T2 法定概念用法定术语（不得用国际惯用语替代中国法定术语）
      T3 法域敏感术语按法域使用（内地「个人信息」/ 香港「个人资料」，不合并）
      T6 跨框架术语给出对应关系（FATE 的 Guest/Host ↔ 本项目主动方/被动方）
      E2 判据必须可判定 · E3 数字必须带口径 · E5「显著」只在给出 p 值时使用
      E4 禁用无信息量动词（优化/完善/赋能/打通/闭环/落地）

  - key: existing_text_fixes
    decision: |
      修正现存文档中会造成误解的表述，全部为等义替换，不改变任何结论：
        · 「假名化」→「去标识化」（PIPL 第 73 条）
        · 「PDPO 第 6A 部」→「PDPO 第 VIA 部」（两处）
        · 「出境三路径（安全评估/标准合同/认证）」→ 数据出境安全评估 / 个人信息出境标准合同 /
          个人信息保护认证（PIPL 第 38 条），并补粤港澳大湾区简化路径的定语
        · 「保障资料原则 1/3」→ 保障资料原则（DPP）1 与 3（PDPO 附表 1）
        · 「PICS」→ 收集个人资料声明（PICS）；「DPIA」→ 个人信息保护影响评估（PIPIA，国际通称 DPIA）
        · 「标签方」→「主动方（有标签方）」
        · 「伪 VFL 高估效应」→「模拟纵向切分高估效应」，并补一句解释其含义
        · 仓库自有文档中的 E4 类用词（落地 / 跑通）改写为具体表述
    scope_limit: |
      **不做一次性全量文风替换。** 三份规范正文中其余口语化表述（如个别「落地」）在
      下次因其他原因改写该段落时顺带修正，不为改而改——大规模无差别替换会引入无意义的 diff，
      也提高改变原意的风险。

falsifier: |
  下列任一现象出现，即证明本规范的形式或粒度有误，须重开决策：
  ① 出现因为查 glossary 成本过高而绕开它、直接自造说法的情形（连续 2 次）
     —— 说明术语表需要更好的检索入口或需要 CI 强制；
  ② 出现 glossary 与法条实际用语不一致的情形 —— 说明登记时未核对原文，须逐条复核 legal_basis；
  ③ 法务或需求方复核时仍因术语产生歧义 —— 说明覆盖面不足，须扩充并补充反例说明。

review_trigger: |
  ①上述 falsifier 任一命中；②M0 完成时用 S0.3/S0.4 的定性结论逐条回检 glossary 的法域与法条字段；
  ③门禁 5 上线时把 forbidden 词表与未登记缩写改为机器检查。

consequences:
  - "六份规范文件（仓库副本 + 8-9月 源件）已同步修改并 diff 校验一致"
  - "registry/glossary.yaml 首批 31 条术语已登记"
  - "forbidden 词表的机器检查纳入门禁 5；在其上线前不得以「CI 没报错」为由跳过 PR 自查"
  - "历史 changelog、DR、交接记录与项目实时日志中的既有表述一律保留，不追溯改写"
