title: S5.G3 G3 五臂对比 FedAds：L3 相对 L1 有增量，单向 B_T1 与双向分不开
what: |
  按冻结的 S6.P3 与 S6.P4（540d5b9）在 FedAds 官方纵向切分上训练并比较 L0、L1（k=5/10/20）、B_T1、A（隐语 SGB，单进程两方模拟）、
  集中式代理 L4、阴性对照 NC（B_T2 不适用）。三个带汇总输出的运行入口 notebook（数据与本地臂、SGB、配对比较）、运行配置
  configs/s5_g3_fedads_run.yaml、公开汇总 results/g3_fedads_v1/（各臂指标、对比表、运行摘要与适用边界说明）。
  test_g3_fedads 中的合成用户号改为短编号（门禁 1 把 19 位数字误判为疑似银行卡号；不影响冻结的组件）。
  状态类字段同步：M5 README（状态、当前结论、S6.P4–S5.G3 一节）、step_ledger（追加 S5.G3，阶段预算 3/4）、BC-M5-017（FedAds 路线完成）、
  registry/module_status.yaml 的 M5、M0（S0.9 输入）与 governance、项目进度总览 notebook 计数（63→66）。
why: |
  DR-GOV-017 把第二组证据改为 FedAds：Santander 是构造切分，香港侧被设计成信息丰富的一方，增益可能被高估（总整合 R3）；
  FedAds 是官方自然切分，用来检验 S5.G1 的三条结论是否只在构造切分上成立。
  验证的假设与结果（开发评估集 129,489 行、91,967 位用户、848 个正例行）：
  ① L3 相对 L1 有增量——成立，A − L1_k10 = +0.035 [0.020, 0.050]；
  ② L1 能拿到相当一部分联邦增益——不成立，L1_k10 − L0 = −0.010 [−0.023, 0.004]；
  ③ 单向形态有明显代价——不成立，A − B_T1 = −0.008 [−0.017, 0.000]；
  ④ 增益来自信息互补——成立，NC − L0 ≈ 0；⑤ SGB 与集中式无损——成立，A − L4 = +0.002。
  联邦相对本地单边的增益在自然切分上较小：A − L0 = +0.025，Santander 为 +0.044。
