what: |
  新增组件 modules/m0_compliance/components/validation_power.py（Hanley–McNeil 近似 + 配对相关修正；
  双臂检验沿用 S0.1 的 required_n_per_arm）、配置 configs/s0_1p_validation_power.yaml、
  13 项单元测试、带输出的 notebook S0.1P_validation_power.ipynb 和三张结果表：
  results/offline_auc_positives.csv、small_population_detectable_lift.csv、market_positive_ceiling.csv；
  新增组件声明 registry/component_declarations/M0-validation_power.yaml。
  术语表新增「关键信息基础设施运营者」（本步 README 下一步首次使用，法定术语，append-only）。
  状态类字段同步：M0 README（状态、当前结论、下一步——原「下一步」自 S0.3 起未更新，一并订正）、
  step_ledger（追加 S0.1P、指标、补记抽查欠账）、registry/module_status.yaml 的 M0 条目、
  项目进度总览.md 的 notebook 与组件声明计数（55→56、86→87，证据链 F2/F3 的真值随本步变化）。
  S0.1 的组件、配置、notebook 与 mde_sample_size.csv 一律不改。
why: |
  2026-10-25 所有者要求复核项目约束。复核发现 S0.1 的 N_eff ≥ 30,000 是随机对照增益检验的人数口径，
  本身成立；但项目里的离线 AUROC 比较从未换算成「需要多少正例」，几千人规模下试点能检出多大效应也没有算过。
  验证的假设：离线比较的检出能力由正例数决定、几乎不随正例率变化；
  S0.5 最乐观档 5,814 人检不出 DR-MX-001 · D-4 规定的 20% 相对增益。
  两条在 notebook 中都被确认：正例率 3.0% 与 1.0% 下最少正例数相差不到 2%；5,814 人只能检出约 46%。
