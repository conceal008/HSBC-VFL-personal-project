# 豁免登记表 · 被绕开的强制性条款
# ---------------------------------------------------------------------------
# 存在理由：所有者 2026-08-31 授权「遇到强制性要求阻拦推进时可适当绕开，但必须说明」。
# 若不给这条授权一个固定位置，「适当绕开」会散落在各处 changelog 里，
# 三个月后没人说得清哪些条款还生效——那时规范就名存实亡了。
#
# 规则：
#   1. 绕开任何强制性条款前，先在此登记；未登记的绕行等同违规
#   2. 每条必须写：被绕开的条款、为什么做不到、实际怎么做、代偿措施、失效条件
#   3. changelog 中援引豁免时写 `waiver_ref: W-00X`，门禁 2 会校验该编号存在
#   4. append-only：可新增、可标 expired，不得删除或原地重写
#   5. **不可绕清单**（见下）里的条款，任何理由都不得绕开
# ---------------------------------------------------------------------------

version: 1.0.0
last_updated: 2026-08-31T12:00:00+08:00

# ===========================================================================
# 不可绕清单 —— 绕开这些不是"推进项目"，是让项目失去存在意义
# ===========================================================================
never_waivable:
  - clause: 《维护约束 v2》第 2 部分 · 数据分级
    why: |
      真实数据、真实标识、凭证入库是本项目唯一不可逆的错误（2.4：git 历史里它还在），
      且本仓库为 Public。绕开它没有任何"推进"可言，只有损害。
  - clause: 《Loop 执行规范 v2》0.7 · 反指标操纵红线七条
    why: |
      测试集上选分支、事后改指标定义、单种子无 CI 下结论、隐瞒失败分支、
      合成数据外推真实业务、响应率冒充增量——绕开任何一条，
      产出的就不再是可信结论，而是看起来像结论的东西。
  - clause: 《维护约束 v2》第 12 部分 · 禁止事项的「数据类」与「科学性类」
    why: 同上两条的具体化。
  - clause: 《维护约束 v2》第 12 部分第 16 条 · 不得通过修改文档消除"说做不一致"
    why: |
      注意与本表的区别：本表登记的是「条款做不到，如实降级并留痕」；
      第 16 条禁止的是「做不到却改文档假装做到了」。
      前者的标志是留下了失效条件与代偿措施，后者的标志是不一致凭空消失。

# ===========================================================================
# 已登记豁免
# ===========================================================================
waivers:

  - waiver_id: W-001
    title: 不设合规角色，M0 / M9 的法务复核类判据降级为技术侧自评
    date: 2026-08-31T12:00:00+08:00
    approved_by: conceal008（仓库所有者，2026-08-31 明确指示「明确不设并降级 M0 的 DoD，你自己做」）
    status: active                      # active | expired | superseded
    related_decision_record: DR-GOV-008

    clauses_waived:
      - "《方案流程框架 v2》M0 量化放行判据：法务独立复核追问 0 次"
      - "《方案流程框架 v2》M9 量化放行判据：法务追问次数 = 0"
      - "《Loop 执行规范 v2》LOOP M0 量化 DoD：法务独立复核追问次数 0"
      - "《项目维护约束 v2》1.1 审查要求：涉及 M0/M9 需合规角色 approve"
      - "《项目维护约束 v2》5.4 合并规则：改 cross_border_assets.yaml 需合规角色 approve（不可自审）"
      - "《项目维护约束 v2》6.5：cross_border_assets.yaml 改动需合规 approve"
      - "DR-GOV-007 限制 L1：qualification_status: approved 只能由合规角色赋予"

    why_unmeetable: |
      本项目没有合规角色，且所有者已明确不设。这不是暂时缺位而是**结构性缺失**：
      课题线内没有具备法务资质的成员，也不打算引入。
      继续把 M0 挂在「待复核」状态，只会让后续每个模块都带着一个永远不会关闭的前置条件。

    workaround: |
      1. 定性照做，但状态改用 `qualification_status: self_assessed_no_legal_review`
         （原方案的 approved 状态**在本项目中不再存在**，避免造成"已获批准"的错觉）；
      2. M0 与 M9 的完成标记改为「技术侧完成（未经法务复核）」，不得标记为通过法务判据；
      3. 所有对外材料（汇报、答辩、PPT、论文）中凡引用合规结论处，
         必须带一句固定免责表述（见 mandatory_disclaimer）。

    mandatory_disclaimer: |
      本方案的跨境数据合规判断由技术方依据公开法律条文自行起草，**未经法务或合规专业人员复核**，
      不构成法律意见，不得作为实际业务上线的合规依据。

    compensating_controls:
      - "每条定性必须引用 modules/m0_compliance/legal_references.md 中的**逐字原文**，不得写「据我所知」"
      - "每条定性必须写明「不确定点」——写不出不确定点的定性视为未经思考，不予采纳"
      - "定性结论中凡涉及「可以跨境」的判断，一律取**最严解释**；
         在两种解释之间无法判定时，按更严格的一种执行（宁可少做，不可错做）"
      - "M9 的一致性核验照常执行——它核的是「说的和做的是否一致」，与有无法务无关"
      - "PIPL 第 55 条已明确本项目至少命中三项须做 PIPIA 的情形；
         PIPIA 照做，但同样标注未经法务复核"

    expiry_condition: |
      下列任一情况发生，本豁免立即失效，须回头补做法务复核：
      ① 项目进入真实业务数据试点（不再是公开数据代理验证）；
      ② 方案被提交给汇丰或任何金融机构作为实际上线依据；
      ③ 项目组、mentor 或需求方指定了合规角色；
      ④ 出现任何一次对外发布中遗漏 mandatory_disclaimer 的情况——
         说明免责机制未被执行，须暂停对外发布并复审。

    residual_risk: |
      技术方的法条理解可能有误，且**错误不会被任何独立环节发现**。
      最可能出错的地方：敏感个人信息的范围判定（PIPL 第 28 条「金融账户」的射程）、
      去标识化与匿名化的边界、大湾区简化路径的适用条件。
      风险承担方：仓库所有者。

  - waiver_id: W-002
    title: 初版冲刺模式——四项标准降级以完成端到端初版
    date: 2026-09-03T18:00:00+08:00
    approved_by: conceal008（仓库所有者，2026-09-03 指示「直接把整个项目完成，做不了的标准降级但要说明」）
    status: active
    related_decision_record: DR-GOV-009

    clauses_waived:
      - "《维护约束 v2》3.1：一步一提交（本次改为一模块一提交）"
      - "《Loop 执行规范 v2》0.2：每任务并行 ≥3 条路线并逐条写分支卡"
      - "《方案流程框架 v2》M1：评估数据集 ≥4、每集 6/6 维度、数据卡 6 字段"
      - "《方案流程框架 v2》M8/M9：故障注入 7/7、十项交付清单、一致性核验 100%"

    why_unmeetable: |
      D1 真实与公开数据集尚未下载（Criteo/Hillstrom/Santander 三个 P0 全部缺位），
         M1 的六维评估无评估对象；
      D2 未安装任何第三方联邦学习框架（FATE / SecretFlow / Flower 均未部署），
         且本机无 torch / lightgbm / xgboost；
      D3 M8/M9 需要真实部署环境与法务角色，两者都不存在（后者已由 W-001 登记）；
      D4 按「一步一提交 + 完整自评」推进 8 个模块，在单次会话内不可能完成，
         而所有者明确要求「直接把整个项目完成」。

    workaround: |
      1. **数据**：用自建的结构因果生成器（SCM）产生双方合成数据，覆盖 6 个标准场景；
         真实数据集的六维评估与数据卡**留空待数据到位**，M1 只产出「合成数据卡 + 待办清单」。
      2. **框架**：不引入第三方 FL 框架，用 numpy/scikit-learn **自实现**
         联邦逻辑回归、纵向 GBDT（SecureBoost 式直方图交换）、SplitNN（双向/单向两种形态）。
         实现是**教学级的最小可用版本**，不含任何密码学保护（无同态加密、无秘密分享）。
      3. **提交粒度**：一模块一提交，changelog 合并记录；门禁全绿的要求**不降级**。
      4. **M8/M9**：只产出文档级设计与准入条件，不做故障注入与合规证据链实体。

    mandatory_disclaimer: |
      本初版的全部实验结论基于**自建合成数据**与**自实现的教学级联邦学习算法**，
      不含任何密码学保护，未在任何真实数据或生产框架上验证。
      结论只能用于「方法在何种数据条件下有效」的机制层判断，
      **不得外推到真实业务，也不得作为平台选型或上线依据**。

    compensating_controls:
      - "合成数据的生成参数全部可配置且 ground truth 已知，使「理论增益 vs 实测增益」可被检验"
      - "所有实验 ≥5 种子、主指标带 bootstrap 置信区间——这条统计严谨性要求**不降级**"
      - "L1 基线与 L3 同等认真实现，不得为凸显 VFL 而弱化 L1"
      - "自实现算法必须给出与集中式上界（L4）的对照，用以暴露实现误差"
      - "每份产出文档首部带 mandatory_disclaimer"
      - "门禁 1/2/4/6 与 22 组回归全部保持生效"

    expiry_condition: |
      ① 三个 P0 数据集到位 → M1 的六维评估与数据卡必须补做，本降级对 M1 失效；
      ② 引入任何第三方 FL 框架 → 自实现算法须与框架实现交叉验证；
      ③ 方案进入真实数据试点或对外作为选型依据 → 本豁免整体失效，须重做；
      ④ 需求方裁定「神经网络禁令」有效 → SplitNN 相关结论须标注为不适用。

    residual_risk: |
      自实现算法可能有实现错误，而**没有第三方框架可作交叉验证**。
      已用「与集中式上界对照」作为部分缓解：若联邦实现与集中式差距异常，
      多半是实现问题而非方法问题。但这只能发现大错，发现不了系统性偏差。
      风险承担方：仓库所有者。
