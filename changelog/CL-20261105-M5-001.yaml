  状态类字段同步：BC-M5-018（新增 sgb_i2i3_all_tasks 完成、plaintext_wallclock 待做）、step_ledger（追加 S5.M9，新增第五阶段预算 1 / 2）、
  registry/module_status.yaml 的 M5（重新认领至 2026-11-06 08:55）与 governance、M5 README、项目进度总览（notebook 79 → 80、带输出 51 → 52；组件声明 103 → 104）。
why: |
  所有者 2026-11-05 08:45 回复「继续」。报告 v1.5 的头号结论「I2 + I3 普遍有效」主要来自明文代理，真实 SGB 上只在 3 个任务做过；
  S5.M7 的明文直方图使其余任务的 SGB 复核首次能在会话容器内分段完成。
  结果（开发证据）：
  - SGB 上 I2 + I3 在 14 个任务中 12 个成立（+0.006 ~ +0.050），9 个经 14 个任务内 Holm 后仍成立；不成立：mock 重合 50 +0.0042 [−0.0034, +0.0114]、IEEE 第 1 块 +0.0096 [−0.0025, +0.0229]。
  - 与代理结论一致 11 / 14：mock 重合 20、mock 重合 80 仅 SGB 成立；IEEE 第 1 块仅代理成立。合并 S5.M2 / S5.M8 的 3 个任务，17 个中 15 个在 SGB 上成立。
  - 28 个配置中 7 个与代理之差超出 0.005：原版联邦 5 个（COIL2000 −0.014、Orange 流失 −0.010、Orange 大版追加销售 −0.006、HomeCredit −0.005、IEEE +0.009），
    优化版联邦 2 个（COIL2000、mock 重合 80 +0.006，S5.M2 已知）；按 DR-M5-012 · D-1 降级。原版参数下方向不一致（S5.M2 为 SGB 偏高），「原版 → 优化版」的幅度以 SGB 为准。
  - 24 次新拟合的前 2 棵明文抽查全部逐位一致。
