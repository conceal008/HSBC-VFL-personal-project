what: |
  按所有者授权启用 main 分支保护档位 A：禁止 force push、禁止删除分支、保留直推，
  且保护对管理员同样生效（enforce_admins=true）。
  同时登记 1.1 中「禁止直推 / 必须经 PR / CI 通过方可合并 / ≥1 approve」四条仍未满足，
  并写死升级到档位 B 的三条触发条件。

why: |
  main 此前完全无保护，1.1 中「force push 禁用」这条无从谈起——而本项目已两次依靠
  「不 force push」保住有价值的记录（一次未生效的更正、CI 上一条 failure）。
  档位 A 以零摩擦代价把这条落到实处。
  enforce_admins 设为 true 的理由：本仓库只有所有者一人有写权限，若管理员豁免，
  「禁止 force push」对唯一能执行它的人不生效，这条保护就只是装饰；
  紧急情况的正确路径是 2.4 写明的「临时解除保护，事后立即恢复」，而不是留一个常开后门。

