# S6.P4 · G3 五臂对比 FedAds 补充冻结（机器可读部分）
# ---------------------------------------------------------------------------
# 状态：frozen（2026-10-27）。S6.P3 文件不改；本文件只补 S6.P3 对 FedAds 没有写定或无法执行的部分，其余全部继承 S6.P3。
# 冻结时已完成按用户号的行筛选（不读标签）；开发评估集的标签在冻结提交之前没有被计算或查看。
# 决策记录：DR-M6-002；授权：DR-GOV-017 · D-1、D-3。本文件不含任何行数据或逐行结果。
# ---------------------------------------------------------------------------
step_id: S6.P4
purpose: 写定 FedAds（官方纵向切分）上 G3 比较的数据分组、封存段、编码、各臂的适配与停止规则，供 S5.G3 执行
