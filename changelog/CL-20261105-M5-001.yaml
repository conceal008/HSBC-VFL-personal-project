  - 新拟合用主动方明文直方图版本（S5.M7）；每次正式拟合前抽查前 2 棵原版与明文逐位相同，并按明文前 2 / 4 棵外推全部棵数（上限 7,000 秒）。
  - 分段运行（每段预算 6,800 秒，可续跑），共 8 段；对比口径同 S5.M2 / S5.M8，另在 14 个任务之间做 Holm。
