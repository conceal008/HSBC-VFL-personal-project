title: S5.M6 M8 增量学习器：12 项预先写定的对比 Holm 后 0 项显著，按增量排序没有显著优于按响应排序，联邦特征没有显著改善增量排序
what: |
  方法筛选第三阶段（第二批，DR-M5-014）第 2 步。Hillstrom 邮件营销（64,000 行）与 Criteo Uplift v2.1（1 / 14 伯努利抽样，约 100 万行）两个公开随机试验，
  结果 visit 与 conversion；两方字段归属沿用 M1 冻结配置，处理变量与结果只由主动方持有。
  - S / T / X / R 四种增量学习器与响应模型（只用处理组拟合），XGBoost 基模型无行 / 列采样，拟合确定；
  - 特征集：只用内地特征 vs 联邦（两方全部特征）；基模型配置按验证对数损失、学习器按验证 Qini 选，测试集评一次；
  - Qini 系数与前 30% 人群增量，测试行 bootstrap 1,000 次；三项对比预先写定，每个数据集 × 结果内 Holm。
  新增：
  - 组件 uplift_screen 与单测、组件声明 M5-uplift_screen；
  - 运行配置 configs/s5_m6_uplift.yaml；
  - 带汇总输出的运行入口 notebook S5.M6_1（从原始文件重跑 Hillstrom 并核对）；
  - 公开汇总 results/uplift_screen_v1/；
  - DR-M5-014 复核段 review_20261104_s5m6。
  状态类字段同步：BC-M5-018（uplift_learners 完成）、step_ledger（追加 S5.M6，第三阶段 2 / 2 完成）、registry/module_status.yaml 的 M5 与 governance、
  M5 README、项目进度总览（notebook 76 → 77、带输出 48 → 49；组件声明 100 → 101）。
why: |
  报告列为第二批的 M8 增量学习器此前没有做。M8 回答「营销带来多少增量」，不是提升 AUROC 的方法；所有者要求只要在个别数据集上有明显增益就写进报告。
  结果（开发证据）：
  - 12 项预先写定的对比经 Holm 后 0 项显著。按增量排序没有显著优于按响应排序（0 / 8）；联邦特征没有显著改善增量排序（0 / 4）。
  - 名义显著 2 项都在 Hillstrom、方向相反：visit 联邦 − 内地 −0.0020 [−0.0040, −0.0001]（联邦一侧验证集选了测试上最低的 T）、conversion +0.00036 [+0.000004, +0.00076]。
  - Criteo 上响应模型与最好的增量学习器几乎一样；conversion 事件少（测试 117 / 566 个）。
  - 报告写为「已做、未见明显增益」，并写明原因。
