what: |
  联网查证并建立 M0 的法条引用底稿：PIPL 第 4/13/23/24/28/38/39/55/56/73 条逐字原文；
  PDPO 第 VIA 部的条文编号（35C 告知与同意 / 35E 未获同意不得使用 / 35G 停止使用 /
  35K 提供予他人须书面同意 / 35L 停止提供）与罚则；保障资料原则 DPP 1 与 3 的要点；
  跨境理财通 2.0（2024-02-26 施行）的个人额度 300 万元、准入满 2 年、R1–R4 等业务口径。
  据此把 S0.1 的假设 A-8 从「不引用具体数值」改为已查证，并更新术语表五条。

why: |
  S0.1 刻意没写监管数值，因为凭记忆写数字违反 AGENTS 铁律 1。
  但 S0.3 要给八类跨境对象逐条定性并附 ≥1 条法条引用——没有原文底稿，
  那些引用只能是「据我所知」，而这恰恰是法务复核时最先被质疑的地方。
  查证过程本身也产出了一条此前未被识别的事实：PIPL 第 28 条明列「金融账户」为敏感个人信息。
  本项目的特征与标签大量来自账户与交易，若整体落入敏感个人信息，
  合规要求会显著上升（单独同意 + 事前 PIPIA），M4 的敏感度分级起点也随之改变。
  这条不是推论，是条文明文；但「本项目是否落入」仍是定性，属 S0.3/S0.4 且须合规角色复核。

