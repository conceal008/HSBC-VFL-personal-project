# 分支卡 · M5 五级基线阶梯的多路线对照
#
# 本卡同时清偿《初版完成说明与降级清单》§5 第 2 项欠账：
# 初版把 L3 三条路线在同一提交中并行实现，未逐路线建卡（代偿为结果分别独立报告）。
# 本卡把全部七条路线的定位、判据、结果与去留一次性登记清楚。

card_id: BC-M5-001
title: 五级基线阶梯的七条路线对照
module: M5
status: active                    # active | archived | abandoned
opened_at: 2026-09-03
opened_by: Claude (Opus 5, Claude Code)
related_steps: [S5.1, S5.2, S5.3, S5.4, S2.3]
related_changes: [CL-20260903-M5-001, CL-20260903-M5-002, CL-20260903-M2-002]
decision_records: [DR-GOV-009]

question: |
  纵向联邦（L3）相对于合规成本低得多的替代方案（L0/L1/L2），究竟多带来多少价值？
  L3 内部的三条技术路线各自的效果与暴露面如何权衡？

selection_criteria: |
  - 判别力：测试集 AUC，跨种子 95% 置信区间
  - 决策等价性：Top-10% 名单重合度（AUC 接近不等于名单一致）
  - 通信成本：轮数与浮点数量
  - 隐私暴露面：M7 的攻击结果（标签泄露、特征反演、成员推断）
  - 合规成本：跨境对象的性质（聚合量 / 逐人标记 / 逐人中间量 / 原始数据）

routes:
  - id: L0
    name: 内地单方建模
    role: 下界基准
    exposure: 无跨境
    tuned_test_auc: 0.7122
    verdict: keep
    note: 一切增益都相对它度量。

  - id: L1
    name: 本地模型 + 对方 k-匿名聚合统计
    role: "**VFL 的真正竞争者**——合规成本几乎为零"
    exposure: 聚合量，非个人信息
    tuned_test_auc: 0.7148
    verdict: keep
    note: |
      刻意给到最大搜索空间（60 组 = L0 的 12 倍）。三个口径下均只捕获小部分价值：
      正规选参 2.1% · oracle 上界（作弊）15.5% · 40 种子安慰剂对照 12.3%。
      瓶颈是结构性的——分段键只能用主动方特征，回传统计量因而是主动方特征的函数。

  - id: L2
    name: 本地模型 + 对方粗粒度标记
    role: 中间态
    exposure: 逐人低维标记
    tuned_test_auc: 0.7254
    verdict: keep
    note: 略优于 L1，但已构成逐人个人信息出境，合规成本跳档。

  - id: L3a
    name: 纵向联邦逻辑回归（残差 ↔ 部分 logit 交换）
    role: L3 路线一
    exposure: 逐人中间量（双向）
    tuned_test_auc: 0.8352      # ⚠️ 已作废为取舍依据，见 falsifier_outcome
    verdict: keep
    note: |
      效果最好且与集中式数学等价（可用于实现正确性验收）。
      **但 M7 证明它在无防护时双向完全泄露**：主动方 6 个辅助样本即可精确恢复
      被动方特征（R²=1.0000），被动方从首轮残差即可完全推断标签。
      被动方必须对上行加噪（σ≈0.1，代价 0.0014）；标签侧须走协议级手段。

  - id: L3b
    name: 纵向 GBDT（SecureBoost 式 (g,h) 直方图交换）
    role: L3 路线二
    exposure: 逐人梯度与分桶统计
    tuned_test_auc: 0.7954      # ⚠️ 已作废为取舍依据，见 falsifier_outcome
    verdict: keep
    note: |
      在**线性**合成数据上落后于线性路线，当时已标注「很可能是生成假设造成的」。
      **S2.3 证实了这一点**：换用强交互信号后（N2，λ=2.0）它反超至第一
      （0.8193 vs L3a 的 0.7903）。原先的「落后」是模型族与生成机制不匹配，
      不是路线本身的缺陷。verdict 由 keep_with_caveat 改为 keep。
      另：M7 发现它的成员泄露随树深上升（深 3→6 为 0.528→0.545）。

  - id: L3c
    name: SplitNN（形态A 双向 / 形态B 冻结随机 / 形态B 冻结自监督）
    role: L3 路线三
    exposure: 形态A 含梯度回传；形态B 仅上行嵌入
    tuned_test_auc: 0.8210      # ⚠️ 已作废为取舍依据，见 falsifier_outcome
    verdict: keep_pending_ruling
    note: |
      **本路线的存废取决于待裁定第 5 项**（7/29「不引入神经网络」是否仍有效）。
      DR-GOV-009 决定不预先裁定而是两条路线都实现，用实测支撑后续裁定。
      现已具备裁定所需数据：形态A 比形态B 自监督高 0.045 AUC（不回传梯度的代价）；
      形态B 随机编码器 0.7076 **低于 L0 基线**，故形态B 必须配自监督预训练。
      M7 另发现：形态B 挡住梯度标签泄露（1.00→0.50），但特征反演反而更严重
      （R² 0.667 > 形态A 的 0.488）——它换掉的是标签暴露面，不是特征暴露面。

  - id: L4
    name: 集中式（原始数据汇集）
    role: 上界基准
    exposure: 全量个人信息
    tuned_test_auc: 0.8390
    verdict: keep
    note: 仅作上界参照，合规上不可行。

falsifier: |
  若换用第二种 SCM 结构（非线性信号）后，L3b 纵向 GBDT 的排序反超线性路线，
  则「调参后 L3a > L3c > L3b」这一排序被判定为生成假设的产物，本卡的 tuned_test_auc
  一列不得再作为路线取舍依据，须重新登记。

falsifier_outcome:
  status: FIRED                     # 2026-09-03，S2.3
  evidence: |
    在强交互信号场景 N2_交互_高（signal_form=interaction，λ=2.0）下排序反转：
    L3b 纵向 GBDT(0.8193) > L3c SplitNN(0.7966) > L3a 联邦LR(0.7903)。
    阶跃形式的 N4_阶跃_高 下 L3b(0.7926) 也升到第二，超过 SplitNN(0.7843)。
    而在 λ=0.8 的弱非线性场景（N1、N3）与线性对照（N6）下，L3a 仍居首。
  ruling: |
    **`tuned_test_auc` 一列自即日起不得作为路线取舍依据。**
    它度量的是「在本 SCM 的生成假设下谁更契合」，不是「哪条路线更好」。
    三条 L3 路线的取舍必须改由**暴露面与合规成本**决定（M7 的攻防结果），
    效果维度只能给出「在已知机制下的条件性排序」。
  what_it_means: |
    这不是某条路线更差，而是**模型族与数据生成机制的匹配问题**：
    信号可加时线性路线占优，信号含强交互时树模型占优。
    真实业务数据的机制未知，因此**任何单一合成数据上的效果排序都不可外推**。
  next_action: |
    路线取舍改以 M7 的暴露面结论为主（见 routes 各条的 exposure 与 note）；
    效果维度在接入真实数据前只作条件性陈述。

next_review: 接入真实数据后，或引入第三种生成机制时
