what: |
  用真实隐语 SGB 复核 S5.M1 的代理结论（DR-M5-012 · D-1 / D-5），方法筛选阶段第 2 步。
  隐语 secretflow-lite 1.13.0b0，debug 单进程两方模拟，OU；配置全部沿用 S5.M1 在验证集上选定的配置，每个（任务，方法）拟合一次（seed 11）。
  范围：UCI（原版、优化版、M1）、Orange 偏好（原版、优化版）、Santander G3（优化版、M1）、mock 重合 80（优化版）、
  FedAds（优化版、M6、M1x）、COIL2000（优化版、M6）。
  新增：
  - 组件 method_screen_sgb 与单测（M1 / M1x 通过替换标签方的初始预测实现，推理时加回；M6 成员逐个存档可续跑）；
  - 运行配置 configs/s5_m2_sgb_confirm.yaml（含未执行项与原因）；
  - 带汇总输出的运行入口 notebook S5.M2_1；
  - 公开汇总 results/method_screen_sgb_v1/；
  - 组件声明 M5-method_screen_sgb。
  状态类字段同步：
  - DR-M5-012 追加 S5.M2 复核；BC-M5-018 的 sgb_confirmation 路线完成，新增推迟路线 sgb_mock80_bagging；
  - step_ledger（追加 S5.M2，阶段预算 2/2 用完）；
  - registry/module_status.yaml 的 M5 与 governance；
  - M5 README；
  - 项目进度总览（notebook 72 → 73、带输出 44 → 45；组件声明 97 → 98）。
why: |
  S5.M1 用明文代理筛选，DR-M5-012 · D-1 规定选出的方法要在真实 SGB 上复核，同配置下差的绝对值 > 0.005 则降级。
  结果（单次拟合；区间只含测试集抽样；开发证据）：
  - 代理与 SGB：13 组里 9 组在 0.005 以内；超出的 4 组（UCI / Orange 偏好的原版参数，mock 重合 80 / COIL2000 的优化版）SGB 高约 0.006，按 D-1 降级；
  - I2 + I3：UCI +0.010 [+0.001, +0.019]、Orange 偏好 +0.036 [+0.017, +0.057]，成立，幅度小于代理（+0.018 / +0.044）；
  - FedAds：M6 +0.011 [+0.006, +0.017]、M1x +0.013 [+0.005, +0.021]，成立；
  - COIL2000 上 M6 +0.003 [−0.003, +0.009]，区间含 0；M1 在 Santander G3 与 UCI 不显著。
  未执行：Orange 流失（已有 SGB 证据）；mock 重合 80 的 M6（约 4.5 小时，推迟）。
