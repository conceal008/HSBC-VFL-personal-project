what: |
  方法筛选第五阶段（DR-M5-016）第 1 步。隐语 secretflow-lite 1.13.0b0 sgb_v，debug_mode 单进程两方模拟，OU。
  - 14 个任务（mock 平衡 / 重合 20 / 50 / 80、Orange 流失 / 升级小版、Orange 大版追加销售 / 偏好、Santander G3 / 交易、FedAds、HomeCredit、COIL2000、IEEE 第 1 块）
