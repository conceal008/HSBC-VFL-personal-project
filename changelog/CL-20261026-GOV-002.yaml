title: S-GOV.17 复核 DR-GOV-016：HSBC mock 不可执行改由 FedAds，主对比加规模标注
what: |
  新增 registry/decision_records/DR-GOV-017.yaml，复核 DR-GOV-016（触发条件①：G3 Santander 主对比完成）。三项取舍：
  D-1 推翻条件ⓐ——核对本机文件后 HSBC mock 三档按预注册规格不可执行（档内重合率均为 100%、档位只改样本量；客户来自 10/21 汇报样本；
  单月正例只有目标的约 6%–25%；无生成器可产封存段），不运行；第二组证据改由 FedAds，先由 M6 补充冻结，S5.G3 整体先于 S5.G2；
  D-2 推翻条件ⓑ不照字面改标——主对比保留「可分辨的提升」，凡引用处同时给出规模标注（正例 586 < 700；可检出差异 0.024 > 0.02）；
  D-3 DR-GOV-016 其余各项逐项复核（D-5 已解除；S5.G1 私有产物已写回本机并核对 sha256）；执行顺序改为 M6 FedAds 补充冻结 → S5.G3 → S5.G2。
  registry/module_status.yaml 的 governance、M0 对 S0.9 的输入、M5 next_step、experiment_pause（review_record、connection_note）同步；
  M5 README「下一步」与 step_ledger next_step、results/g3_santander_v1/README.md「适用边界」同步；BC-M5-017 路线拆为 FedAds 与 HSBC mock 两条并加 history。
why: |
  DR-GOV-016 的 review_trigger ① 已到；S5.G1 提交只落实了 D-2 推翻条件的执行顺序，没有处理「主对比按未达可检出规模报告」。
  照字面执行会与冻结的 evaluation_protocol.md 第四节相抵：该标签只用于「区间含 0 且可检出差异 > 关心尺度」，
  主对比区间 [0.033, 0.053] 不含 0。把冲突和处理方式写成记录、给出两条推翻条件，而不是在报告里悄悄二选一。
  推翻条件ⓐ默认 HSBC mock 能补上第二组证据；运行前核对数据结构才发现它的正例比 Santander 第一批更少、档位也不对应重合率。
  这一核对只用了文件的汇总计数，没有任何 G3 臂接触 HSBC mock，不构成依结果改动。
  所有者 2026-10-26 把执行层面的取舍交给 Agent 按项目终点判据判断（DR-GOV-016 原文登记）；本记录的 D-1、D-2 均可由所有者一句话推翻。
