dr_id: DR-M5-013
title: 方法筛选第二阶段：组合选择改为训练集交叉验证（S5.M3），补做 mock 重合 80 的 M6 真实 SGB 复核（S5.M4）
date: '2026-11-03T14:30:00+08:00'
agent: Claude (claude-opus-5-5, Claude Code)
module: M5
status: active
supersedes: null
requested_by: conceal008（所有者 2026-11-03 14:00 回复「继续」；此前 PR #19 与会话说明列出的待决事项为：组合选择改交叉验证、mock 重合 80 的 M6 真实 SGB、第二批 M7 / M8 / Orange 大版）
related_step: S5.M3
related_change_id: null
preregistration: 本记录在 S5.M3 启动前写定；运行代码与配置的 sha256 在启动时另记于私有运行目录 cv/fingerprint_launch.txt
amends: 无；DR-M5-012 的方法筛选阶段（S5.M1、S5.M2）已结束，本 DR 新开第二阶段

context: |
  DR-M5-012 复核发现：单一验证集分不开 0.005 量级的差距；「验证 AUC 距最优 ≤ 0.001 时取计算量最小」系统性偏向联邦部分很小的 M1，
  在 Orange 流失 / 偏好上选中的组合在测试集上变差，FedAds 上验证集否定的 M6、M1x 在测试集上有增益。
  S5.M2 推迟了 mock 重合 80 上 M6 的真实 SGB 复核（6 个成员约 4.5 小时）。
  所有者回复「继续」。本 DR 按此理解授权待决清单的前两项；第二批（M7 需双 VM 上的 LR 轨道，M8、Orange 大版）仍先报所有者，不在本阶段。

decisions:

  - key: D-1
    question: 授权与范围
    decision: |
      新开「方法筛选第二阶段」，2 步：S5.M3 交叉验证选组合（14 个任务，明文代理）；S5.M4 mock 重合 80 的 M6 真实 SGB 复核。
      不新增方法、不改 S5.M1 的候选与配置、不改 S5.M1 / S5.M2 的已提交结果。
    rationale: 所有者回复「继续」；两项都是 S5.M1 / S5.M2 留下的、已登记在 BC-M5-018 的路线。
    falsifier: 所有者表示「继续」不指这两项 → 本阶段结果作废。

  - key: D-2
    question: 交叉验证怎么做
    decision: |
      - 候选与 S5.M1 相同：P、P_M4、M1、P+M6、M1+M6、P_M4+M6，有非共同客户时加 M1x、M1x+M6。各候选的配置取自 S5.M1 结果 JSON，不再调参。
      - 只用 final 视图的训练行（= 全部训练集）；测试集不参与任何选择。
      - 折按数据结构：行独立的 9 个任务分层 5 折；Santander G3 按客户分组 5 折（训练与验证客户不重叠）；
        mock 四档按月份滚动外推 3 折——验证 2015-08/09、2015-10/11、2015-12/2016-01，每折只用更早的月份训练，非共同客户行同样只用更早的月份。
      - 交叉验证内训练 seed 固定为 11（= S5.M1 tune seed）；M6 成员 seed 为 11 × 100 + j。
    rationale: |
      mock 的测试集是同一批客户的后续月份，按行或按客户随机分折都会让验证集比测试集「更容易」；滚动外推与测试的时间结构一致。
      Santander G3 每位客户约 7 行，按行分折会泄漏客户信息。
    falsifier: 任何选择读了测试集标签 → 该任务结果作废重跑。

  - key: D-3
    question: 选择规则（先于结果写定）
    decision: |
      - R1（主规则）：交叉验证平均 AUROC 最高的候选。
      - R2（对照）：与 R1 的逐折配对差不低于 −1 倍标准误（标准差 / √折数）的候选中，取计算量最小者；并列取平均 AUROC 高者。
      - 两个规则选出的组合都在测试集上评一次。
    rationale: R1 去掉「取最省」带来的偏向；R2 保留省成本的意图，但把容差从固定 0.001 换成交叉验证自身的噪声。
    falsifier: 无（规则是范围声明）。

  - key: D-4
    question: 评估口径与判定
    decision: |
      - 测试集 6 个 seed（11–66）；对比 CV_R1 − P、CV_R2 − P、CV_R1 − 内地单边 G_t、CV_R2 − G_t；
        两层 bootstrap（测试客户簇 × seed，1,000 次，seed 20261102）给 95% 区间与 p，数据集内 4 项对比做 Holm。
      - 与 S5.M1 的单一验证集组合并列报告（直接引用 S5.M1 结果，不重算）。
      - 判定「交叉验证比单一验证集好」：CV_R1 − P 区间整体在 0 以下的任务数 < S5.M1 的 2 个，且区间整体在 0 以上的任务数 ≥ S5.M1 的 3 个。
      - 各任务的测试集在以往步骤中已评过，结果一律记为开发证据。
    rationale: 沿用 S5.M1 的统计口径，使两种选择方式可以直接比较。
    falsifier: CV_R1 在 ≥ 2 个任务上显著劣于 P → 交叉验证没有解决选择问题，报告如实写明。

  - key: D-5
    question: S5.M4 怎么做
    decision: |
      用仓库组件 method_screen_sgb（S5.M2 同一实现）在 mock 重合 80 上跑 M6：6 个 SGB（行采样 0.8，seed 1100–1105），成员逐个存档、可续跑；
      与 S5.M2 已有的同任务 SGB 优化版打分配对，给 M6 − 优化版的 SGB 配对差，并与同配置代理比较（DR-M5-012 · D-1 的 0.005 容差）。
      单次拟合，区间只含测试集抽样（同 S5.M2）。
    rationale: 补齐 S5.M2 唯一推迟的一项；代理上 M6 在 mock 重合 80 +0.009。
    falsifier: SGB 与代理差的绝对值 > 0.005 → 该任务 M6 的代理结论降级为「以 SGB 为准」。

falsifier: |
  本记录整体被推翻的条件：①运行代码在启动指纹之后因看过测试结果而修改却未另立版本；②任何选择读了测试集；③所有者表示「继续」不授权这两项。

review_trigger: |
  S5.M3 全部 14 个任务完成时；S5.M4 完成时。

