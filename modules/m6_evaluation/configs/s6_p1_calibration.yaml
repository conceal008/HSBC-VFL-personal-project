# S6.P1 · 配对比较判据的纯合成校准（DR-MX-002 · D-1、D-2 的推翻条件）
# 全部为程序生成的合成打分；不使用任何代理或真实数据，不训练模型，不运行 PSI 或攻击。
step_id: S6.P1
purpose: 在零效应与已知效应的合成设定下，检验新判据的第一类错误率、与旧判据和符号翻转检验的功效对比，以及 S0.1P 可检出差异近似的准确度

seed: 20261025

# 检验参数
alpha: 0.05
power: 0.80

# 合成设定：潜变量 z ~ N(0,1)，y ~ Bernoulli(sigmoid(c + signal·z))，c 使正例率等于 base_rate；
# 模型打分 = z + 系统误差（每个模型抽一次、各 seed 共享）+ seed 误差（每个 seed 各抽一次）。
# 两个模型的系统误差相互独立。
# 正例率取 10% 以缩短计算：S0.1P 已示所需正例数几乎不随正例率变化（3.0% 与 1.0% 相差不到 2%）。
base_rate: 0.10
signal: 2.0
sigma_a: 0.5                 # 模型 A 单个 seed 的总噪声；总体 AUROC 约 0.85
sigma_seed: 0.10             # seed 误差（训练随机性），远小于系统误差
n_large: 200000              # 估计总体 AUROC 用的大样本
sigma_search_max: 3.0        # 二分搜索模型 B 噪声的上界

# 测试集正例数档位：441 为 S0.1P 在 AUROC 0.86、相关 0.8 时检出 0.02 所需；150 为 LR 路线 FedAds 的量级
n_pos_targets: [150, 441]

n_seeds: 6                   # 新判据要求；前 5 个 seed 另用于旧判据对照
n_boot: 400                  # 校准用；正式比较按 evaluation_protocol v1 用 ≥2000
n_rep_null: 400              # 零效应重复次数；第一类错误率的蒙特卡洛标准误约 0.011
n_rep_alt: 300               # 已知效应重复次数

# D-1 推翻条件：零效应下新判据的第一类错误率上限
type1_ceiling: 0.07
# D-2 推翻条件：以 S0.1P 预测的可检出差异为真实差距时，功效应落在此区间
# （对应所需正例数与预测相差不超过 25%：Φ(2.80/√1.25 − 1.96) ≈ 0.707，Φ(2.80·√1.25 − 1.96) ≈ 0.879）
power_band: [0.707, 0.879]

# D-2 触发后的预定后果「改用模拟法」：正式报告的可检出差异改用配对差的重抽样标准误。
# 其准确度判据由 D-2 的同一阈值换算：所需正例数偏差 ≤ 25% ⇔ 标准误比值在 [1/√1.25, √1.25]。
# 本段在第一次运行显示 D-2 触发之后加入（2026-10-25）；判据不是看到结果后另定，而是同一阈值的换算。
bootstrap_se_ratio_band: [0.894, 1.118]
# 用模拟法重算所需正例数的目标差距（对应 S0.1P offline_auc_positives.csv 的口径，新结果另存新文件）
mde_targets: [0.01, 0.02, 0.03]
s01p_default_correlation: 0.8
# 第二次运行后订正（2026-10-25）：所需正例须按**备择**设定下的配对差标准差求，
# 第二次运行误用了零效应下的标准差（偏小，会低估所需正例）。模拟从 441 个正例起步，在所需规模处修正一次。
sd_start_positives: 441
n_rep_sd: 300

# 符号翻转检验最小 p 值展示的 seed 数
sign_flip_seed_range: [5, 6, 7, 8]
