what: |
  三处修复 + 一条根因记录。

  1. CL-20260831-GOV-017 在描述上一次误报时把那串 16 位文章 ID **原样写进了正文**，
     该行不含 URL，跳过规则不适用，门禁 1 再次拦截。已改为描述性表述。
  2. ci/tests/run_gate_tests.sh 里**字面写死了一个 19 位卡号形态的样本**——
     这直接违反了我自己在 CL-20260830-GOV-006 里定下的夹具纪律
     （标识形态样本一律运行时拼装，绝不落盘）。已改为 printf 拼装。
  3. 新增 ci/run_all_gates.sh 作为提交与推送前的**唯一入口**。

  **真正的根因（前两次误判都源于此）**：我把门禁写成
  `bash ci/check_secrets.sh | tail -1 && python3 ... && git push` 这类形式，
  而**管道的退出码是 tail 的，永远为 0**——`&&` 链形同虚设。
  所以第一次终端只显示 "Exit code 1" 我误判为网络问题；
  第二次输出可见却依然打印了"✓ 全绿"并推送成功。
  不是"忘了看输出"，是**验证机制本身是坏的**。

why: |
  两次失误的形式不同，根因相同：**验证门禁的那条命令本身就是错的**，
  管道吞掉了退出码，于是"门禁通过"这个前提从来没有被真正检查过。
  自律层面的纠正（"下次记得看输出"）解决不了这个问题——第二次正是在输出可见的情况下发生的。
  正确的解法是把检查逻辑固化成脚本：`ci/run_all_gates.sh` 用显式退出码判断替代管道，
  失败时明确打印"禁止推送"。
  真正的解法是分支保护档位 B：CI 不通过就合不进 main，把约束从人的习惯
  移到系统里。DR-GOV-006 的 falsifier ① 已因此命中第 2 次，须提请所有者决定升级。

  在升级前，本会话采取的临时纪律是：门禁链必须以 && 串联、输出不得重定向到
  /dev/null、任何一道失败都停在原地诊断。但必须承认这只是自律，不是保障。

