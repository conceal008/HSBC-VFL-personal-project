title: 实现评估指标库并画出纵向联邦的条件价值曲线
what: 实现 AUC、KS、Lift@K、Recall@K、Qini 曲线、AUUC、Uplift@K、Top-K 名单重合度、bootstrap AUC 差值置信区间；在四个结构参数上画出增益曲线，并给出盈亏平衡分析。
key_finding: '**互补性 λ 是唯一的主导因子**：增益从 λ=0 的 0.025 到 λ=2.0 的 0.209，跨度八倍。


  **AUC 接近不等于决策一致**：L1 与 L3a 的 Top-10% 名单仅重合 46%，即改用 L1 会换掉一半以上的目标客户。


  **盈亏平衡的反直觉结论**：单人增益在低重叠时最高（ρ=0.05 时 0.102），但可触达人数极小；总价值 = 增益 × 人数，在中高重叠区最大。只看 AUC 增益会得出「重叠率越低越好」的错误结论。


  **响应率不等于增量**：被动方数据使 Top-10% 增量近乎翻倍（+91%），而 AUUC 只涨 29%——被动方数据主要帮助在高分段里把人挑对，这正是营销预算实际花的地方。'
why: 「联邦学习有没有用」不可回答，「在什么条件下有用」才可回答。框架要求 M6 产出条件增益曲线而非单点指标，正是为此。另外 Top-K 名单重合度是把统计指标翻译成业务决策的唯一途径——业务上起作用的是名单，不是
  AUC 小数点后第三位。
