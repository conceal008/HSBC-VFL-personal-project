title: 整理 M0 可行性论证全过程为独立文档，置于仓库根目录
waiver_ref: W-001

what: |
  按所有者要求，把 M0 的 S0.1–S0.8 论证链条整理成一份可独立阅读的文档
  `可行性论证全过程.md`（410 行，7 节 + 附录），置于仓库根目录。

  结构：摘要三句话 · 论证链条总览（含 13 个编号结论的推导关系图）·
  逐环节论证 7 节 · **关键数字汇总表（区分法条事实 / 可复算推论 / 显式假设 / 未经复核的自评）** ·
  论证过程中的自我修正 3 处 · 这个论证可能错在哪（按影响排序 5 条）·
  给读者的三个提醒 · 待裁定事项 · 文件索引。

  同时在 README 新增「一之二、先读这一份」小节指向它。

why: |
  M0 的产出分散在 9 个步骤、8 份文档、4 个 notebook、9 份 DR 里。
  需求方与 mentor 不会逐个翻，而上报文件（escalation_M0-001.md）只讲结论与出路，
  不讲「结论是怎么推出来的」。缺一份能一次读完的论证链条，
  这个上报就只是一句「样本不够」，无法被检验、也无法被推翻。

  文档的三处设计是刻意的：

  1. **关键数字汇总表区分四种性质**——法条原文（✅）· 可复算推论 · 显式假设（⚠️）·
     未经法务复核的自评（🟡）。把它们混在一起读会得出错误的确信程度，
     而这正是这类论证最常见的误读方式。
  2. **单列「论证过程中的自我修正」**——S0.7 推翻 S0.5、A-8 从留白到查证、
     CBA-006 的定性改变。一个论证若从头到尾没有自我修正，
     通常不是它特别正确，而是没被认真检验过。
  3. **单列「这个论证可能错在哪」并按影响排序**——第一条就是最脆弱的两个折损率假设。
     把最容易推翻自己的地方写在显眼处，比等别人来问更有说服力。

  置于根目录而非 modules/ 下，是因为它的读者是需求方与 mentor，不是执行体；
  根目录是他们唯一会主动打开的位置。这与 1.2 的目录结构有轻微偏离
  （根目录原定只放 AGENTS.md / README.md / CHANGELOG.md），
  但未新增顶层目录，按 1.3 无需 DR。

