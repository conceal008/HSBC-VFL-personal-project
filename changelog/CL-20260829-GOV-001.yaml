  为十个模块建立 README 与步骤台账（步数预算对齐框架 v2 的 103 步），
  实现门禁 1（数据合规扫描）并接入 GitHub Actions，
  最后 git init 并推送到 https://github.com/conceal008/HSBC-VFL-personal-project。

why: |
  《维护约束 v2》原则一：仓库是唯一事实来源，任何未写入仓库的知识视为不存在。
  项目此前不存在任何仓库，历史材料散落在维护者本机且含真实数据集，无法整体入库。
  没有仓库，步进式微循环的"一步一提交"、步骤台账、变更日志、CI 门禁全部无处落地，
  M0 的第一步 S0.1 也无处提交。因此初始化是所有后续步骤的前置条件。
  门禁 1 与骨架同批上线，是因为它防的是唯一不可逆的错误（真实数据入 git 历史），
  且本仓库为 Public，该风险被放大。

