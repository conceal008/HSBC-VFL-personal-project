what: |
  S-INIT.5 在 registry/module_status.yaml 写入 `next_step: **S0.1 写预测命题**（…）`，
  行首的 `*` 被 YAML 解析为别名标记，整个文件无法解析。
  后果有二：门禁 2 读该文件取通过线时抛出异常栈（退出码非 0 但看不出是哪个文件坏了），
  回归套件的「门禁2-D 本仓库 HEAD 自检」用例随之 FAIL。
  本次给该值加引号修复，并让 check_step_metadata.py 的 load_yaml 捕获 YAMLError、
  报为 BLOCK 行而不是抛栈。

why: |
  YAML 里 `*` 开头的标量是别名语法，Markdown 的加粗写法与之冲突——
  这类错误在 registry/ 下尤其危险，因为 module_status.yaml 是多个门禁的输入。
  门禁以异常栈的形式失败也是缺陷：使用者只看到一堆调用栈，看不出"哪个文件坏了"，
  与第 0 部分原则三要求的可机器核验相悖。

process_failure: |
  本次错误暴露的不是笔误，而是流程执行问题：提交前的"全门禁复跑"与 git push
  被写在同一串命令里各自独立执行，门禁失败并未阻止推送，导致坏文件进了远端。
  纠正：此后提交与推送必须以门禁全绿为前置条件（命令用 && 串联而非 ;），
  这一条已写入交接记录，供后续执行体沿用。

