title: S5.M12 列采样配置的 SGB 训练随机性——两个方法各 6 个 seed，I2 + I3 在 9 个任务上成立 5 / 9（seed 11 单次 7 / 9）；17 个任务重算 13 / 17
what: |
  方法筛选第六阶段（DR-M5-017）第 2 步。隐语 secretflow-lite 1.13.0b0 sgb_v，debug_mode 单进程两方模拟，OU。
  - 任务：优化版联邦配置列采样 < 1 的全部 9 个任务（按配置判定）：UCI、mock 重合 20 / 50、FedAds、Santander G3、Orange 升级、IEEE 第 1 块、Orange 大版偏好 / 追加销售。
  - 确定性核对：UCI 原版联邦（列、行采样都为 1）seed 22 与存档的 seed 11 不逐位相同（9 / 8,238 个测试样本，最大差 0.146），
    按 D-4 预写分支与 D-8，两个方法都在 seed 11（S5.M2 / S5.M9 存档）之外再拟合 seed 22 / 33 / 44 / 55 / 66，配置不变。
  - 用主动方明文直方图版本（S5.M7）；每个（任务，方法）第一个新 seed 前抽查前 2 棵原版与明文逐位相同，并按明文前 2 / 4 棵外推单个 seed 秒数（上限 7,000 秒）。
  - 每个 seed 分别存档、分段运行（每段预算 6,800 秒，可续跑），组件第 2 版共 22 段；先做全部任务的优化版联邦，再做原版联邦。
  - 对比：两层 bootstrap（测试客户簇 × 两边各 6 个 seed，1,000 次，seed 20261102），点估计为两边 6 个 seed 平均测试 AUROC 之差；同口径另报 seed 11 单次结论与两个方法各自的 seed 标准差。
  新增：
  - 组件 sgb_seeds 与单测、组件声明 M5-sgb_seeds；
  - 运行配置 configs/s5_m12_sgb_seeds.yaml；
  - 带汇总输出的运行入口 notebook S5.M12_1（在 UCI 上重拟合两个方法的 seed 22 并与存档逐位比较，重算对比与跨任务汇总，合并 17 个任务）；
  - 公开汇总 results/sgb_seeds_v1/；
  - 决策记录 DR-M5-017 的 D-8（运行前追加，见 amends）与复核段 review_20261109_s5m12。
  状态类字段同步：BC-M5-018（sgb_seeds 完成）、step_ledger（追加 S5.M12，第六阶段 2 / 2 完成）、
  registry/module_status.yaml 的 M5（重新认领至 2026-11-10 08:17）与 governance、M5 README、项目进度总览（notebook 82 → 83、带输出 54 → 55；组件声明 106 → 107）。
why: |
  所有者 2026-11-07 15:04 回复「继续」。S5.M9 / S5.M2 的 SGB 上 I2 + I3 结论都是 seed 11 单次拟合，区间不含训练随机性，不满足 AGENTS 第 9 条（种子 ≥ 5）。
  结果（开发证据，SGB 上优化版联邦 − 原版联邦，6 seed，括号内为 seed 11 单次）：
  - 成立 5 / 9：UCI +0.0112 [+0.0027, +0.0196]（+0.0102）；FedAds +0.0230 [+0.0112, +0.0353]（+0.0203）；Orange 升级 +0.0328 [+0.0233, +0.0427]（+0.0332）；
    Orange 大版偏好 +0.0220 [+0.0022, +0.0433]（+0.0234）；Orange 大版追加销售 +0.0143 [+0.0074, +0.0212]（+0.0161）。
  - 由成立变为不显著：mock 重合 20 +0.0062 [−0.0056, +0.0177]（+0.0137，seed 11 是优化版联邦 6 个 seed 中最高的）；Santander G3 +0.0053 [−0.0004, +0.0107]（+0.0060）。
  - 两种口径都不显著：mock 重合 50 +0.0051；IEEE 第 1 块 +0.0071。9 个点估计全部为正。
  - seed 标准差：优化版联邦 0.0009 ~ 0.0046，原版联邦 ≤ 0.0003。
  - 17 个任务重算：列采样的 9 个用 6 seed（5 个成立）、其余 8 个仍为 seed 11 单次（8 个成立）→ 13 / 17（单次口径 15 / 17）；与代理结论一致 14 / 17 不变。
