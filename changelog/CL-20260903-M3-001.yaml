type: feat
title: PSI 行为仿真与对齐质量敏感性分析：实体对齐不是本项目的主要风险
what: 实现 PSI 的行为级仿真（不含密码学原语）：对齐规模与偏差、漏配与错配两类失败模式、ECDH-PSI 的通信量与模幂次数量级估计。错配以错位置换实现（保证无样本换回自己）。
key_finding: '**实体对齐质量不是本项目的主要风险。**

  漏配 10% 仅损失约 12% 增益；错配需达约 40% 才使增益折半。

  ECDH-PSI 在千万级对千万级规模下约需 610 MB 通信、2000 万次模幂，工程上不构成障碍。


  过程中修正了一处建模缺口：原生成器只建模漏配（少了人），未建模错配（把甲的特征接到乙身上）。错配危害更大——它注入无关噪声，且在合规上属于**错误的个人信息关联**。该机制本质属对齐层而非数据生成层，故实现在
  M3 而非 M2。'
why: 框架把实体对齐列为独立模块，但对齐质量究竟影响多大此前无量化依据。若对齐是主要风险，工程投入应大幅前移；实测表明不是，因此可按常规工程标准投入，把资源集中到互补性评估与合规折损上。
