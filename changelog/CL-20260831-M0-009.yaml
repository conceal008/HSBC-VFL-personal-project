what: |
  产出两份文件。

  **pressure_test.md**：23 个监管质询（通用 6 + R-A 6 + R-B 5 + R-C 6），回答率 100%。
  但把「回答率」拆成三档如实统计：✅ 能直接对监管陈述 9 个（39%）、
  ⚠️ 知道怎么答但依赖未完成模块 11 个、❌ 当前答不上来 3 个。
  三个 ❌ 分别是：标准合同如何描述梯度与嵌入（须法务）、
  内地侧签约主体注册地（须需求方）、金融数据是否属重要数据（可查证）。
  11 个 ⚠️ 集中在 M7、M8、M9，说明缺口是「还没做」而非「做错了」。

  **escalation_M0-001.md**：依框架 M0 升级条件正式上报——三条路线的可用样本估计
  均低于业务最小可行规模 30,000。给出四条出路：①扩大人群定义 ②降低 MDE
  ③转合成数据机制验证 + 条件价值曲线 ④承认命题不成立并终止。
  **建议出路 3 为主 + 出路 1 为辅**，并列出四项待裁定事项。

why: |
  框架对 S0.8 的判据是「每路线 ≥5 个监管质询，100% 有回答」。
  但「100% 有回答」是个容易自我欺骗的指标——只问自己答得上的问题就能达标。
  因此本步额外统计了「能直接对监管陈述」的比例（39%），并把三个真正答不上来的问题
  放在汇总表最显眼处。**把 ❌ 藏起来才是真正的风险，监管不会因为你没写就不问。**

  升级上报之所以必须单独成文而不是在 module_status 里留一行红字：
  它需要被需求方和项目负责人**裁定**，而裁定需要看到证据、出路与代价，
  不是一句「样本不够」。上报文件也明确了三件不主张的事——
  不主张 VFL 无效、不主张停止项目、不主张假设一定正确——
  因为这三条最容易被误读成「技术方说做不成」。

