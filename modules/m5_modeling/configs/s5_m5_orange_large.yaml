# S5.M5 · Orange KDD Cup 2009 大版三任务 + M3 两方特征预筛（DR-M5-014 · D-2 / D-3）
# ---------------------------------------------------------------------------
# 数据：大版训练集 5 个分块（50,000 行 × 15,000 个变量）；官方测试集不完整，在训练集内构造测试集（同小版口径）。
# M3 预筛只在 tune 视图的 fit 行上做一次，列清单两视图共用；之后的流程与 S5.M1（单一验证集）、S5.M3（交叉验证选组合）完全相同。
# 私有矩阵在 MS_PRIVATE_ROOT；原始数据在 MS_RAW_ROOT；本步运行输出（只含聚合指标）在 MS_LARGE_DIR。
# ---------------------------------------------------------------------------
step_id: S5.M5
purpose: Orange 大版（15,000 列）三任务上，M3 两方特征预筛之后，S5.M1 的方法与 S5.M3 的组合选择是否仍成立；预筛本身是否损失精度
decision_record: registry/decision_records/DR-M5-014.yaml
base_config: modules/m5_modeling/configs/s5_m1_method_screen.yaml
cv_config: modules/m5_modeling/configs/s5_m3_cv_combo.yaml
seed: 11
seeds: [11, 22, 33, 44, 55, 66]
run_dir_env: MS_LARGE_DIR
raw_subdir: 数据集/Orange_KDDCup2009
labels: [churn, upselling, appetency]   # 运行顺序同 S5.M1 的小版
k_main: 300                     # 每方保留的编码列数（主分析）
k_sens: [100, 300, 1000, all]   # 敏感性：final 视图，配置固定为主分析选定的配置
noninferiority_margin: 0.005    # D-3：k = 300 相对全部列的配对差区间下界 > −0.005 判「预筛不损失精度」
results_dir: modules/m5_modeling/results/method_screen_large_v1
round_auc: 4
repro_task: churn               # notebook 从原始分块重做预筛、重算优化版联邦测试 AUROC 的任务
repro_tol: 1.0e-9
