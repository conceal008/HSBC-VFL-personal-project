context: |
  盘点（2026-11-02）显示：已有的 7 项 SGB 创新只在 1–4 个数据集上做过；候选 M1–M8（docs 联邦训练增益方法候选 v0.3）一个都没执行；
  LR 轨道 14 任务只做了原配置。所有者要求先列缺口、再立即补做，并把「在一个或个别数据集上有明显增益」的方法写进报告。
  时间线（如实记录）：代码 prep.py / screen.py 在 21:05:40 冻结并记录 sha256（prep 221bc073…，screen 56929574…），
  COIL2000 先跑一遍作冒烟检查（21:04–21:05，结果未用于任何选择或改代码），21:05:40 之后整批排队启动；本 DR 在启动后补写，
  只描述已冻结在代码里的口径，不含任何看过结果后的决定。

decisions:

  - key: D-1
    question: 用什么引擎筛
    decision: |
      明文直方图 GBDT（XGBoost 2.1.4 hist）代理。隐语 SGB 只加密梯度，分裂搜索与同分桶、同超参的明文直方图 GBDT 数学等价；
      INNOVATIONS 创新点 4 实测代理与 SGB 差 ≤ 0.003。默认分桶 10（≈ sketch_eps 0.1），细分桶 33（≈ 0.03）。
      「联邦」臂用两方特征拼接训练（代理），「内地单边」只用标签方特征。
    rationale: 一次 SGB 10–75 分钟，14 个任务 × 30 个方法变体在 2 核机器上只能用代理；等价性已有实测支撑。
    falsifier: 组合复核时真实 SGB 与代理在同配置下 AUROC 差的绝对值 > 0.005 → 该数据集的代理结论降级为「待 SGB 确认」。

  - key: D-2
    question: 选择与评估如何隔离
    decision: |
      每个数据集两个视图：tune（训练去掉验证 → 验证）只用于选配置、选融合权重 w、蒸馏系数 α 与组合；
      final（全部训练 → 测试）每个方法评一次。调参网格与原 tune_proxy 相同（48 组，早停 20 轮，上限 300 轮），
      选择规则相同（验证 AUC 距最优 ≤ 0.001 者取 轮数×深度×行采样 最小）。组合候选 {P, P_M4, M1, M1x, 以及各自 + M6} 只按验证 AUC 选。
      Santander G3 的测试集是 S5.G1 起已打开的开发评估集，封存确认集不碰；其余数据集的测试集也在以往步骤中评过，结果一律记为开发证据。
    rationale: AGENTS 规则 8：不在测试集上做分支选择。
    falsifier: 任何选择（配置、w、α、组合）读了测试集标签 → 该数据集结果作废重跑。

  - key: D-3
    question: 方法清单与对照
    decision: |
      I2 分解（只细分桶 / 只调参 / 二者）、I3 先验初始分数、M4 行采样纳入调参、M1 逐样本先验（内地模型 5 折交叉拟合 logit 作 base_margin）
      与 M1x（内地模型额外用非共同客户行）、M6 bagging（6 模型、行采样 0.8）、M2 分数融合（logit 加权，w 可取 0）与蒸馏学生
      （联邦教师 5 折折外概率作软标签，学生只用内地特征）、I6 后验去噪标签 DP（ε = 1 / 2 / 4，硬 RR 对照）、
      M5 匹配置信度加权与剔除（训练集注入 5% / 10% 香港行错位，模拟置信分数区分错配的 AUC = 0.9；测试集不注入）。
      非共同客户行只在 FedAds（官方非对齐训练集 3% 抽样）与 mock 重合档（balanced 中不在本档的客户）存在。
    rationale: 覆盖已发表方法（SecureBoost 系、FedSim、蒸馏 / 非对齐样本利用、标签 DP）与候选文档 M1–M6；I1 / I7 / SS-XGB 为无损的效率或安全替换，不在本批。
    falsifier: 无（清单是范围声明）。

  - key: D-4
    question: 统计口径与结论措辞
    decision: |
      6 个 seed（11–66）；点估计 = 6 seed 均值；配对差 95% 区间来自两层 bootstrap（1,000 次；测试客户簇 × seed，seed 有放回）；
      p 为双侧 bootstrap p，每个数据集全部对比为一族做 Holm。「明显增益」= 区间不含 0；单数据集上区间不含 0 但 Holm p ≥ 0.05 的，
      报告中写「单数据集名义显著」。筛选结论不外推为汇丰效果，不换算成命中率或收益。
    rationale: 所有者要求把在个别数据集上有明显增益的方法写进报告；同时标出多重比较，避免把筛选当确认。
    falsifier: 报告把筛选结果写成「已确认」→ 更正。

  - key: D-5
    question: 阶段预算与后续
    decision: |
      新开「方法筛选」阶段：S5.M1（14 任务代理筛选）与 S5.M2（选定组合在 2–4 个数据集上的真实 SGB 复核）两步；
      第二批（M8 增量学习器、M7 LR 求解器、Orange 大版）另立步骤，先报所有者。逐行数据、分数与模型只在会话临时目录与维护者本机私有目录。
    rationale: 所有者指示即授权；每步可独立回滚。
    falsifier: 所有者撤回指示 → 本阶段结果作废。

falsifier: |
  本记录整体被推翻的条件：①发现代码在 21:05:40 后因看过任何数据集的测试结果而修改却未另立版本；②任何选择读了测试集。

