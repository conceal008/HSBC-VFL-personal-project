context: |
  所有者 2026-11-02 20:38 要求：论文与期刊里的优化方法放到全部数据集上，只要在个别数据集上有明显增益就写进报告；未做的实验先列出再立即开始。
  方法筛选第一、二阶段（DR-M5-012、DR-M5-013）在 14 个任务上完成 M1、M2、M4、M5、M6、I2、I3 与组合选择；报告列为「第二批」的三项未做：
  - Orange 大版（15,000 列）三任务的树轨道，需要先做特征预筛（候选文档 M3）；
  - M8 增量（uplift）学习器（Hillstrom、Criteo）；
  - M7 LR 轨道求解器修复。
  所有者 19:39 回复「继续」。本 DR 按此理解授权第二批中可在会话云端容器内完成的前两项。

decisions:

  - key: D-1
    question: 授权与范围
    decision: |
      新开「方法筛选第三阶段」，2 步：
      - S5.M5：Orange 大版三任务（流失 / 偏好 / 追加销售），M3 两方特征预筛 + S5.M1 全流程 + S5.M3 交叉验证选组合，明文代理；
      - S5.M6：M8 增量学习器（S / T / X / R 四种），Hillstrom 与 Criteo，只用内地特征 vs 联邦特征，明文代理。
      M7 不在本阶段：LR 轨道在本机双虚拟机上跑（会话约定不启动本机虚拟机），候选文档已把「LR 轨道是否保留」列为所有者决定。
      不改 S5.M1–S5.M4 的方法、配置与已提交结果。
    rationale: 报告与 PR 列出的待决清单只剩第二批；两项都只用公开数据，在会话容器内可完成。
    falsifier: 所有者表示「继续」不指第二批 → 本阶段结果作废。

  - key: D-2
    question: S5.M5 数据与 M3 预筛怎么做
    decision: |
      数据：Orange KDD Cup 2009 大版训练集 5 个分块（50,000 行，Var1–Var14740 数值、Var14741–Var15000 类别），sha256 与本机 MANIFEST 一致。
      大版官方测试集不完整（README），与小版一样在训练集内构造测试集：
      - 测试分层 20%、验证 = 训练内分层 20%（同 S5.M1 的 simple_split 与 split_seed）；
      - 两方：原始 15,000 个变量用 random.Random(split_seed) 打乱后对半分（同小版）；
      - 清洗与编码同小版 orange_view：训练行缺失率 > 95% 或只有一个取值的列删除；数值列中位数填补，缺失率 ≥ 5% 加缺失指示；
        内地类别列做折外目标编码 + log 频次，香港类别列做 log 频次 + 频次名次序数；矩阵存 float32。
      - 与小版的一处差别：删列、是否加缺失指示、是否加序数只在 tune 视图的 fit 行上判定一次，列清单两个视图共用
        （小版在各视图 fit 行上分别判定）；填补值、频次与目标编码仍在各视图自己的 fit 行上拟合。
      M3 预筛（只在 tune 视图的 fit 行 = 训练去掉验证上做一次，得到的列清单两个视图共用；测试行与验证行都不参与）：
      - 内地（主动方）：只用内地特征拟合 XGBoost（原版参数，seed 11），按总增益取前 k 列；
      - 香港（被动方）：用「内地已选列 + 香港全部列」拟合同样的 XGBoost，按香港各列被选为分裂的次数取前 k 列。
        SGB 中被动方本来就保存自己特征上的分裂，因而知道自己哪些列被选中；主动方不因此多知道香港列的身份。
      - 主分析 k = 300（每方）；增益为 0 / 次数为 0 的列不入选；并列按列序。
      敏感性（final 视图，配置固定为 k = 300 时选定的配置，6 seed）：k ∈ {100, 300, 1000, 全部清洗后列}，报告优化版联邦与内地单边的测试 AUROC 及相对 k = 300 的配对差。
    rationale: |
      15,000 列下三臂同等调参的网格不可行；预筛是候选文档 M3 的做法，也是 SGB 上降低香港侧密文直方图开销的直接手段。
      预筛只用训练集内的 fit 行，不看验证与测试；列清单固定后两视图共用，避免 final 视图的列随验证行变化。
    falsifier: 预筛或编码读了测试行标签 → 结果作废重跑。

  - key: D-3
    question: S5.M5 评估与判定
    decision: |
      - 主流程与 S5.M1 完全相同（方法筛选组件 method_screen，同一基础配置、候选、6 个 seed、两层 bootstrap、Holm）：
        原版联邦、优化版联邦（I2 + I3）、内地单边、M1、M4、M6 等全部候选；组合选择同时报告 S5.M1 单一验证集与 S5.M3 交叉验证 R1 / R2（分层 5 折）。
      - 与 S5.M1 汇总合并为 17 个任务报告；小版与大版的行与标签不同（标签文件 md5 不同），只并列、不配对。
      - M3 判定「预筛不损失精度」：k = 300 相对全部列，优化版联邦的配对差 95% 区间下界 > −0.005。
    rationale: 沿用既有口径，三个新任务可直接并入方法 × 数据集表。
    falsifier: k = 300 相对全部列的配对差区间下界 ≤ −0.005 → 报告写明「预筛有精度损失」，主分析结论附该限定。

  - key: D-4
    question: S5.M6 增量学习器怎么做
    decision: |
      数据与两方（沿用 M1 已冻结的字段归属）：
      - Hillstrom（64,000 行）：主动方 recency、history、mens、womens；被动方 zip_code、newbie、channel。
        处理 = 收到任一邮件（Mens 或 Womens）vs 未收到；结果 visit（主）与 conversion（次）；spend、history_segment 不进特征。
        切分按冻结配置的口径：按（三个随机组 × conversion）分层 60 / 20 / 20，seed 20260927。
      - Criteo Uplift v2.1：伯努利抽样 1 / 14（约 100 万行，seed 20261103）；主动方 f0、f2、f4、f6、f8、f10，被动方奇数列；
        处理 = treatment；结果 visit（主）与 conversion（次）；exposure 不进特征。切分按（treatment × visit）分层 60 / 20 / 20，seed 20261103。
      学习器（基模型 XGBoost，Künzel 等 2019；Nie & Wager 2021）：
      - S：结果模型以处理为额外特征，两种处理下预测之差；
      - T：处理组、对照组各一个结果模型；
      - X：T 的两个模型 + 插补效应回归，按训练集处理占比（随机化倾向）加权；
      - R：交叉拟合的结果均值 m(x)（5 折）+ 已知处理占比，伪结果加权回归。
      - 对照：响应模型（只用处理组拟合 P(结果 | x)，按「谁会买」排序）。
      基模型配置：每个（数据集，结果，特征集）在验证集上按结果模型的对数损失从 {深 3, 5} × {100, 300 棵}（学习率 0.05）中选一个，四种学习器共用。
      特征集：只用内地特征 vs 联邦（两方全部特征）。
      指标：Qini 系数（Qini 曲线与随机线之间的面积，按测试行数归一化）为主，前 30% 人群的增量为辅。
      选择：每个（数据集，结果，特征集）按验证集 Qini 选学习器；测试集只评一次。
      seed：基模型不做行 / 列采样，R 学习器的交叉拟合折固定（seed 11），拟合是确定的；测试只拟合一次（同 S5.M1 对确定性方法的处理），
      bootstrap 只有测试行一层。tune 视图 = 训练拟合、验证评估；final 视图 = 训练 + 验证拟合、测试评估（同 S5.M1）。
      对比（测试行 bootstrap 1,000 次，seed 20261102；每个（数据集，结果）内 Holm）：
      ① 联邦选定学习器 − 内地选定学习器；② 联邦选定学习器 − 联邦响应模型；③ 内地选定学习器 − 内地响应模型。
      四种学习器的测试 Qini 全部列出，作描述。
    rationale: |
      M8 回答「营销带来多少增量」，不是提升 AUROC 的手段；对比 ② ③ 检验按增量排序是否优于按响应排序，对比 ① 检验联邦特征对增量排序有无帮助。
      visit 的事件数足够检出差异；conversion 事件少（Hillstrom 约 580 个），预计区间宽，如实报告。
    falsifier: 选择或配置读了测试集 → 结果作废重跑。

  - key: D-5
    question: 边界
    decision: |
      - 全部为明文代理，不做真实 SGB 复核（Orange 大版预筛后每方 300 列，单次 SGB 远超会话时限；增量学习器的联邦实现在 T / X 学习器上只需每组一个 SGB，协议不变，留作后续）。
      - 公开零售邮件与广告随机试验，不能外推银行理财产品的实际增量；不换算成汇丰效果。
      - 只提交汇总；行数据、列清单以外的编码状态、逐行打分只在会话临时目录与本机私有目录。
    rationale: 与 S5.M1 / S5.M3 的边界一致。
    falsifier: 无（范围声明）。

falsifier: |
  本记录整体被推翻的条件：①运行代码在启动指纹之后因看过测试结果而修改却未另立版本；②任何选择读了测试集；③所有者表示「继续」不授权第二批。

review_trigger: |
  S5.M5 三个任务完成时；S5.M6 完成时。

review_20261104_s5m5: |
  S5.M5 完成时复核（三个任务 2026-11-04 02:06 全部完成）：
  - D-2 推翻条件未触发：预筛、删列与编码只读 tune 视图 fit 行；notebook 从原始分块重做流失任务的预筛，两方列清单与批量运行相同。
  - D-3：三个任务都按 S5.M1 全流程与 S5.M3 交叉验证完成。I2 + I3 在流失 +0.036、追加销售 +0.011 显著，偏好 +0.025（区间下界 +0.0003，Holm 0.86）；
    原版联邦相对内地单边三个任务都不显著，优化版三个任务都优于内地单边。M6 只在偏好上刚好成立；M1 在流失上变差（−0.007）。
    单一验证集三个任务都选 M1；交叉验证 R1 1 优于（偏好 P+M6 +0.005）、0 劣于。
  - D-3 预筛判定：流失、追加销售「不损失精度」成立；偏好不成立（全部列 − 300 列 = +0.0050 [−0.0007, +0.0110]），按推翻条件在报告中写明，
    同时如实写明 100 列比 300 列高 +0.0084、测试正例只有 178 个。每个 k 下联邦都显著优于内地单边。
  - 运行中的修改（如实记录，均在写出任何结果之前）：第 1、3 次启动被会话容器内存上限终止，第 2 次预判内存不足手动停止，
    改为两遍读取（先去掉全部行上全缺失或常数的 1,479 个数值变量；这些列在任何行子集上也会被 D-2 的删列规则删掉，结果不变）、
    类别列 category 类型、编码矩阵预先分配、原始数值矩阵与敏感性矩阵改为磁盘映射；第 4 次启动到 2 小时后台上限，流失任务的方法筛选未写出结果，
    之后按任务分段续跑。每次改动前后的 sha256 记在启动指纹里；数学与本记录写定的口径未改。
