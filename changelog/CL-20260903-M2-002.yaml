title: 第二种 SCM 结构：模型排序被推翻，C1 被加固
what: '给生成器加两种非线性信号形式并重跑调参后的阶梯：

  interaction（被动方只经与主动方的交互起作用）与 threshold（阶跃贡献），linear 保持为默认以确保既有全部结论一字不变。

  新建 scenarios_nonlinear.yaml（6 场景，含 λ=0 零互补与线性对照两项验收），在其上重跑 S5.4 的全套超参搜索（6 场景 × 5 种子 × 237 组 = 7110 次拟合）。'
key_finding: '🔴 **分支卡 BC-M5-001 的 falsifier 触发。**

  强交互场景 N2（λ=2.0）下排序反转：L3b 纵向 GBDT(0.8193) > L3c SplitNN(0.7966) > L3a 联邦 LR(0.7903)；阶跃场景 N4 下 L3b 也升到第二。而
  λ=0.8 的弱非线性与线性对照下 L3a 仍居首。

  **按分支卡写下的条件，tuned_test_auc 不得再作为路线取舍依据。**它度量的是「在本 SCM 的生成假设下谁更契合」，不是「哪条路线更好」。

  这不是某条路线更差，而是**模型族与数据生成机制的匹配问题**——信号可加时线性路线占优，含强交互时树模型占优。真实数据的机制未知，故**任何单一合成数据上的效果排序都不可外推**。

  L3b 的 verdict 由 keep_with_caveat 改回 keep：它此前的「落后」已被证明是生成假设造成的。


  **C8 · C1 不依赖生成机制，反而更强。**L1 − L0 在 6 个场景中有 5 个为负，捕获比例均 ≤1%。交互信号下 L1 尤其差——分段统计量是主动方特征的函数，捕获不了逐人的交互效应。


  **C9 · 理论上限高 ≠ 可实现比例高。**同样 λ=0.8，交互形式的理论增益（0.0378）高于线性（0.0360），但实测最优 L3 增益只有 0.0209，远低于线性的 0.0755——可实现比例相差近四倍。→
  用一个数字概括「对方数据值多少」不可靠；尽调阶段若只用线性模型估增益，可能严重偏离真实可实现值。'
why: S5.4 的次级发现已经提示：本 SCM 的信号是潜变量的线性组合，天然对线性模型有利。当时把它写进分支卡的 falsifier 而不是当作定论——本步就是去执行那条 falsifier。一条写下来却从不检验的
  falsifier 等于没写。
