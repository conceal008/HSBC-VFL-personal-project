  - 运行配置 configs/s5_m9_sgb_i2i3.yaml；
  - 带汇总输出的运行入口 notebook S5.M9_1（在 COIL2000 上重算对比与跨任务汇总并核对，合并已提交的 3 个任务）；
  - 公开汇总 results/sgb_i2i3_v1/；
