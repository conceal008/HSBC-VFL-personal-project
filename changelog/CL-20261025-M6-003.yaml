title: S6.P3 G3 五臂对比预注册声明（proposed，执行前声明）
what: |
  新增 modules/m6_evaluation/S6.P3_G3五臂对比_预注册声明.md 与机器可读配置 configs/s6_p3_g3_preregistration.yaml（status proposed）：
  唯一主对比为 Santander 上双向联邦 A 相对 L1（k=10）的配对 AUROC 差，关心尺度 0.02；九个臂（L0、L1 k=5/10/20、B_T1、B_T2、
  A、A_secure、阴性对照 NC；B_T3 即 L1_k10）各有数据流与调参预算；三类数据（Santander 主、FedAds 次、HSBC mock 三档机制）
  的抽样单位、开发评估集正例目标（≥700，依 S6.P1）与封存确认集；6 个训练 seed；统计全部引用 evaluation_protocol v1；
  六条停止规则与「结果到决策」映射写在看结果之前；第九节列出执行前的冻结步骤。
  状态类字段同步：M6 README（状态、下一步、S6.P3 一节）、step_ledger（追加 S6.P3）、registry/module_status.yaml 的 M6 条目、
  governance 与下一阶段计划条目、任务清单 T3/T4 状态（T3 在仓库外完成：claude.ai《1030面聊一页》v1.1）。
why: |
  任务清单 T4。DR-MX-002 · D-5 把 L1 同等比较、单向形态候选与阴性对照排为恢复后第一批，但三者此前只有名字，
  没有数据、seed、预算与停止规则；不先写定，恢复后的比较仍会落入「多次尝试后留下的赢家」。
  放在 M6 而不是 M5：这是评估设计，M5 处于暂停且阶段步数已用完（DR-M5-008），执行时再由 M5 另立步骤与分支卡。
  验证的假设：九个臂能在不违反 7/29 约束（不引入神经网络）与口径 v1 的前提下写成一个可执行的预注册——成立；
  B_T2 在公开代理数据上的适用性无法事先保证，已写成冻结前逐数据集登记、不适用即如实报告。
