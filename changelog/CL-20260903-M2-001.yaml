title: 实现结构因果模型合成数据生成器，并通过零互补场景的硬验收
what: 实现 13 个可控结构参数的 SCM 生成器（互补性、冗余度、重叠率、同意率与选择性、匹配错误率、时间漂移、标签噪声、异质处理效应等），配置 8 个场景 × 5 个种子，并提供 theoretical_gain_signal
  用于计算该场景下被动方数据的理论价值上界。
key_finding: '**S2_零互补（λ=0）的理论增益 = 0.0000**，这是生成器实现正确的硬验收判据，通过。


  同时发现实测增益系统性高于理论增益（如 S2 实测 +0.0254）。控制实验证明这不是缺陷：

  λ=0 且冗余=0 时增益为 −0.0057（多余特征的纯过拟合代价），冗余=0.3 时为 +0.0254。

  **机制是冗余特征通过降低测量误差产生价值**——与互补性是两条不同的价值来源。

  这一区分对真实项目的数据价值评估直接有用：不能只问「对方有没有我没有的信息」，还要问「能不能帮我把已有的信息测得更准」。'
why: 本项目无法取得真实数据（M0 三条合规路径的 N_eff 均远低于所需规模），合成数据是唯一能做机制验证的路径。而合成数据的价值完全取决于地面真值是否可控且可验证——因此生成器必须自带正确性验收，否则下游全部结论都建立在无法检验的基础上。
