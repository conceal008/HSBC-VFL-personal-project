dr_id: DR-M5-016
title: 方法筛选第五阶段：I2 + I3 在其余 14 个任务上的真实 SGB 复核（S5.M9）；主动方明文直方图在两进程生产模式下的墙钟（S5.M10，有条件）
date: '2026-11-05T08:55:00+08:00'
agent: Claude (claude-opus-5-5, Claude Code)
module: M5
status: active
supersedes: null
requested_by: conceal008（所有者 2026-11-05 08:45 回复「继续」；报告 v1.5 §5.2 与 S5.M7 / S5.M8 交接列出的未做项中，可在会话云端容器内完成的是其余任务的 SGB 复核与明文直方图的墙钟实测）
related_step: S5.M9
related_change_id: null
preregistration: 本记录在 S5.M9 / S5.M10 做任何拟合之前写定；运行代码与配置的 sha256 在每段启动时另记于私有运行目录
amends: 无；DR-M5-012 ~ DR-M5-015 的结果不受影响

context: |
  所有者 2026-11-02 20:38 要求：论文与期刊里的优化方法放到全部数据集上，有未做的实验就立即开始；之后多次回复「继续」，并授权自主判断。
  方法筛选第一 ~ 四阶段（DR-M5-012 ~ DR-M5-015）已完成。报告 v1.5 的结论「I2 + I3 普遍有效（14 / 17）」主要来自明文代理；
  真实 SGB 上做过「原版联邦 − 优化版联邦」对比的只有 3 个任务（UCI、Orange 偏好、Orange 大版流失）。
  其余 14 个任务里：
  - 已有优化版联邦 SGB 打分（S5.M2 存档）、只缺原版联邦的 4 个：Santander G3、FedAds、mock 重合 80、COIL2000；
  - 两个方法都缺的 10 个：mock 平衡 / 重合 50 / 重合 20、Orange 流失 / 升级（小版）、HomeCredit、Santander 交易、IEEE 第 1 块、Orange 大版追加销售 / 偏好。
  S5.M7 已证主动方明文直方图在 6 个任务上与原版逐位一致、两方合计计算省三到四成，S5.M8 用它在约 2 小时内完成每方 300 列的拟合；
  因此其余任务的 SGB 复核首次可以在会话容器内分段完成。
  不在本阶段：M7（需本机双虚拟机，待所有者定）；M6 的更多 SGB 复核（每次约 6 倍成本，已有 3 个任务）；M3 预筛扩到其他数据集（其余数据集最多 403 列）；
  M8 扩数据集（其余数据集没有处理变量）；SS-XGB / G3 五臂扩数据集（已证无精度代价，主要是成本）。

decisions:

  - key: D-1
    question: 授权与范围
    decision: |
      新开「方法筛选第五阶段」，预算 2 步：
      - S5.M9：上述 14 个任务上原版联邦（F_def）与优化版联邦（F_opt_p）的真实 SGB，与同配置代理比较、SGB 上的 I2 + I3（F_opt_p − F_def）；
      - S5.M10：主动方明文直方图在两进程生产模式（两个本地进程，各自一方）下的墙钟（D-7），S5.M9 完成后做，可行性不成立则不做并如实记录。
      不改 S5.M1 ~ S5.M8 的方法、配置与已提交结果。
    rationale: I2 + I3 是报告的头号结论，其余 14 个任务的真实 SGB 证据能直接检验「代理结论可信」与「I2 + I3 普遍有效」；墙钟是 S5.M7 留下的开放问题。
    falsifier: 所有者表示「继续」不指这些 → 本阶段结果作废。

  - key: D-2
    question: S5.M9 的任务、方法与配置
    decision: |
      - 配置、分桶与初始分数全部取自 S5.M1（14 个任务）/ S5.M5（Orange 大版）的结果 JSON，与 S5.M2 / S5.M8 相同（method_screen_sgb.method_spec），seed 11，不再调参；
      - 原版联邦：隐语经典默认（深度 5、100 棵、学习率 0.3、λ 0.1、10 桶、初始分数 0.5）；优化版联邦：选定配置、33 桶、先验初始分数；
      - 新拟合一律用主动方明文直方图版本（S5.M7 的 `plaintext_label_holder`，D-3 抽查逐位一致后）；
      - 已有 S5.M2 存档的 4 个任务（Santander G3、FedAds、mock 重合 80、COIL2000）直接复用其优化版联邦打分（S5.M7 已证这 4 个任务上明文版本与之逐位一致），只新拟合原版联邦；
      - 运行顺序按预计开销从小到大：COIL2000、mock 重合 20、Orange 流失、Orange 升级、mock 重合 50、Santander 交易、IEEE 第 1 块、mock 平衡、mock 重合 80、FedAds、Santander G3、HomeCredit、Orange 大版追加销售、Orange 大版偏好。
    rationale: 与 S5.M2 / S5.M8 同一实现、同一口径，结果可直接并列。
    falsifier: 选择或配置读了测试集 → 该任务结果作废。

  - key: D-3
    question: 明文直方图在新任务上的逐位抽查
    decision: |
      每个新拟合（任务 × 方法）正式拟合前，用同一配置只训前 2 棵树，原版与明文各一次，测试打分必须逐位相同；
      不相同 → 该任务不再用明文版本，S5.M9 对该任务记为「未做（明文不一致）」并如实记录，不改用其他做法。
    rationale: S5.M7 只在 6 个任务上完整核对；2 棵树的抽查成本低。替换对每棵树的作用方式相同，实现差异（如编码、分桶求和路径不同）在前两棵就会显出；完整拟合的逐位一致仍只在 S5.M7 的 6 个任务上证实，如实写明。
    falsifier: 无（判定规则本身）。

  - key: D-4
    question: 时长与分段
    decision: |
      - 抽查同时用明文版本训前 2 棵与前 4 棵，按边际每棵树秒数外推全部棵数（同 S5.M8 原版联邦的启动前试训）；
      - 外推超过 7,000 秒（会话后台单段上限约 7,150 秒）的拟合不做，如实记录，不为此改配置或减棵数；
      - 分段运行：每段从上次停下处继续（抽查、拟合、对比各自存档）；一段内只在「已用时间 + 外推 × 1.1 ≤ 6,800 秒」时开始下一个拟合，否则结束本段；
      - 运行期间会话内不跑门禁或其他重计算；门禁只在全部拟合完成后、提交前运行。
    rationale: S5.M8 优化版联邦与门禁争用 CPU 时实际耗时比估算多约 6 成；分段与留余量避免超时白跑。
    falsifier: 无（运行规则）。

  - key: D-5
    question: S5.M9 的对比与判定
    decision: |
      口径同 S5.M2 / S5.M8（method_screen_sgb.evaluate）：测试客户簇 bootstrap 1,000 次（seed 20261102），单次拟合，区间不含训练随机性。
      - SGB 与同配置代理：差的绝对值 ≤ 0.005 为一致；超出的按 DR-M5-012 · D-1 把该任务该方法的代理结论降级为「待 SGB 确认」；
      - SGB 上 I2 + I3（F_opt_p − F_def）：配对差、95% 区间与 p；另在 14 个任务之间做 Holm（预先写定的补充口径）；
      - 判定：SGB 上区间不含 0 且为正 → 「I2 + I3 在 SGB 上成立」；与 S5.M1 代理（6 seed）的结论逐任务对照，报告一致 / 不一致的任务数；
      - 只作描述：优化版联邦 SGB − 内地单边代理（6 seed）。
    rationale: 与已有 3 个任务的 SGB 证据同口径，合并后得到 17 个任务上 I2 + I3 的完整真实 SGB 证据。
    falsifier: 无（判定规则本身）。

  - key: D-6
    question: S5.M9 的结论如何进报告
    decision: |
      报告升版，按 D-5 的判定改写「I2 + I3 普遍有效」一句的 SGB 部分：写真实 SGB 上成立的任务数 / 已做的任务数，代理与 SGB 不一致的任务逐个列出。
      代理结论降级的任务在报告相应位置标「待 SGB 确认」或以 SGB 为准。不因 SGB 结果回头修改 S5.M1 的选择或配置。
    rationale: 结论只增加证据层级，不事后改选择。
    falsifier: 无。

  - key: D-7
    question: S5.M10 两进程生产模式下的墙钟（有条件）
    decision: |
      - 可行性：先用合成数据（不涉及项目数据）在会话容器内起两个本地进程（各自一方，生产模式，本机回环通信），确认 sgb_v 能拟合、明文替换在主动方进程内生效、两种版本打分逐位相同；不可行则不做并记录原因；
      - 任务：S5.M7 计时过的 UCI Bank、Santander G3、mock 重合 80，以及 Orange 大版流失每方 300 列；配置同 S5.M7（优化版联邦），只训前 10 棵（大版 5 棵），按 ABBA 顺序；
      - 记录墙钟秒数（从训练开始到结束，两方并行），以及两方各自的分桶求和与解密秒数；报告节省比例与 S5.M7 单进程合计计算节省比例的对照；
      - 口径：容器 2 核、本机回环通信，不代表跨境网络或汇丰环境；只作开销的相对比较。
    rationale: S5.M7 的节省是两方计算串行相加；两方并行时被动方可能是关键路径，墙钟节省可能更小，需要实测才能写进报告。
    falsifier: 两种版本打分不逐位相同 → 该任务计时作废并记录。

  - key: D-8
    question: 边界
    decision: |
      - 明文直方图只在实验代码里替换一个方法，不改隐语源码；用于正式联调需在隐语上游或项目封装层实现并经安全评审（技术侧自评，未经法务复核，W-001）。
      - 耗时是会话容器上的测量，不代表本机双虚拟机或汇丰环境的时长；公开数据上的开发证据，不代表汇丰效果，不换算成命中率或收益。
      - 只提交汇总；逐行打分只在会话临时目录与本机私有目录。
    rationale: 与 DR-M5-015 · D-7 一致。
    falsifier: 无（范围声明）。

falsifier: |
  本记录整体被推翻的条件：①运行代码在启动指纹之后因看过结果而修改却未另立版本；②任何选择读了测试集；③所有者表示「继续」不授权本阶段。

review_trigger: |
  S5.M9 完成时；S5.M10 完成或判定不做时。

review_20261105_s5m9: |
  S5.M9 完成时复核（8 段，08:52 – 20:08）：
  - D-2 推翻条件未触发：配置、分桶与初始分数全部取自 S5.M1 / S5.M5 结果 JSON，测试集只用于最后评估一次；8 段启动指纹中组件、依赖组件与配置的 sha256 相同，运行中未改代码。
  - D-3：24 次新拟合的前 2 棵，原版与明文打分全部逐位相同，没有任务改为「未做」。
  - D-4：外推与实际拟合秒数之比 0.86 ~ 1.09，没有拟合超出上限或被后台上限终止；合计拟合约 10.3 小时。运行期间未跑门禁或其他重计算。
  - D-5 结果：
    - SGB 上 I2 + I3 在 14 个任务中 12 个成立（区间不含 0），9 个经 14 个任务内 Holm 后仍成立；不成立：mock 重合 50 +0.0042 [−0.0034, +0.0114]、IEEE 第 1 块 +0.0096 [−0.0025, +0.0229]。
    - 与代理（6 seed）结论一致 11 / 14；不一致：mock 重合 20、mock 重合 80（SGB 成立、代理不成立），IEEE 第 1 块（代理成立、SGB 区间含 0）。
    - 28 个配置中 7 个与代理之差超出 0.005：原版联邦 5 个（COIL2000 −0.014、Orange 流失 −0.010、Orange 大版追加销售 −0.006、HomeCredit −0.005、IEEE 第 1 块 +0.009），
      优化版联邦 2 个（COIL2000 +0.006、mock 重合 80 +0.006，S5.M2 已知）；按 DR-M5-012 · D-1 降级为「待 SGB 确认」。原版参数下超差方向不一致（本步多为 SGB 低于代理，S5.M2 为高于）。
    - 合并 S5.M2（UCI、Orange 偏好）与 S5.M8（Orange 大版流失）：17 个任务中 15 个在 SGB 上成立。
  - D-6：报告升版时按上面的计数改写 I2 + I3 的 SGB 部分，逐个列出不一致的任务；不回头修改 S5.M1 的选择或配置。
  - 第五阶段 1 / 2 完成；S5.M10（两进程生产模式下的墙钟）随后按 D-7 先做可行性检查。
