what: |
  实测 GitHub 仓库安全设置：secret scanning 与 secret scanning push protection 均为 enabled
  （GitHub 对公开仓库默认开启），而 main 分支保护未配置、rulesets 为空。
  仓库内三处记录仍写着「Secret 扫描 push protection 尚未开启，需所有者配置」，与事实不符，予以更正。
  同时在 ci/README.md 写明 GitHub 自带 push protection 与门禁 1 的分工：前者在服务端 push 时拦截
  已知格式的凭证，后者在 CI 中另查数据类文件扩展名、文件体积与个人标识形态——后者 GitHub 不查。

why: |
  失真的状态记录比没有记录更糟：后续执行体会去重复开启一个已开启的功能，
  或据此误判仓库当前的防护水位。第 0 部分原则三要求说的和做的可核验，状态记录同样适用。

