what: |
  产出 M0 的预测命题：给定观察截止日 T，对在 T 日同时为汇丰内地行与汇丰香港行零售客户、
  年满 18 周岁、两侧均已取得营销用途所需同意（内地 PIPL 第 39 条单独同意；
  香港 PDPO 第 VIA 部直接促销同意）、并符合跨境理财通南向通投资者资格的自然人，
  预测其在 [T, T+90 日] 内首次成功申购南向通合资格投资产品的概率。
  主动方（有标签方）= 内地行，被动方 = 香港行。
  同时由双臂随机对照的两比例检验反推业务最小可行规模 N_eff ≥ 30,000 人。

why: |
  产品选型基于汇丰实际业务：南向通在业务机制上要求投资者在内地行开立汇款专户、
  在香港行开立投资专户——「共同客户 = 交集」因此是业务前提而非建模假设，
  与框架判断一完全吻合；两个独立法人主体天然构成纵向联邦学习的两方；
  营销由内地行对内地客户实施，香港行不在境内推介，使营销行为本身处于合规结构内。
  转化取「首次成功申购」而非「开户」，因为开户后无申购的客户不产生业务价值，
  用开户当转化会系统性高估方案效果——代价是正样本更稀疏、N_eff 更高，如实计入。
  最小可行规模改由统计可检验性推导而非拍业务数字：前者可被重算与证伪，后者不能。

