# S0.1 · 业务最小可行规模的推导参数
# 全部为显式假设，需求方确认前不得作为结论使用。
step_id: S0.1
purpose: 由「能否检出目标增益」反推可用人群 N_eff 的下界

# 检验参数
alpha: 0.05            # 双侧显著性水平
power: 0.80            # 检验功效
holdout_share: 0.50    # 随机对照臂占比（等分双臂）

# 基线转化率假设：观察窗内共同客户的首次申购率
# 来源：无。需求方未提供，此处为显式假设，M1 选定代理数据集后须校准。
base_rates: [0.01, 0.02, 0.03, 0.05]

# 待检出的相对增益（uplift 相对提升）
# 0.05 为《Loop 执行规范 v2》0.4 给出的 MDE 建议初值；其余为放宽档位
relative_lifts: [0.05, 0.10, 0.20, 0.30]

# 主口径：用于给出「业务最小可行规模」这一个数字
primary_base_rate: 0.03
primary_relative_lift: 0.20

seed: 42               # 本步无随机过程；声明以备后续复用（第 9 部分第 2 条）
