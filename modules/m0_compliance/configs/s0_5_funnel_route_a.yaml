# S0.5 · R-A（数据出境安全评估路径）下的合规折损漏斗参数
# ---------------------------------------------------------------------------
# ⚠️ 全部为显式假设，无任何真实业务来源。需求方确认或 M1 校准前不得作为结论引用。
# 三档取值的含义：low = 保守（折损最重），mid = 中性，high = 乐观（折损最轻）。
# ---------------------------------------------------------------------------
step_id: S0.5
route: R-A
route_name: 数据出境安全评估路径（PIPL 第 38 条第（一）项）
seed: 42                      # 本步无随机过程；声明以备后续复用

# 客户基数：汇丰内地行在粤港澳大湾区内地 9 市的零售客户数量级
# 来源：无。取一个跨度较大的区间以体现「我们并不知道这个数」。
base_population:
  low: 200000
  mid: 500000
  high: 1000000

stages:
  - name: 南向通投资者资格
    rates: {low: 0.03, mid: 0.06, high: 0.12}
    basis: |
      须同时满足：大湾区内地 9 市户籍或连续缴社保/个税满 2 年 + 财务三选一
      （近 3 个月家庭净资产 ≥100 万 / 家庭金融资产 ≥200 万 / 近 3 年年均收入 ≥40 万）
      + 2 年以上投资经历。财务门槛是主要约束。

  - name: 同时为香港行客户
    rates: {low: 0.05, mid: 0.10, high: 0.20}
    basis: 跨境双持客户占比。高净值人群在港开户比例高于总体，但仍是少数。

  - name: 标识可匹配
    rates: {low: 0.50, mid: 0.70, high: 0.85}
    basis: |
      两地标识体系不同（内地手机号/身份证 vs 香港身份证号/护照/境外号码），
      精确匹配覆盖率有限。此层是 M3 的一等实验变量。

  - name: 内地侧单独同意（PIPL 第 39 条）
    rates: {low: 0.15, mid: 0.30, high: 0.50}
    basis: |
      R-A 路径下告知内容最完整（境外接收方名称、联系方式、处理目的与方式、
      信息种类、行使权利的方式与程序），告知越充分同意率通常越低。

  - name: 香港侧直接促销同意（PDPO 第 35C/35E 条）
    rates: {low: 0.20, mid: 0.40, high: 0.60}
    basis: 香港侧须就直接促销单独取得同意；若涉及提供予他人还需第 35K 条的书面同意。

  - name: 数据质量达标
    rates: {low: 0.80, mid: 0.90, high: 0.95}
    basis: 特征完整度、时间口径可对齐、无穿越等基本可用性要求。

# 与 S0.1 的判负线比较
minimum_viable_n_eff: 30000
