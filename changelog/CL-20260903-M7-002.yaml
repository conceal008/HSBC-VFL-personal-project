title: 补齐特征推断与成员推断攻击：发现无防护协议是双向完全泄露的
what: '实现两类此前列为「最可能改变结论的缺口」的攻击：

  A4 特征推断——主动方从每轮上传的部分 logit 反解被动方原始特征（两步最小二乘，需少量辅助样本）；

  A5 成员推断——朴素损失阈值版与 LiRA 式影子模型校准版。

  配套在 fit_federated_logistic 中记录**实际上传**的部分 logit，并新增被动方自我保护噪声 uplink_sigma（与既有的下行 dp_sigma 是不同参与方、不同攻击面）。'
key_finding: '**C4 · 无防护的纵向联邦逻辑回归是双向完全泄露的。**

  只要辅助样本数达到特征维数（本例 6 个），主动方即可**精确**恢复被动方全部原始特征（R² = 1.000000，误差约 1e-15）。加上 S7.1 已证的标签完全泄露，**「原始数据不出本地」在这个协议下不构成任何实质保护**。


  **C5 · 防护必须逐攻击面设计：同一种加噪手段对两类攻击效果完全相反。**

  上行加噪 σ=0.1 使特征 R² 从 1.0000 降到 0.196，可用性仅损失 0.0014；而 S7.2 已证下行加噪防不住标签推断（需 σ=30 才有效，届时可用性低于 L0 基线）。

  机制：A1 的信号（标签）**轮间恒定**，跨轮平均即可消噪；A4 需要解**病态线性系统**（w_b 轨迹条件数约 4.8×10⁴），噪声被放大五个数量级。

  证伪检验：岭正则化 + 2000 个辅助样本的加强版攻击确实优于朴素最小二乘，但 σ=1.0 时 R² 也只到 0.129，**未推翻结论**。


  **C6 · 成员泄露由模型容量驱动，与是否联邦无关。**

  L0（0.5105）≈ L1（0.5105）≈ L4/L3 信息集（0.5103）——引入对方数据不增加成员泄露；而纵向 GBDT 深 3→6 使泄露从 0.5277 升到 0.5453。工程含义：控制树深，而非纠结是否联邦。


  **方法论要点：朴素的损失阈值成员推断攻击没有通过有效性验证。**在刻意制造记忆的模型上（训练 AUC = 1.0000、过拟合间隙 0.32）它也只到 0.52。据此宣称「成员推断无威胁」会重蹈 S7.1
  的覆辙（只是方向相反），故改用 LiRA 式影子模型校准，确认其随模型容量单调增强后才采信。'
why: 《实验结果与结论.md》§9 把「未覆盖特征推断与成员推断」列为**最可能改变结论**的缺口第 4 项。本步补齐后结论确实发生实质变化——新增 C4/C5/C6，其中 C4 与 C5 改变了对协议安全性的整体判断。这说明「已知缺口」不是免责声明，是待办清单。
