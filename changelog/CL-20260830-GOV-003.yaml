what: |
  实现《项目维护约束 v2》7.2 的六项合规一致性核验并接入 GitHub Actions：
  ①引用完整性（m0_registry_ref 必须存在且未作废）②定性一致性（category / is_personal_information
  与 M0 清单一致）③路径合法性（legal_basis_ref 必须是主线或回退线，且在该资产的 applicable_routes 内）
  ④无未声明流动（代码有跨方通信特征但组件无 declaration.yaml 即阻断）⑤审计钩子存在
  ⑥同意依赖闭环（requires_batch 必须在同意管理配置中登记）。
  同时把核验 3 / 6 依赖的两份文件路径与最小结构固定为契约，写进 ci/README.md。

why: |
  附录 B 指定它为优先实现项：它是原则三「说的和做的必须可机器核验」的载体，
  越早上线，M9 的一致性核验（通过率必须 100%）越不会有惊喜。
  现在实现的时机最好——仓库里还没有任何组件声明，门禁先立起来，
  等 M0 填清单、M4 之后落组件时它自动开始起作用，不用回头返工已提交的内容。
  契约文件缺失时选择阻断而非跳过，是因为"跳过"会让门禁在 M0–M7 期间形同虚设。

