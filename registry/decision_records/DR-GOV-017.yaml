dr_id: DR-GOV-017
title: DR-GOV-016 复核（触发条件①：G3 Santander 主对比完成）——D-2 推翻条件已触发；HSBC mock 按规格不可执行，第二组证据改由 FedAds；主对比按口径 v1 加规模标注
date: '2026-10-26T14:05:00+08:00'
agent: Claude (claude-opus-5-5, Claude Code)
module: GOV
status: active
related_step: S-GOV.17
reviews: DR-GOV-016
user_instruction: 继续恢复实验，你根据最终目的自主判断上述决策（所有者 conceal008，2026-10-26；DR-GOV-016 原文登记）
supersedes: null

context: |
  DR-GOV-016 的 review_trigger ① 为「G3 Santander 主对比完成时」，S5.G1 已完成（CL-20261026-M5-002）。
  其 D-2 推翻条件为：主对比的开发评估集按客户去重达不到 S6.P3 第三节的正例目标、且无法按规则扩充样本 →
  ⓐ第一批改以 HSBC mock 三档为主；ⓑ主对比结论按「未达可检出规模」报告。
  S5.G1 的结果：正例 586 < 700；评估集桶数按训练月正例率在看标签前一次定出，停止规则 5 禁止看结果后追加样本——条件按字面成立。
  S5.G1 提交只执行了ⓐ的顺序部分，没有处理ⓑ。本记录补上这一处，并逐项复核 DR-GOV-016 其余取舍。

decisions:

  - key: D-1
    question: ⓐ「第一批改以 HSBC mock 三档为主」怎么执行
    decision: |
      HSBC mock 三档不在 G3 中运行，记为「按预注册规格不可执行」；S5.G3 只做 FedAds，整体先于 S5.G2（A_secure，SS-XGB）。
      本决定只依据数据结构的核对，在任何 G3 臂接触 HSBC mock 之前作出（2026-10-26，本机只读汇总计数；绝对客户数属交集规模，不入库）：
      ① 每一档的内地侧客户、香港侧客户与共同客户名单三者完全相同，档内重合率均为 100%——
         三档改变的是样本量，不是重合率，回答不了 S6.P3 给它的问题「重合率的影响」（M1 冻结清单 scope 也写明不得把档位解释为两方重叠率）；
      ② 三档客户是 10/21 汇报样本（7,434 位客户）的 20/50/80% 子集——该样本已用于 SGB 优化的逐项迭代，不是首次查看的数据；
         〔勘误 2026-10-26（S-GOV.19）：原文称该样本「被 S6.P3 的 Santander 抽样排除」，有误。S5.G0 冻结时 A-2 已取消这项排除，理由是排除名单无法重建；
         而本机 HSBC_mock数据/balanced_guest.csv 即含这批客户号，名单本可重建。按客户号核对，S5.G1 的训练、内层验证与评估候选客户中
         分别约 0.7%、0.9%、0.8% 属于这批样本，与 A-2 预期的约 0.8% 一致。G3 的超参由内层验证集上的随机搜索重新选定，不沿用此前 SGB 迭代的结果；这批客户在 G3 中与其他客户同等对待。〕
      ③ 即使一个评估月取全部客户，按 S5.G1 评估月正例率 2.9% 估算，正例也只有预注册目标 700 的约 6% / 15% / 25%；
      ④ S6.P3 写的封存确认集「同生成器另一随机种子生成」无从执行：三档是对既有样本的确定性删减，没有生成器。
      FedAds（官方自然切分）承担推翻条件要的「第二组证据」。其预注册缺口——没有时间列可按时间划封存段、没有用户号可做客户簇重抽样——
      须由 M6 另立补充冻结步骤，在 S5.G3 接触评估标签之前提交。冻结的 S6.P3 文件不改，本记录即冻结后改动的 DR（DR-M5-009 falsifier）。
      若之后仍要回答重合率的影响，须另行预注册一种香港特征只覆盖 p% 内地客户的构造，本阶段不做。
    rationale: |
      这条推翻条件写于结果之前，用意是：Santander 主对比若检出力不足，第一批不能只靠它下结论，须尽快拿到第二组证据。
      它默认 HSBC mock 能提供这组证据；核对后，HSBC mock 的正例比 Santander 第一批更少、档位不对应重合率，照做会多花一步得到一个更弱、且问错了问题的结果。
      HSBC mock 在 S6.P3 中的角色本来就是 secondary_mechanism（不作业务证据），把它换成另一个数据集也不能升为主证据。
    falsifier: |
      所有者要求照字面先跑 HSBC mock → 按 S6.P3 原规格运行三档，结论一律标「未达可检出规模」与「档位为样本量、非重合率」；
      FedAds 补充冻结发现其同样无法给出可分辨的配对比较（例如按用户去重后正例远低于 700 且无可替代的聚类单位）→ S5.G3 降为描述性报告，并回到所有者裁定第二组证据。

  - key: D-2
    question: ⓑ「主对比结论按『未达可检出规模』报告」怎么执行
    decision: |
      主对比 A − L1_k10 的结论标签保留口径 v1 的判定「可分辨的提升」，凡引用处须同时给出规模标注：
      「开发评估集正例 586，未达预注册目标 700；可检出差异 0.024，大于关心尺度 0.02」。
      不改标为「未达可检出规模」。
    rationale: |
      evaluation_protocol.md 第四节的判定表把「未达可检出规模」定义为「区间含 0，且可检出差异 > 预注册的关心尺度」，
      并要求该标签「不得写成无差异，也不得写成有差异」。主对比区间为 [0.033, 0.053]，不含 0，下界也高于 0.02；
      照字面改标，等于把一个区间不含 0 的结果报告成「没有检出」，与冻结的口径相抵。
      推翻条件写于结果之前，设想的是检出力不足导致主对比没有结论；实际正例不足只抬高了可检出差异，没有改变任何一行的判定——
      contrasts_dev_eval.csv 的 10 行里，没有一行同时满足「区间含 0」与「可检出差异 > 0.02」（区间含 0 的 6 行，可检出差异为 0.006–0.012）。
      规模不足在显著结果上的主要风险是效应量高估（赢家诅咒）；主对比 p < 0.001、区间下界距 0 约 6 个标准误，高估风险小，但效应量仍以封存确认集为准。
    falsifier: |
      所有者要求按字面执行 → 主对比在所有引用处改标「未达可检出规模」，本项作废；
      封存确认集打开后主对比区间含 0 → 开发集上的「可分辨的提升」作废，按口径 v1 的判定表重新报告。

  - key: D-3
    question: DR-GOV-016 其余各项是否仍成立
    decision: |
      D-1（恢复）成立，不变。
      D-3（单进程两方模拟，不重启虚拟机）成立；SGB 单进程训练约 55 分钟，S5.G2 的 SS-XGB 预计更慢，届时按同一方式运行并记录墙钟。
      D-4（所有者一次合并 #14、关闭 #13）待所有者操作；#15（S5.G0、S5.G1、本记录）叠在 #14 上，#14 合并后改指向 main。
      D-5（本机目录）已于 2026-10-26 11:32 解除；连接时断时续，S5.G1 的私有产物已于 14:05 写回本机
      8-9月/G3五臂对比/S5.G1_santander_20261026/outputs/ 并逐文件核对 sha256。FedAds 原始文件只在本机（训练 1.45 GB、测试 1.36 GB），
      S5.G3 须在本机先筛选再转入会话，沿用 S5.G1 的做法。
      执行顺序（DR-GOV-016 · D-2 原为 ③ A_secure 先于 ④ FedAds 与 HSBC mock）改为：M6 FedAds 补充冻结 → S5.G3 FedAds → S5.G2 A_secure；
      M7 的 B_T1 叶子编码组合披露评估不依赖本机，可与之并行。
    rationale: 逐项对照 S5.G1 的执行记录与当前远端、本机状态。FedAds 回答「构造切分会不会高估增益」，比 A_secure 的精度与成本对形态判决更关键：B_T1 已接近 A，双向形态的安全版本排在其后。
    falsifier: 本机 FedAds 的 ZIP 与 8-9月/数据集/MANIFEST.sha256 登记的指纹对不上，或展开的 CSV 与 ZIP 内文件不一致 → S5.G3 暂停，先另立数据核对步骤。

falsifier: |
  本记录整体被推翻的条件：①所有者否认 2026-10-26 的授权或另行指定处理方式；
  ②发现 S5.G1 的正例目标或评估集桶数在看到评估月标签之后改动过（与 S5.G0 冻结记录不符）——此时主对比按无效处理，而非加注。

review_trigger: |
  ①S5.G3 FedAds 完成时；②封存确认集打开前；③所有者对本记录 D-1、D-2 提出不同处理方式时。
