dr_id: DR-M5-010
title: G3 臂 A_secure（SS-XGB）的运行方式：两进程生产模式、分段续训自行回放、上限计时口径与运行间波动
date: '2026-10-28T20:57:00+08:00'
amended: '2026-10-28T21:13:00+08:00'   # 补记 context ⑤，决策未改
agent: Claude (claude-opus-5-5, Claude Code)
module: M5
status: active
supersedes: null
requested_by: conceal008（所有者 2026-10-26 指示「继续恢复实验，你根据最终目的自主判断上述决策」，2026-10-28「继续」；DR-GOV-016、DR-M5-009）
related_step: S5.G2
related_change_id: CL-20261028-M5-001
preregistration: modules/m6_evaluation/configs/s6_p3_g3_preregistration.yaml

context: |
  S6.P3 写定 A_secure = 隐语 SS-XGB、配置沿用 A、只在 Santander、单次拟合上限 6 小时；DR-GOV-016 · D-3 写的运行方式是
  「SGB / SS-XGB 单进程两方模拟」（debug_mode）。开跑前核对（2026-10-28，开发评估集未接触）：
  ①debug_mode 下建 SPU 设备失败——两方 SPU 运行时在同一线程里依次建链，第一方等第二方时阻塞超时（YACLError: Failed to create link）；
  本会话的 secretflow-lite 不含 Ray，模拟模式也不可用。
  ②全量训练集（98,956 行、44 列）上训 2 棵树：约 139 秒/棵，150 棵约 5.8 小时，超过会话后台任务单次 2 小时上限，必须分段。
  ③隐语原生 checkpoint 续训（booster.train 的 checkpoint_data）载入已训练的树后不把它们回放到训练集预测上，续训的梯度按初始分数计算。
  ④小样本（5,000 行、8 棵树）两次不间断训练的结果不完全相同：根节点相同，较深的分裂在接近并列时会翻转，约 2.8% 的行预测差超过 0.001。
  ⑤（21:13 补记，重新启动之前）首次启动（20:58）前 4 棵实测约 159 秒/棵，比 ② 慢约 14%；按此 150 棵约 6.6 小时，D-3 的上限规则预计在
  约 135 棵时生效。首次启动的分段计划按 139 秒估算，第一段会越过会话 2 小时上限，且全局准备耗时只在段末记录、中途终止会丢失，
  故在第 4 棵后中止、检查点弃用不读，组件改为准备一结束即记录本段，再从第 0 棵重新开始。中止前未对任何集合打分。

decisions:

  - key: D-1
    question: 运行方式
    decision: |
      A_secure 用隐语生产模式（ray_mode=False）在本机起两个进程，各代表一方，经本机回环通信；SPU 两方 SEMI2K、FM128
      （与隐语测试默认两方配置相同）。打分只揭示给内地。臂的定义、配置与数据不变，只改运行方式。
    rationale: debug_mode 建不起 SPU 两方链路，没有其它可用方式；两进程更接近部署形态（两方各自进程、经网络交换份额）。
    consequence: |
      A 是单进程模拟（无网络），A_secure 是两进程回环，两者墙钟不是同一口径；成本比只能读作「同一台 2 核机器上的相对量级」，
      不作部署耗时估算。通信量按本机回环发送字节记（两方合计，含控制消息）；A 在单进程下没有可比的通信量。
    falsifier: 发现 debug_mode 下有可用的 SPU 两方配置（即 ① 是配置错误）→ A_secure 改用与 A 相同的方式重跑，本步成本数字作废。

  - key: D-2
    question: 分段续训
    decision: |
      组件 g3_ssxgb：每训完一棵树，各方把自己的叶子权重份额（SPU dump）与本方分裂信息写入各自目录并记进度；续训时载入已训练的树，
      先按训练顺序逐棵回放到训练集预测份额上，再训下一棵。单棵树的训练逻辑完全沿用隐语 Xgb。分段边界由启动方按进度一次算定，两方同一 stop_at。
    pre_run_check: |
      开跑前小样本核对（训练集前 5,000 行、8 棵树、第 4 棵后续训）：续训结果 8 棵树的根节点分裂与不间断训练逐棵相同；
      预测差超过 0.001 的行占 3.4%（两次不间断训练之间为 2.8%）。不回放对照（隐语原生续训）：续训后第一棵树的根节点重复第 1 棵，
      99.9% 的行预测差超过 0.001，平均预测 0.128（不间断 0.159）。核对在 S5.G2-1 notebook 中重跑留档。
    falsifier: |
      notebook 重跑核对时任一条不成立 → 续训无效，A_secure 结果作废：①续训与不间断训练的根节点分裂逐棵相同；
      ②续训与不间断训练预测差超过 0.001 的行占比不超过两次不间断训练之间占比的 2 倍；③不回放对照在续训后第一棵树重复第 1 棵的根节点。

  - key: D-3
    question: 单次拟合上限的计时口径
    decision: |
      拟合墙钟 = 首段全局准备 + 每棵树的训练耗时（含建树前准备与预测更新），不含存档；分段带来的进程启动、重做准备与回放另记为续训开销，
      两者都报告。启动方不开始一棵按已训均值会越过 6 小时的树。训满 150 棵且拟合墙钟不超过 6 小时才算 A_secure 完成；
      否则记为「超出单次拟合上限、未完成」，不报告预注册的 A_secure − A 对比，只描述性报告已训棵数下的开发评估集 AUROC 并注明。
    rationale: 续训开销来自会话的 2 小时限制，不属于算法成本；计入会让结果取决于会话环境。分开报告，读者可自行加总。
    falsifier: 后续分段的平均每棵树耗时比首段高出 10% 以上（分段本身拖慢训练）→ 成本按分段前实测外推另报，并在结论中注明。

  - key: D-4
    question: 运行间波动与 seed 维度
    decision: |
      SS-XGB 的波动来自秘密分享定点运算的舍入，不受 seed 控制；预注册 A-3 对确定性臂只拟合一次的写法对 A_secure 只近似成立。
      6 次拟合约 35 小时，超出计算上限，故只拟合一次，配对重抽样的 seed 维度方差按 0 计，报告中注明低估。
    falsifier: A_secure − A 的判定为「可分辨」但差值绝对值小于 0.005 → 结论降级为「不能排除运行间波动」。

falsifier: |
  本记录整体被推翻的条件：①A_secure 的开发评估集打分在本 DR 写定之前被计算或查看；②所有者要求 A_secure 必须与 A 同一运行方式，
  或另定运行环境（如双虚拟机）。

review_trigger: |
  ①S5.G2 完成时；②在双虚拟机或多机环境复测 SS-XGB 成本时。

