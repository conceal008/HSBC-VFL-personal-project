what: |
  修订《项目维护约束 v2》1.1 的可见性条款：原文只写"Private，不得转 public"，未区分仓库归属；
  现按组织/团队仓库与个人仓库拆成两个分支，并为个人仓库走 Public 补四项前提（缺一不可）。
  据此把本仓库的 Public 状态从"已知偏离"重新定性为"合规"，同步更新全部状态类文件的表述，
  历史记录一律保留原文并以 superseded 标记与本条目作为更正留痕。

why: |
  DR-GOV-001 的偏离判断建立在错误的事实前提上：本仓库是个人账户下的私人仓库，
  不是机构/组织项目仓库，不承载任何机构主体的数据处理活动，因此不落入 1.1 所要保护的情形。
  1.1 的实质目的是防真实数据外泄与机构商业敏感信息外泄；在"数据永不入库"（第 2 部分，与可见性无关）
  与个人归属两个条件下，Public 并不触发这两件事。原判断把条款字面当成了条款目的。
  修订同时收紧了实际纪律：在本仓库取消 2.2 的 L-受限个案审查放行通道，L-受限一律按 L-禁止处理。

