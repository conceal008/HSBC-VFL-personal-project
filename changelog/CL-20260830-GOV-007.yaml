what: |
  在三份规范中新增「结果可见性」要求：凡产出处理结果或实验结果的步骤，
  必须以 modules/mX/notebooks/<步骤号>_<简述>.ipynb 为运行入口并带输出提交，
  没有 notebook 的结果视为未交付。
  同时写入六条配套纪律（位置命名 / 逻辑放 components / 参数从 configs 读 / 首 cell 打印运行指纹 /
  Restart & Run All 可跑通且 execution_count 单调 / 结论写在输出下方），
  以及输出的三档提交规则（合成结果必须带输出 · 真实数据派生输出必须清除 · 真实数据属 L-禁止）。

why: |
  原规范第 9 部分只覆盖"可复现"——另一个人能重跑出同样结果；不覆盖"可见"——
  另一个人不跑代码就能看到结果是什么。对一个要交给评审、需求方与法务合规看的项目，
  后者同样是交付的一部分：一段跑完就没了的处理，让所有人都必须先配环境才能知道结论。
  配套纪律不是附加负担，而是这条要求成立的前提：没有 N2/N3，notebook 会变成绕开
  组件化与配置驱动的后门；没有输出分级规则，"为了看结果"会把真实数据派生输出
  永久写进 Public 仓库的 git 历史。

