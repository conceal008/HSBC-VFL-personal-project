title: S5.G1 G3 五臂对比 Santander 第一批：L3 相对 L1 有增量，单向候选 B_T1 拿到约 92%
what: |
  按冻结的 S6.P3（S5.G0，f80f74f）在 Santander 构造切分上训练并比较九个臂：L0、L1（k=5/10/20）、B_T1、B_T2、
  A（隐语 SGB，单进程两方模拟）、集中式代理 L4、阴性对照 NC。三个带汇总输出的运行入口 notebook（数据与本地臂、SGB、配对比较）、
  运行配置 configs/s5_g1_santander_run.yaml、公开汇总 results/g3_santander_v1/（各臂指标、对比表、运行摘要与适用边界说明）。
  状态类字段同步：M5 README（状态、当前结论、下一步、S5.G1 一节）、step_ledger（追加 S5.G1，阶段预算 2/4）、
  registry/module_status.yaml 的 M5、M0 条目与 governance、experiment_pause（执行阻塞已解除）、任务清单 T6–T9、项目进度总览 notebook 计数（59→62）。
why: |
  项目要回答的第一个问题是 L3 相对 L1 有没有增量（项目目标与要求.md 第 4 节）；S0.9 形态判决缺单向形态的树/线性证据（DR-MX-002 · D-4）。
  验证的假设与结果（开发评估集 20,351 位客户、586 个正例）：
  ① L3 相对 L1 有 ≥ 0.02 的增量——成立，A − L1_k10 = +0.043 [0.033, 0.053]；
  ② L1 能拿到相当一部分联邦增益——不成立，L1 − L0 = +0.002 [−0.003, 0.007]，约 4%；
  ③ 单向形态有明显代价——不成立，A − B_T1 = +0.004 [−0.001, 0.009]，B_T1 约拿到 92%；
  ④ 增益来自信息互补——成立，NC − L0 = −0.004，区间含 0；⑤ SGB 与集中式无损——成立，A − L4 = −0.001，区间含 0。
  开发评估集正例 586 低于预注册目标 700（评估月正例率 2.9%，低于训练月平均 3.8%）：按停止规则 5 未追加样本，
  并触发 DR-GOV-016 · D-2 推翻条件，后续先做 HSBC mock（S5.G3）。
