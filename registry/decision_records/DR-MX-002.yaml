dr_id: DR-MX-002
title: 约束复核后的五项口径修订：显著性判据、离线正例下界、出境前提、树模型单向形态、恢复后顺序
date: '2026-10-25T16:10:00+08:00'
agent: Claude (claude-opus-5-5, Claude Code)
requested_by: conceal008（仓库所有者，2026-10-25 指示「请你修正不合理的地方，同时更新github里面相关文件」）
approved_by: conceal008（以合并本分支的 PR 为准；合并前本 DR 只是提议）
module: MX
status: active
supersedes: null
related_change_id: CL-20261025-MX-001
related_step: S-MX.2
review_doc: docs/03-handoff/约束与步骤复核_20261025.md

context: |
  所有者要求复核项目的约束与步骤，指出不合理处并修正。逐条对照仓库原文后，复核报告
  （review_doc）列出成立、部分成立与不成立的各项；本 DR 只记录需要改口径的五项。
  其余建议（主线取舍、收敛判据增补等）属所有者或团队裁定，列在复核报告第四节，不在此决定。
  本 DR **不授权恢复任何实验**；registry/module_status.yaml 的 experiment_pause 不变。

decisions:

  - key: D-1
    question: 「跨 ≥5 seed 且置信区间不重叠才算数」是否继续作为项目认可增益的判据（项目目标与要求.md 第 8 节）
    decision: |
      **前瞻适用**：只用于本 DR 合并之后新预注册的比较。
      ① 主判据改为配对差的 95% 置信区间不含 0，并给出 p 值。配对指同一测试客户、同一训练 seed 对齐；
         区间由「训练 seed × 测试客户簇」两层重抽样给出。
      ② 若使用 seed 级符号翻转检验，训练 seed ≥ 6。
      ③ 业务门槛不变：DR-MX-001 · D-4 的相对增益 20%。统计上可分辨但小于该门槛的差异，按「无实际差异」报告。
      ④ 同时补报旧判据一栏（两个区间是否重叠），便于与历史结果对照。
      已发布的结果（S5.X3 等）按其发布时的口径保留，**不重判**（《维护约束 v2》禁止事项第 23 条）。
    rationale: |
      两个置信区间是否重叠，检验的不是差异本身：区间不重叠能推出差异显著，反之不成立。
      两区间宽度相同且相互独立时，「95% 区间不重叠」相当于要求 p < 0.006 左右，远严于名义的 0.05；
      配对设计下两臂共享测试客户，差值的方差更小，旧判据还把这部分信息丢掉了。
      另外，5 个 seed 的双侧符号翻转检验最小 p 值是 2/2⁵ = 0.0625（README「结论的适用范围」已注明），
      按 0.05 判断在结构上不可能通过。仓库 S5.D1 设计（候选方法与对照实验设计.md 5.2 节）已经在补报配对差值区间，
      本项把它从「补报」升为主判据。
    consequences:
      - "M5/M6 的预注册模板须写明两层重抽样的次数、簇定义与 p 值计算方法"
      - "新比较若沿用 5 个 seed，只能用配对 bootstrap 判断，不得使用符号翻转检验下结论"
    falsifier: |
      在 M2 零效应合成设定（两臂同分布）下按本判据重复 ≥200 次，若第一类错误率 > 0.07
      （名义 0.05 加模拟误差），本项作废，回退到旧判据并写明原因。

  - key: D-2
    question: 离线 ROC曲线下面积（AUROC）比较是否需要声明正例下界
    decision: |
      每个 AUROC 比较在预注册时写明测试集正例数（按客户去重）和由 S0.1P 组件
      （modules/m0_compliance/components/validation_power.py）算出的配对最小可察差异（MDE）。
      观察到的差小于该值时，结论只能写「未达可检出规模」，不得写成「无差异」或「有差异」。
    rationale: |
      S0.1P 显示离线比较的精度由测试集正例数决定，几乎不随正例率变化：参考 AUROC 0.86、
      两模型估计相关 0.8 时，检出配对差 0.02 约需 441 个正例，0.01 约需 1,763 个。
      S0.1 的 N_eff ≥ 30,000 是随机对照增益检验的人数口径，不能代替这一下界。
    consequences:
      - "M5 S5.X3 中 FedAds 等稀有正例任务的区间跨零，可在新报告中补注测试集正例数与可检出差异；原结论措辞不改"
    falsifier: |
      在 M2 合成数据上用模拟求所需正例数，若与 S0.1P 近似相差 > 25%，改用模拟法，
      并重算 offline_auc_positives.csv。

  - key: D-3
    question: 出境机制推演是否遗漏了「关键信息基础设施运营者」前提，以及训练人群与试点人群是否被混为一谈
    decision: |
      技术侧自评，未经法务复核（W-001）。
      ① **补正摘录**：legal_references.md 一之二节对第五条第（四）项、第七条、第八条的摘录，
         漏掉了限定语「关键信息基础设施运营者以外的数据处理者」，也没有摘录第七条第（一）项
         「关键信息基础设施运营者向境外提供个人信息或者重要数据」。全仓库此前没有任何一处讨论
         汇丰银行（中国）是否为关键信息基础设施运营者。由 S0.6R 补正，并在
         export_mechanism 组件加入该前提；默认值保持原行为，已发布的判定矩阵不变。
      ② **推演结论改为条件句**：
         - 若为关键信息基础设施运营者：形态 A 与形态 B 中凡有内地向香港（cn→hk）的个人信息流动
           （含 CBA-002 标识符哈希），都须申报数据出境安全评估；只有形态 C 不触发。
           大湾区标准合同实施指引没有规定关键信息基础设施运营者能否适用，按 W-001 最严解释视为不可用。
         - 若不是：S0.6、S0.7 的原结论不变。
      ③ **训练人群与试点人群分开计数**：第七、八条按「自当年 1 月 1 日起累计向境外提供」的人数计。
         形态 A 中承载敏感个人信息的 CBA-005 梯度只对**训练人群**产生，而 N_eff ≥ 30,000 是**随机对照试点人群**。
         S0.5、S0.6「可验证性与轻量出境路径不可兼得」把两者当成同一人群，须由 S0.6R 分别计数后重新判断。
         试点期推断协议在 cn→hk 方向传什么，须逐协议核对，不预设结论。
      ④ **新增需求方问题**：汇丰银行（中国）是否已被认定为关键信息基础设施运营者。
         按《关键信息基础设施安全保护条例》第十条，认定结果通知运营者本人，技术侧无法判定。
    rationale: |
      W-001 的代偿措施要求「引用逐字法条原文」；被漏掉的限定语恰好决定第五条第（四）项豁免、
      第八条标准合同路径是否适用。金融属于该条例第二条列举的重要行业。
      人数口径方面，法条计的是向境外提供个人信息所涉人数，提供敏感个人信息的环节只有训练。
    consequences:
      - "M0 新增 S0.6R：补正摘录、组件加参数、新增带关键信息基础设施运营者维度的判定矩阵；不改已发布结果文件"
      - "专家咨询与需求方问题清单新增「是否为关键信息基础设施运营者」，排在内地侧签约主体注册地之前"
      - "形态 C 的工程可行性（不向香港侧提供任何标识符派生值的对齐方式，例如经合规确认可用的跨境理财通账户配对关系）升为 M3 待评估项"
    falsifier: |
      法务确认汇丰银行（中国）为关键信息基础设施运营者 → ③ 对出境机制不再有影响，只保留对样本量的意义；
      法务认定 CBA-005 不属个人信息 → 本项整体重写；
      逐协议核对发现试点期存在承载标签信息的 cn→hk 流动 → 试点人群须并入敏感个人信息口径计数。

  - key: D-4
    question: 在「不引入神经网络」约束下，形态 B（单向）的效果代价由什么证据回答
    decision: |
      神经网络禁令正式撤销之前，S0.9 所需的「形态 B 代价」证据改由线性或树方法产生。登记三个候选，均**未执行**，
      所有者授权恢复实验后另立分支卡：
      - B-T1：香港侧无监督随机树嵌入（叶子编码），按 k-匿名粗化后一次性从香港提供给内地（hk→cn）；
      - B-T2：香港侧用自有业务结果训练本地模型，只把分数 hk→cn。标签与主口径不同，须写明迁移假设；
      - B-T3：L1（k-匿名聚合统计）本身就是单向形态，作为下界。
      对照为内地单边（L0）与双向 L3，使用同一冻结开发分区。
    rationale: |
      项目目标与要求.md 第 16 节已指出：禁令有效时，形态 A/B 的区分「基本失效」，单向出路「可能不成立」。
      现有唯一的形态 B 代价证据是 SplitNN 合成实验的 0.045 AUROC（CL-20260903-M5-001），属于被禁的模型族。
      此后 S5.D1、S5.E4 与 RESTART_PLAN 都按禁令有效执行。S0.9 因此一直卡在一项按现行约束不能产生的测量上。
    consequences:
      - "RESTART_PLAN「后续分别立项」新增一项：树或线性单向形态候选 B-T1 至 B-T3"
      - "M0 S0.9 的判决依据改为 B-T1 至 B-T3 的结果，不再等待 SplitNN 证据"
    falsifier: |
      所有者或需求方正式撤销神经网络禁令 → 三个候选降为可选对照；
      三个候选在开发分区上均不优于 L1 → 树或线性下形态 B 没有增量，S0.9 只能在形态 A 与「不做联邦」之间选择。

  - key: D-5
    question: 所有者授权恢复实验后，第一批做什么
    decision: |
      恢复后的第一批改为下面三项，与原 S5.D2 端点诊断可以并列，但都排在 M7 的 840 场景输出重评之前：
      ① L1 与 L3 的同等认真比较（DR-GOV-009 红线④）；
      ② D-4 的形态 B 候选；
      ③ 阴性对照：在对齐客户内打乱被动方特征行、保留边际分布，用同一调参预算重跑，联邦增益应回到 0。
      DR-M5-008 授予 S5.D2 的额度不变。**本项不授权恢复。**
    rationale: |
      README 写明低成本 L1 比较仍「待完成」，S5.D2 只完成一次失败的预检。项目要回答的第一个问题
      （项目目标与要求.md 第 4 节）正是 L3 相对 L1 的增量；①②直接决定 S0.9 与终点判据。
      M7 重评的 840 场景不改变 S0.9。阴性对照成本低，能区分「信息互补」与「容量或调参带来的增益」。
    consequences:
      - "RESTART_PLAN 顶部加注本项；原文保留"
    falsifier: 所有者在恢复指令中指定其他顺序，或需求方要求先交付 M7 结果 → 按所有者指令执行，本项作废。

falsifier: |
  本 DR 作为一组口径整体被推翻的条件（各条另有自己的 falsifier，见 decisions[].falsifier）：
  ① 所有者不合并本分支的 PR → 五项均不生效，复核报告只作记录保留；
  ② 复核报告第二节任一「出处」经核对与仓库原文不符 → 依赖该出处的决策作废，另写 DR 更正；
  ③ 法务复核否定 D-3 的条文读法 → D-3 作废，D-4、D-5 中依赖形态判决的部分一并重议。

review_trigger: |
  ①需求方答复是否为关键信息基础设施运营者时；②所有者授权恢复实验时；③神经网络禁令被正式裁定时。

