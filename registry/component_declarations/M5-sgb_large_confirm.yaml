component: sgb_large_confirm
module: M5
path: modules/m5_modeling/components/sgb_large_confirm.py
purpose: S5.M8 Orange 大版流失的真实 SGB 复核（DR-M5-015 · D-6）：在 S5.M5 主分析的同一私有输入（每方前 300 个编码列，final 视图）上，用主动方明文直方图版本（S5.M7 已证与原版逐位相同）各拟合一次原版联邦与优化版联邦；按 D-6 先估算拟合秒数，超过上限的方法不拟合；与同配置代理比较、SGB 内部对比 F_opt_p − F_def，口径同 S5.M2（method_screen_sgb.evaluate，测试行 bootstrap）。每个方法分别存档，可分段续跑。
inputs:
- S5.M5 的私有输入矩阵与结果 JSON（MS_PRIVATE_ROOT、MS_LARGE_DIR）
- 配置 modules/m5_modeling/configs/s5_m8_orange_large_sgb.yaml
outputs:
- 运行输出（MS_M8_DIR）：时长估算、每个方法的拟合信息与汇总 JSON（只含聚合指标），逐行打分与启动指纹
- 公开汇总 modules/m5_modeling/results/sgb_large_v1/
tests:
- modules/m5_modeling/tests/test_sgb_large_confirm.py
cross_border_assets: []
cross_border_note: 公开数据上的离线单进程两方模拟，不接触真实个人信息、不向境外传输任何数据，故无跨境资产。
caveat: 单次拟合（seed 11），不含训练随机性；耗时为会话容器上单进程两方模拟的合计计算时间。明文直方图只是实验代码里的替换，用于正式联调需在隐语上游或项目封装层实现并经安全评审（技术侧自评，未经法务复核，W-001）。逐行打分只存会话临时目录，不入仓库。
declared_at: '2026-11-04'
declared_by: Claude (claude-opus-5-5, Claude Code)
