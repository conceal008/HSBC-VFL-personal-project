title: 实现门禁 5 · 代码质量（六项检查），补齐 62 个单元测试与 11 份组件声明
what: '实现 ci/check_code_quality.py，六项检查对应框架门禁 5 表格的五行加术语规范：Q1 lint（ruff，0 error）· Q2 类型检查（mypy，0 error）·
  Q3 单元测试 100% 通过且核心逻辑行覆盖 ≥70%（stdlib trace 测量）· Q4 组件声明 100% · Q5 每组件 ≥1 冒烟测试 · Q6 术语禁用词 0 命中。

  配套产出：6 份测试文件共 62 个测试用例；11 份组件声明；回归套件新增门禁5-A/B/C/D 四组（22→28 组）；接入 run_all_gates.sh 与 GitHub Actions。'
key_finding: '**门禁 5 的测试查出了一处已进入 main 的实现缺陷：**

  M6 的 Qini 曲线**不含原点 (0,0)**，导致 AUUC 的积分从 x=1/n 起算，与随机基准的对角线不可比。已修正。

  ⚠️ **重跑全网格后 AUUC 与 Uplift@10 到小数点后 4 位完全不变**（L0 0.0059/0.0557、L4 0.0076/0.1066），判别力指标逐位相同——原点项在约 2000
  个点的梯形积分中可忽略。**即：修正是必要的，但此前发布的结论不受影响，原数字并非错误。**


  另有两处需要知其代价的范围决策：

  ① 门禁 5 的 Q1/Q2 **只覆盖 .py 源码，不覆盖 notebook**——ruff 的跨 cell 分析会把首个 cell 的导入判为未使用，逼着把 notebook 写扭曲；notebook
  的真正风险（魔数/种子/指纹/执行顺序）门禁 6 已覆盖。代价：notebook 内的语法级坏味道无人拦截。

  ② 门禁 6 的 R1 魔数扫描**对测试文件豁免**——测试里的字面量就是测试的规格说明，把断言的期望值提成模块常量只会更难读。代价：测试若内部硬编码实验参数不会被发现，兜底是 Q3 的覆盖率与真实通过要求。'
why: '门禁 5 与门禁 7 在治理骨架阶段就标记为「待第一份代码组件 / 主链路出现」。初版产出了 11 个组件与完整主链路后触发条件已满足，本次因会阻断实验交付而绕开，并在《初版完成说明与降级清单.md》中列为合入后第一优先项。本步即兑现该承诺。

  更实际的理由：本次实现门禁 5 的过程本身就抓出了一个已推送到 main 的缺陷——这正是门禁存在的意义，也说明「等有空再补测试」的代价是真实的。'
