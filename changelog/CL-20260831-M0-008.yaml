what: |
  推演 R-C（粤港澳大湾区个人信息跨境流动标准合同），并**更正 S0.5 的一处判断**。

  S0.5 曾写「R-B 与 R-C 在敏感个人信息口径下不可选」。关于 R-C 的那半句是错的：
  依香港数字政策办公室公布的便利措施，《大湾区标准合同》**免除了跨境传输个人信息数量上的限制**，
  并把 PIA 重点评估内容由 6 项减至 3 项。因此第七条「1 万人以上敏感个人信息须安全评估」
  在大湾区标准合同下不再构成障碍——若适用，形态 A 不必走安全评估。

  但三项适用前提目前全部未确认：
  P1 处理者须注册于大湾区内地九市——**汇丰银行（中国）注册地不在九市之内，分行不具独立法人资格**；
  P2 排除被认定为重要数据的个人信息——金融行业目录须查证；
  P3 「免除数量限制」是否覆盖敏感个人信息——官方表述字面覆盖，条文原文未明示。

  另确认：R-C 只对形态 A 有价值。形态 B 在一般规则下本就落在豁免，
  走大湾区标准合同反而要多做备案与 PIA。

why: |
  S0.5 的判断建立在「三条出境路径都受第七、八条阈值约束」这一前提上，
  而大湾区标准合同恰恰是该前提的例外。这个错误如果不纠正，
  会让 S0.9 在一个被人为缩小的选项集里做判决——形态 A 会被过早否掉。

  更正之后出现的新问题比原问题更实际：**内地侧的签约主体到底是谁、注册在哪里。**
  这个问题此前没人问过，技术侧也无法自行判定，但它的分量不亚于业务四要素——
  P1 成立则形态 A 的合规负担降到与形态 B 相近，「为合规牺牲建模效果」这个两难可能根本不存在；
  P1 不成立则形态 A 只能走安全评估（6–12 个月、成本档高）。

  同时必须记录：R-C 不改变漏斗的任何一层，可用样本仍是 low 4 / mid 264 / high 6,395。
  **至此三条路线的可用样本估计均低于业务最小可行规模 30,000，框架 M0 的升级条件已经满足。**

