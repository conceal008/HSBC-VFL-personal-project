title: S5.M2 补记单次拟合理由：seed 维度方差按 0 计，区间偏窄
what: |
  S5.M2 提交（CL-20261103-M5-002）未通过门禁 2 下半：type=exp 的 changelog 只记了 seed [11]。本提交只改文档：
  - CL-20261103-M5-002 的 reproducibility.seeds 改记对照列（S5.M1 代理）的 6 个 seed，新增 seeds_note 写明真实 SGB 每个单方法只拟合 seed 11、
    M6 成员用 seed 1100–1105；step.revisions 1 → 2；
  - DR-M5-012 · review_20261103_s5m2 补记单次拟合的理由（一轮约 3.8 小时，6 轮约 23 小时）与后果（区间偏窄）；
  - results/method_screen_sgb_v1/README.md 的适用边界同步；
  - step_ledger 的 S5.M2 条目修正轮次 1 → 2，并记下本次修正。
why: |
  门禁 2 要求 exp 至少记录 5 个 seed。真实 SGB 只拟合了一次，补跑 4 个 seed 约需 15 小时以上，超出预算。
  按 DR-M5-010 对 A_secure 的先例处理：seeds 记对照列的 seed，并在同一位置写明 SGB 只拟合一次、区间不含训练随机性。
  结论措辞本来就是「单次拟合、区间只含测试集抽样」，数字与结论不变。上一提交未推送；修正提交单独提交，不改写历史。
