dr_id: DR-GOV-003
title: 取消单步规模硬上限与门禁 3，改为定性拆分判据
date: 2026-08-30T00:50:00+08:00
agent: Claude (Opus 5, Claude Code)
requested_by: conceal008（仓库所有者 / 本课题线负责人）
approved_by: conceal008（仓库所有者；合规角色尚未指定，涉及数据分级的条款未在本 DR 触碰，故无需合规 approve）
module: GOV
status: active
supersedes: 《项目维护约束 v2》3.2 全节 · 门禁 3 · 《Loop 执行规范 v2》1.2 的六项量化上限
related_change_id: CL-20260830-GOV-005
related_step: S-GOV.2

context: |
  原规范以六项硬上限定义"一小步"：文件数 ≤3 / 代码 ≤300 行 / 工具调用 ≤15 /
  路线 ≤1 / 结论 ≤1 / 耗时 ≤1 会话，并配门禁 3（>3 警告、>5 阻断）与 PR 规模自查表。
  仓库所有者要求删除此类阻碍推进的强制约束。

evidence_from_practice: |
  三个步骤里触发了两次"例外说明"：
    · S-INIT.1 仓库初始化 101 个文件——骨架在物理上无法拆成多个提交而仍保持仓库可用，
      拆分后的中间态是"缺 AGENTS.md 或缺门禁的仓库"，比大步子更糟；
    · S-INIT.1R 条款修订触及 10 个文件——一处条款修订必须同步其全部引用点，
      拆分会产生"条款已改、引用点仍写着旧结论"的自相矛盾状态，正是禁止事项第 16 条要防的。
  一个在正常工作里频繁需要"例外说明"的上限，说明它测量的不是真正要控制的东西。
  上限真正想控制的是"步子大到无法定位失败"，而这与文件数并不同构——
  101 个骨架文件是一个判断单元，3 个跨模块的散改可能是三个。

decisions:

  - key: drop_size_caps
    decision: |
      取消全部单步规模硬上限与门禁 3。changelog 的 scope 段继续填写实际规模，
      但降级为**记录**，不再是放行判据；CI 不再有任何基于规模的阻断。
      ci/check_step_scope.py 不再实现；门禁 3 编号保留不复用，避免打乱既有引用。
    replaced_by: |
      定性判断两条：
        · 拆分判据（保留，原有）：自评 rubric 中有超过 1 项无法在本步内判定 → 必须拆。
          这条防的是"做到一半发现方向错"，与文件数无关，是该机制的真正内核。
        · 不拆判据（新增）：若强行拆分会产生自相矛盾的中间态 → 不得拆，一次做完。
      单步唯一不变的边界：一次提交只承载一个步骤（提交历史与步骤台账一一对应）。

  - key: unchanged
    decision: |
      本 DR **不触碰**以下条款，它们与推进速度无关或正是仓库价值所在：
        · 第 2 部分数据分级与 L-禁止 / L-受限纪律（门禁 1）
        · 7.2 六项合规一致性核验（门禁 4）
        · 8.2 步骤元数据完整性与 Step-Score ≥10 通过线（门禁 2）
        · 一步一提交、changelog 条目、步骤台账、交接记录、失败分支归档
        · 0.7 反指标操纵红线与第 12 部分禁止事项（除步进类第 4 条措辞调整外）
    rationale: |
      规模上限约束的是"怎么切工作"，删掉只影响节奏；
      上述条款约束的是"结论可不可信、数据会不会泄"，删掉会让仓库失去存在意义。

falsifier: |
  下列任一现象出现，即证明取消上限是错的，须恢复某种形式的规模约束：
  ① 出现一次提交同时推进多条互斥路线、事后无法判断哪条路线导致失败的情形；
  ② 出现因步子过大而无法定位失败环节、需要整步回滚重做的情形（连续 2 次即恢复）；
  ③ 步骤台账里出现单步自评无法覆盖全部产出的情形（一步产出多个互不相关的结论）。

review_trigger: |
  ①上述 falsifier 任一命中；②M5 以后进入并行多路线实验期时复审一次
  （彼时"一步不同时推进两条路线"可能需要以别的形式回来）。

consequences:
  - "《项目维护约束 v2》3.1 / 3.2 / 4.2 / 5.3 / 5.4 / 第 8 部分门禁 3 / 附录 A / 附录 B 已同步修改"
  - "《Loop 执行规范 v2》1.2 与附录单步模板已同步修改"
  - "仓库副本与 8-9月/ 源件逐字一致，已 diff 校验"
  - "ci/check_step_metadata.py 移除 routes_covered 阻断；PR 模板规模自查改为规模记录"
  - "历史记录中的规模例外说明（CL-20260829-GOV-001、CL-20260830-GOV-003/004、HO-20260829）保留原样，不改写"
