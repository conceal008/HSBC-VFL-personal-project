what: |
  实现 ci/check_changelog_schema.py（4.2 结构校验，覆盖全部条目而非仅 HEAD 那条），
  并建立门禁回归测试套件 ci/tests/：12 组用例覆盖门禁 1、门禁 4、门禁 2 与 schema 校验的
  放行与拦截两侧，接入 CI 作为独立 job。
  同时修正 schema 校验的两处实现问题：PyYAML 会把合法 ISO8601 解析成 datetime（原正则误报）；
  type=exp 且 reproducibility 整段缺失时需显式要求种子与 config。

why: |
  两件事之前没有保障。其一，changelog 的结构完整性只在 HEAD 那一条上被校验，
  历史条目改坏了没人知道；其二，也是更重要的——三个门禁的"拦截能力"只在实现当时用临时目录
  验证过一次，之后任何一次改动都可能悄悄把拦截逻辑改没，而"不误报"的表象仍在。
  门禁脚本最危险的失效形态是假通过，回归套件把它变成会响的失败。
  顺带把 S-INIT.2 与 S-INIT.3 各扣的那 1 分（构造样本未夹具化、他人无法复跑）补上。

