title: 实现门禁 7 · 端到端冒烟，落地 platform 编排层与断点续跑
what: '实现 ci/check_e2e_smoke.py 四项检查：E1 主链路跑通 · E2 时长 ≤5 分钟 · E3 断点续跑结果与不中断**逐位一致** · E4 单方不可用降级（M8 后启用，现报告未启用及触发条件）。

  配套落地 platform 编排层（此前为空目录）：pipeline.py 提供阶段抽象、产物落盘复用、运行指纹与运行清单；main_chain.py 装配 M2 生成 → M3 对齐 → M5 建模
  → M6 评估 → M7 攻击五个阶段；platform/configs/smoke.yaml 给出配置驱动的冒烟规模。

  回归套件新增门禁7-A/B/C/D/E 五组（28→33 组）；接入 run_all_gates.sh 与 GitHub Actions。'
key_finding: '**E3 的真正价值不是验证「续跑机制可用」，而是验证「主链路没有未固定的随机性」。**

  任何一处用了系统时间、未播种的随机数或依赖字典遍历顺序，「一口气跑完」与「中断后续跑」就会分叉。回归用例门禁7-C 用一个故意不播种的阶段证明了这条检查真能抓到——这是本门禁唯一无法靠「本仓库恰好通过」自证的部分。


  实现中发现一处此前未被记录的工程约束：**仓库目录 `platform/` 与 Python 标准库模块 `platform` 同名**，`import platform.orchestration.xxx`
  不可行（stdlib 的 platform 是模块不是包）。调用方必须把该目录本身加入 sys.path。目录名由框架规定，只能在导入侧绕开，已在 pipeline.py、main_chain.py、组件声明与测试中各处注明。


  同时把 platform/ 纳入门禁 5 的管辖范围：platform/README 明写「每个组件必须有 schema 声明与冒烟测试」，若门禁 5 只管 modules/，跨模块共享代码反而绕过了质量门槛，而它的影响面更大。'
why: '门禁 7 与门禁 5 同为初版绕开的两处强制要求，已在《初版完成说明与降级清单.md》列为合入后第一优先项。本步兑现其余一半。

  门禁 7 还补上了一个此前没有的能力：**主链路的确定性验证**。此前只有「同种子同结果」的单元测试，没有跨阶段、跨进程的一致性检验；而合成数据实验的全部可信度都建立在确定性之上。'
