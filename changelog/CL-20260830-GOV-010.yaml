what: |
  CL-20260830-GOV-009 声明要把 GOV-008 的 verification 第 2 条改为可成立的命令，
  但其执行脚本的正则转义与文件中的字面量不匹配（文件里是两个反斜杠 \\| ，脚本传入一个 \| ），
  替换未命中，而脚本在断言失败后未中止，导致该条目已提交、目标文件却未变。
  本条落实实际修改，并在 GOV-009 追加 post_commit_note 记录未生效的事实与原因。

why: |
  一条声称改了、实际没改的记录，比没有记录更危险：后续执行体会据此认为核验命令已可用。
  按第 0 部分原则三（说的和做的必须可机器核验），说做不一致必须改实现，不能靠解释消化。
  未使用 force push 抹掉 GOV-009——1.1 对 main 禁用 force push，且抹掉会让
  "曾声明过一次未生效的更正"这一事实消失。

lesson: |
  文本替换类步骤的 success_criteria 必须包含"改动后复查目标文件内容"，
  只看脚本是否报错不足以确认改动生效；断言失败时脚本也未必会中止执行流。

