# S5.G1 · G3 五臂对比 Santander 第一批的运行配置
# ---------------------------------------------------------------------------
# 设计参数全部来自冻结的预注册 modules/m6_evaluation/configs/s6_p3_g3_preregistration.yaml（S5.G0，f80f74f）；
# 本文件只放运行所需的路径约定、显示精度与运行细节，不改任何冻结项。
# 私有输入与逐行输出放在环境变量 G3_PRIVATE_ROOT 指向的目录（本机 8-9月/G3五臂对比/ 或会话临时目录），不入仓库。
# ---------------------------------------------------------------------------
step_id: S5.G1
purpose: 按冻结的 S6.P3 在 Santander 上训练 L0、L1（k=5/10/20）、B_T1、B_T2、A（SGB）、集中式代理 L4 与阴性对照 NC，并做配对比较
preregistration: modules/m6_evaluation/configs/s6_p3_g3_preregistration.yaml
seeds: [11, 22, 33, 44, 55, 66]
seed: 11

private_root_env: G3_PRIVATE_ROOT
selected_rows_file: g3_selected.csv.gz
arrays_file: g3_santander_arrays.npz
local_scores_file: g3_santander_local_scores.npz
sgb_scores_file: g3_santander_sgb_scores.npz
tuning_file: g3_santander_tuning.json

candidate_group: dev_eval_candidates
l1_k_values: [5, 10, 20]
l1_k_primary: 10
segment_columns: {age: age, renta: renta}
segment_categorical: [segmento]

results_dir: modules/m5_modeling/results/g3_santander_v1
top_k_share: 0.10
n_bootstrap: 2000
alpha: 0.05
power: 0.80
round_auc: 4
round_rate: 3
