title: S5.M4 mock 重合 80 上 M6 的真实 SGB 复核：与代理差 +0.0013（容差内），SGB 上 M6 − 优化版 +0.0036
what: |
  方法筛选第二阶段（DR-M5-013）第 2 步，补齐 S5.M2 唯一推迟的一项。
  - 仓库组件 method_screen_sgb（S5.M2 同一实现，未改动）在 mock 重合 80 上拟合 6 个 SGB（行采样 0.8，seed 1100–1105），
    成员逐个存档，分 4 段后台续跑；与 S5.M2 已有的同任务 SGB 优化版打分配对。
  新增：
  - 运行配置 configs/s5_m4_sgb_m6_mock80.yaml；
  - 带汇总输出的运行入口 notebook S5.M4_1（核对组件 sha256、成员 seed 与成员平均，由存档打分重算全部指标）；
  - 公开汇总 results/method_screen_sgb_m6_mock80_v1/；
  - DR-M5-013 复核段 review_20261103_s5m4。
  状态类字段同步：BC-M5-018（sgb_mock80_bagging 完成）、step_ledger（追加 S5.M4，第二阶段 2 / 2 完成）、
  registry/module_status.yaml 的 M5 与 governance、M5 README、项目进度总览（notebook 74 → 75、带输出 46 → 47）。
why: |
  S5.M1 代理上 M6 在 mock 重合 80 +0.009，S5.M3 交叉验证 R1 也选了 P+M6；S5.M2 因 6 个成员约 4.5 小时推迟了这一项。
  结果（开发证据）：
  - M6 的 SGB 0.9142 与同配置代理 0.9128 差 +0.0013 [−0.0019, +0.0042]，在 0.005 以内，D-5 推翻条件未触发。
  - SGB 上 M6 − 优化版 +0.0036 [+0.0001, +0.0068]，p = 0.038（代理 6 seed +0.0092 [+0.0059, +0.0128]）：成立，幅度约为代理的 4 成。
    压缩来自优化版一侧：SGB 优化版本身比代理高 0.006（S5.M2 已降级）。
  - 6 个成员单独都不高于不采样的优化版（0.9045 ~ 0.9100 对 0.9106），增益来自平均；合计拟合 23,733 秒。
