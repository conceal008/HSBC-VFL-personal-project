context: |
  S0.1 完成后列出六项需所有者拍板的口径问题，涉及 M0 / M1 / M2 / M5 / M6 四个模块。
  所有者于 2026-08-31 一次性确认全部采纳建议值。本 DR 逐条记录决策、理由、
  下游后果与推翻条件，避免这些口径日后变成"当时好像是这么定的"。

decisions:

  - key: D-1
    question: 是否纳入增益（uplift）评估（框架决策点 5）
    decision: 纳入
    rationale: |
      营销的正确目标是增量转化而非响应率（框架判断三与 0.7 红线第 7 条）。
      更直接的理由：S0.1 的业务最小可行规模 N_eff ≥ 30,000 就是按双臂随机对照的
      增益检验推导的；不纳入增益评估，这个数字失去依据，须按纯排序指标重推。
    consequences:
      - "M1 必须补 ≥1 个含随机对照的数据源（候选：Criteo Uplift / Hillstrom）"
      - "M2 的生成器必须内置异质处理效应结构（11 项可调参数中的一项）"
      - "M6 的四层指标中「增量」层为最终判据，AUC 降为诊断指标"
    falsifier: 若 M1 遍历后确认无任何可用的随机对照数据源，则本决策不可执行，须退回重议

  - key: D-2
    question: 第二组数据口径取什么
    decision: 汇丰卓越理财（Premier）跨境升级，作为主口径（跨境理财通南向通）之外的并行验证口径
    rationale: |
      所有者已授权使用多组数据。两组口径的价值在于**互为对照**：
      南向通口径的转化是首笔交易级、样本稀疏；卓越理财跨境升级的转化更频繁、
      样本更充足，可用于检验结论是否只在稀疏场景成立。
    consequences:
      - "M1 的数据集选型须同时服务两组口径；两组的转化定义须分别冻结，不得混用"
      - "M5 的基线阶梯需在两组口径上分别跑，结论不一致时以主口径为准并如实报告差异"
    falsifier: 若两组口径的转化定义在两侧系统中无法统一（M4 时间口径统一失败），第二组口径作废

  - key: D-3
    question: 基线转化率取值
    decision: 暂定 3.0%，标记为显式假设，M1 选定代理数据集后校准
    rationale: |
      需求方未提供真实转化率。3.0% 是对「已同意的共同客户在 90 日内首次申购投资产品」
      的中性估计，用于让最小可行规模的推导可进行。它不是业务事实。
    consequences:
      - "S0.1 的 N_eff ≥ 30,000 随本值变化：1% → 8.5 万，5% → 1.6 万（见 results/mde_sample_size.csv）"
      - "M1 校准后必须重跑 notebooks/S0.1_mde_sample_size.ipynb 并更新 problem_statement.md"
    falsifier: 若校准值与 3.0% 相差超过一个量级，S0.1 的最小可行规模结论作废，须重写

  - key: D-4
    question: 业务最小可察差异（MDE）取值
    decision: 相对增益 20%（M6 冻结评估口径时复核）
    rationale: |
      《Loop 执行规范 v2》0.4 的建议初值（相对增益 5%）在基线 3% 下要求 N_eff ≥ 41.6 万，
      超出跨境共同客户的可能规模。取 20% 不是降低标准迁就现实，而是如实声明
      「本方案能验证的效应量级」——检不出更小的差异这件事必须写在结论前面而不是脚注里。
    consequences:
      - "M6 冻结口径时以此为准；任何小于该效应量的差异一律按「无显著差异」处理"
      - "0.4 的判决协议第三步（显著但无实际意义）以此为阈值"
    falsifier: 若 M3 算出的实际可用人群远超 30,000（例如达到 10 万量级），应收紧至相对增益 10%

  - key: D-5
    question: k-匿名性的 k 值（M5 的 L1 基线依赖）
    decision: k = 10 起步，并做 k ∈ {5, 10, 20} 的敏感性实验
    rationale: |
      k 直接决定 L1 基线的信息量与合规成本：k 越大聚合统计越安全、信息量越少。
      而 L1 是 VFL 的真正竞争对手，k 的取值会直接影响「VFL 到底值不值得」这一核心结论——
      因此不能取单值，必须给出敏感性曲线。k=10 为常见起步值。
    consequences:
      - "M0 的 CBA-006（聚合统计）定性须以 k=10 为基准描述"
      - "M5 的 L1 基线须产出 k ∈ {5,10,20} 三组结果，L3 vs L1 的结论须说明在哪些 k 下成立"
    falsifier: 若 k=5 时聚合统计仍被合规角色判定为个人信息，则 k 的敏感性实验失去意义，须改为论证不可行

  - key: D-6
    question: PSI 交集是否明文落地（框架决策点 4）
    decision: 倾向「不明文落地」——双方各持秘密分享份额，任何一方不获得明文共同客户名单。**正式判决仍在 S0.9**
    rationale: |
      交集是新产生的个人信息（框架 M0 不变式 I3）。明文落地意味着一方持有
      「哪些人同时是两行客户」的完整名单，这本身是需要单独论证的跨境信息。
      秘密分享形态的合规论证强度显著更高，代价是工程复杂度上升。
    consequences:
      - "M3 的对齐路线设计以此为默认前提，但仍须实现并比较明文落地的对照路线"
      - "S0.9 正式判决时若推翻本倾向，M3 的路线优先级须相应调整"
    falsifier: 若 M3 实测秘密分享形态的通信量或耗时使周期性重跑不可行，本倾向须让位于工程可行性

falsifier: |
  本 DR 作为一组口径整体被推翻的条件（各条另有自己的 falsifier，见 decisions[].falsifier）：
  ① 六项中任意两项的 falsifier 同时命中 —— 说明这组口径建立在共同的错误前提上
     （最可能是基线转化率 D-3），须整组重议而非逐条修补；
  ② M1 校准后的真实基线转化率与 3.0% 相差一个量级以上 —— D-3、D-4 直接失效，
     而 S0.1 的最小可行规模依赖二者，须连同 problem_statement.md 一并重写；
  ③ 需求方确认的业务要素与 S0.1 的假设 A-1..A-4 不符 —— 本组口径的适用场景不成立，全部作废。

review_trigger: |
  ①M1 完成数据集选型时复核 D-1 / D-2 / D-3；
  ②M6 冻结评估口径时复核 D-4；
  ③M5 的 L1 基线完成时复核 D-5；
  ④S0.9 正式判决时以 DR-M0-001 取代 D-6 的倾向性表述。
