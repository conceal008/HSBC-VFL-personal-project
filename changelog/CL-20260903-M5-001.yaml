title: 实现五级基线阶梯共 11 个模型并完成全网格实验，L1 只捕获纵向联邦价值的 12.3%
what: '实现 L0 内地单方、L1 k-匿名分段统计、L2 粗粒度标记、L3a 联邦逻辑回归、L3b 纵向 GBDT（SecureBoost 式 (g,h) 直方图交换）、L3c SplitNN 三形态（双向回传梯度
  / 冻结随机编码器 / 冻结自监督编码器）、L4 集中式，共 11 个模型。

  全网格：8 场景 × 5 种子 × 2 划分口径（随机 / 时间外推）= 1440 行结果；另做 4 参数条件价值扫描，与 40 种子的 L1-vs-L3 关键对照。'
key_finding: '**核心结论：L1 只捕获纵向联邦价值的 12.3%**（40 种子，L3a−L1 = +0.0590 [+0.0501, +0.0680]）。

  低合规成本的替代方案拿不到大头，本项目的商业前提成立。


  L1 的**结构性上界**：分段键只能用主动方特征（否则就需要逐人的对方信息，那已是 L2），故回传的统计量是主动方特征的函数，信息量在很大程度上已被主动方特征本身包含。这是机制限制，不是实现缺陷——k
  值取 5/10/20 对 L1 的 AUC 影响 < 0.0001 即为佐证。


  **形态B 随机编码器（0.7076）低于 L0 基线（0.7127）**：随机冻结编码器不但没有价值，还不如不做联邦。形态B 必须配自监督预训练才有意义（自监督形态 0.7213）。

  形态A（0.7664）比形态B 自监督高 0.045 AUC——这是「不回传梯度」的效果代价，回答了 M0 阶段 S0.6 提出但当时无法回答的问题。'
why: 项目的科学核心不是「联邦学习能不能跑通」，而是「相对于合规成本低得多的替代方案，它多带来多少价值」。DR-GOV-009 明确「L1 基线必须与 L3 同等认真实现——弱化 L1 等于伪造结论」，因此本步对
  L1 做了四重加强（分段数扫描、k 值扫描、安慰剂对照、关键对照单独用 40 种子），全部在对 L1 有利的方向上，并全部报告。
