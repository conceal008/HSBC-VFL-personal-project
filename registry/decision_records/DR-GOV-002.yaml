dr_id: DR-GOV-002
title: 修订 1.1 可见性条款：按仓库归属区分组织仓库与个人仓库；本仓库 Public 为合规状态
date: 2026-08-29T22:20:00+08:00
agent: Claude (Opus 5, Claude Code)
requested_by: conceal008（仓库所有者 / 本课题线负责人）
approved_by: |
  conceal008（仓库所有者）。项目尚未指定合规角色，按《维护约束 v2》5.4「M0/M9 相关需合规角色 approve」
  的精神，此处由项目负责人代行并在此记录；合规角色一经指定，须复核本 DR（见 review_trigger）。
module: GOV
status: active
supersedes: DR-GOV-001 · repo_visibility（该条决策整体作废，不再成立"已知偏离"的判断）
related_change_id: CL-20260829-GOV-002
related_step: S-INIT.1R

context: |
  DR-GOV-001 把本仓库的 Public 可见性登记为"已知偏离《维护约束 v2》1.1"。
  仓库所有者随后指出该判断的事实前提有误：本仓库是**个人账户下的私人仓库**，
  不是机构或组织的项目仓库，不承载任何机构主体的数据处理活动，
  因此不落入 1.1 条款所要保护的情形，不构成对该原则的违反。

problem_with_previous_judgment: |
  1.1 原文只写了"可见性：Private，不得转 public"，未区分仓库归属。
  该条款的实质目的是防两件事：①真实数据与真实数据派生产物外泄；②机构商业敏感信息外泄。
  这两件事在个人仓库 + 数据永不入库的前提下并不因 Public 而发生：
  第 2 部分本就禁止真实数据、派生统计量与凭证入库（不论仓库是否公开），
  而本仓库内容为方法学框架、治理登记表与合成实验的生成器/配置/种子。
  把"条款字面"当成"条款目的"，是把一个归属判断误当成了合规违反 —— 这是先前判断的错误所在。

decisions:

  - key: clause_amendment
    question: 1.1 可见性条款怎么改
    decision: |
      按仓库归属拆成两个分支：
        · 组织/团队仓库：Private，不得转 public（原文保留，不放松）
        · 个人仓库：可 Public，但须四项前提全部成立
      并在条款下方补「个人仓库走 Public 的四项前提（缺一不可）」：
        ①归属个人账户且不承载机构数据处理活动，不出现机构内部系统名/代号/端点与未公开材料；
        ②永不含真实数据、真实数据派生产物、真实客户标识（Public 下升级为不可豁免）；
        ③L-受限产物一律按 L-禁止处理，取消 2.2 的个案审查放行通道；
        ④不含机构内部端点与凭证；门禁 1 在每次 push 与 PR 上生效。
      任一前提不再成立即刻转 Private 并写 DR。
    rationale: |
      修的是条款覆盖不全（缺归属维度），不是放松保护强度。
      对个人 Public 仓库，第 3 条实际上比原规范更严：原 2.2 允许 L-受限产物经审查后提交，
      修订后在本仓库直接取消这条通道。净效果是"该管的更严，不该管的不再误判"。
    scope: |
      修订同时落到两份文件并保持逐字一致：
        docs/02-governance/3_项目维护约束_v2_步进量化版.md（仓库副本）
        /Applications/总文件夹/汇丰/8-9月/3_项目维护约束_v2_步进量化版.md（源件）
      修订标记为 v2.1，写在 1.1 标题下方的引用块中，指向本 DR。其余条款一字未动。

  - key: repo_status
    question: 本仓库当前可见性状态如何定性
    decision: |
      **合规**。conceal008/HSBC-VFL-personal-project 是个人账户仓库，四项前提当前全部成立：
        ①个人账户，不承载机构数据处理活动（仓库名中的机构名仅为课题标识，非机构官方产出）；
        ②仓库内无任何真实数据、派生产物或客户标识（门禁 1 全仓扫描 BLOCK=0 佐证）；
        ③L-受限一律按 L-禁止执行，已写入 AGENTS.md 与 PR 模板；
        ④无内部端点与凭证，门禁 1 已在 GitHub Actions 上对 push 与 PR 生效。
      不再表述为"偏离""违规""补偿控制"。DR-GOV-001 中相应措辞随之作废。
    rationale: |
      定性依据是归属与内容的事实核验，不是所有者意愿本身；四项前提可被逐条检验，也可被推翻。

  - key: history_handling
    question: 已经写进历史记录的"偏离"表述怎么处理
    decision: |
      **不改写历史**。已提交的 changelog 条目 CL-20260829-GOV-001、项目实时日志 2026-08-29 21:55 条目、
      交接记录 HO-20260829-Claude-GOV.md 的正文一律保留原样（append-only 原则、日志维护规则第 6 条），
      由本 DR 与 CL-20260829-GOV-002 作为更正记录；DR-GOV-001 的 repo_visibility 条标记为 superseded。
      当前状态类文件（AGENTS.md / README.md / module_status.yaml / PR 模板 / 治理 README）则直接更新为新表述。
    rationale: |
      历史记录的价值在于"当时是怎么判断的"，抹掉它就抹掉了判断被修正这件事本身。
      状态文件的价值在于"现在是什么"，必须与事实一致。两者规则不同，不能混用。

falsifier: |
  下列任一现象出现，即证明本 DR 的判断错误，须重开决策并转 Private：
  ① 本仓库出现任何真实数据、真实数据派生统计量（分箱边界 / IV 表 / 分布统计 / 交集规模 /
     真实样本量与正样本率）或真实客户标识 —— 前提②③被推翻；
  ② 仓库开始承载机构主体的数据处理活动，或被作为机构官方产出对外引用 —— 前提①被推翻；
  ③ 需求方、mentor 或日后指定的合规角色认定公开发布方案细节构成商业敏感信息外泄 —— 条款目的判断有误；
  ④ 门禁 1 漏放任何一类应拦截内容到公开远端 —— 前提④的技术保障不成立。

review_trigger: |
  ①项目指定合规角色后，须由该角色复核本 DR；
  ②仓库转交机构主体、或与机构仓库合并时；
  ③首次出现需要提交 L-受限产物的需求时（此时不是放行，而是转 Private 后再评估）。

consequences:
  - "本仓库可见性保持 Public，不再记为偏离；相关 ⚠️ 表述从状态类文件中移除"
  - "L-受限产物在本仓库无放行通道，这一条比原规范更严，须写进每次 PR 自查"
  - "1.1 的其余条款（分支保护、必需检查、审查要求、force push、Secret 扫描、历史）不受本 DR 影响，仍全部适用且尚未开启"
