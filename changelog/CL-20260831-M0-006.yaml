what: |
  推演 R-A（PIPL 第 38 条第（一）项数据出境安全评估路径），产出框架要求的四项：
  · 可行域：八类资产逐条判定。R-A 真正解决的只有 CBA-005 梯度回传一条——
    hk → cn 方向的资产本就不触发 PIPL 出境条款，CBA-001 在任何路线下都禁止。
  · 可用样本估计：六层折损漏斗，N_eff 区间 **3 ~ 5,814 人**（中位 226），
    合规折损率 0.0015% ~ 0.58%。三档全部低于 S0.1 的 30,000。
  · 合规成本档：**高**（法务、技术、组织三项均高；评估结果有效期 3 年）。
  · 周期估计：法定时限 5 + 7 + 45 个工作日 ≈ 57 个工作日；端到端 6–12 个月为经验口径。
  同时把《促进和规范数据跨境流动规定》第 3–9 条逐字原文补入 legal_references.md。

why: |
  这一步本来只是三条路线推演的第一条，但算完漏斗后出现两个必须立刻记录的结果。

  其一，**可用样本三档全部不达标**，且瓶颈在结构性折损层：南向通投资者资格率 ×
  同时为香港行客户率，最乐观档也只有 2.4%。这意味着优化告知话术、提高同意率
  都改变不了量级——出路只有扩大人群定义、降低 MDE 要求，或者承认本命题在真实规模下
  不可验证、转为合成数据机制验证的交付形态。框架的 M0 升级条件是「三条路线均不达标 → 上报」，
  R-A 已不达标，R-B / R-C 的结构性折损层与本路线相同，大概率同样不达标。

  其二，把两条已确认的硬约束并置会得到一个此前没人算过的结论：
  S0.1 要求 N_eff ≥ 30,000 才可验证；《促进和规范数据跨境流动规定》第七条规定
  1 万人以上敏感个人信息必须申报安全评估；而 CBA-005 梯度已按敏感个人信息定性。
  三者相交 → **任何达到可验证规模的双向 L3 方案都必然落入最重的出境路径，
  R-B 与 R-C 在敏感口径下不可选**。这不是假设，是算术。
  唯一的技术出路是把 L3 改造成 hk → cn 单向流动，该建议已写入 M5 的 README。

