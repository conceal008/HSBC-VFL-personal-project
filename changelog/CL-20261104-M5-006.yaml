title: S5.M8 Orange 大版流失的真实 SGB 复核——两个方法与同配置代理之差都在 0.005 以内，SGB 上 I2 + I3 +0.0353 [+0.0222, +0.0483]
what: |
  方法筛选第四阶段（DR-M5-015）第 2 步，D-6 的前提（S5.M7 判定「逐位一致」）成立后做。
  - 输入：S5.M5 主分析的同一私有输入（Orange 大版流失，每方前 300 个编码列，fit 40,000 行、测试 10,000 行、正例 734）；配置全部取自 S5.M5 结果 JSON，不再调参。
  - 用主动方明文直方图版本（与原版逐位一致，只是更快）各拟合一次（seed 11）原版联邦 F_def（隐语默认、10 桶、初始分数 0.5）与优化版联邦 F_opt_p（选定配置、33 桶、先验初始分数）。
  - 与同配置代理比较、SGB 内部对比 F_opt_p − F_def，口径同 S5.M2（method_screen_sgb.evaluate，测试行 bootstrap 1,000 次）；「联邦 SGB − 内地单边代理」只作描述。
  - D-6 时长估算先写入运行输出；两个方法各一个后台段，打分分别存档，最后一段做对比。组件在仓库副本（会话临时目录）中启动，提交前核对与启动指纹逐字节相同。
  新增：
  - 组件 sgb_large_confirm 与单测、组件声明 M5-sgb_large_confirm；
  - 运行配置 configs/s5_m8_orange_large_sgb.yaml；
  - 带汇总输出的运行入口 notebook S5.M8_1（重拟合同配置代理、从存档打分重算 AUROC 与 bootstrap 对比并核对）；
  - 公开汇总 results/sgb_large_v1/；
  - DR-M5-015 复核段 review_20261104_s5m8。
  状态类字段同步：BC-M5-018（orange_large_sgb 完成）、step_ledger（追加 S5.M8，第四阶段 2 / 2 完成）、registry/module_status.yaml 的 M5 与 governance、
  M5 README、项目进度总览（notebook 78 → 79、带输出 50 → 51；组件声明 102 → 103）。
why: |
  Orange 大版是 17 个任务里唯一没有任何真实 SGB 证据的数据集（DR-M5-015 · D-6）。报告 v1.4 把它记为「单次 SGB 远超会话时限、未跑」；
  S5.M7 的预筛加明文直方图使每方 300 列的单次拟合进入单段时限。流失是三任务中正例最多、I2 + I3 增益最大的一个。
  结果（开发证据）：
  - SGB 与同配置代理：优化版联邦 0.7526 / 0.7545，差 −0.0019 [−0.0058, +0.0023]；原版联邦 0.7173 / 0.7186，差 −0.0013 [−0.0162, +0.0144]。两者都在 0.005 以内，代理结论不降级。
  - SGB 上 I2 + I3（F_opt_p − F_def）+0.0353 [+0.0222, +0.0483]，p < 0.001；S5.M5 代理（6 seed）+0.0359 [+0.0229, +0.0499]，几乎相同。
  - 只作描述：优化版联邦 SGB 比内地单边代理（6 seed，0.7133）高 0.039，原版联邦只高 0.004，与 S5.M5「不做 I2 + I3，联邦看不出增益」一致。
