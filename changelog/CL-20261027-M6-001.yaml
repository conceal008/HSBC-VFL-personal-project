title: S6.P4 G3 FedAds 补充冻结：用户哈希分组、频数编码、B_T2 不适用
what: |
  新增 modules/m6_evaluation/configs/s6_p4_fedads_addendum.yaml（status frozen，S6.P3 文件不改）与声明 S6.P4_FedAds补充冻结_声明.md；
  决策记录 DR-M6-002（四项取舍：用户单位与分组、训练规模、编码、各臂适配）；组件 modules/m5_modeling/components/g3_fedads.py
  （标准库筛选，可在本机运行；训练组编码）、单测 5 项、组件声明 M5-g3_fedads。
  状态类字段同步：M6 step_ledger（追加 S6.P4，5/9）、registry/module_status.yaml 的 M6、M5 与 governance、项目进度总览组件声明计数（93→94）。
why: |
  DR-GOV-017 · D-1 把第二组证据改为 FedAds，并要求在 S5.G3 接触评估标签之前由 M6 补充冻结。S6.P3 对 FedAds 的写法有三处无法执行：
  没有时间列可按时间划封存段；没有显式用户号；被动方没有自有标签。主动方十万级基数的标识类列，S6.P3 的编码没有规定。
  本步只补这些，其余全部继承 S6.P3，使两个数据集的结果可以并列阅读。
