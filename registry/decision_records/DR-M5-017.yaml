agent: Claude (claude-opus-5-5, Claude Code)
module: M5
status: active
supersedes: null
requested_by: conceal008（所有者 2026-11-07 15:04 回复「继续」；报告 v1.7 之后可在会话云端容器内完成的未做项是 M6 的其余 SGB 复核与 SGB 结论的多 seed）
related_step: S5.M11
related_change_id: null
preregistration: 本记录在 S5.M11 / S5.M12 做任何拟合之前写定；运行代码与配置的 sha256 在每段启动时另记于私有运行目录
amends: 无；DR-M5-012 ~ DR-M5-016 的结果不受影响

context: |
  所有者 2026-11-02 20:38 要求：论文与期刊里的优化方法放到全部数据集上，列出哪些有增益、哪些能组合，有未做的实验就立即开始；之后多次回复「继续」，并授权自主判断。
  第一 ~ 五阶段（DR-M5-012 ~ DR-M5-016）完成后，报告 v1.7 的两项推荐里：
  - I2 + I3 已有 17 个任务的真实 SGB 证据（15 / 17 成立），但每个（任务，方法）只拟合一次（seed 11）；
    17 个任务中 9 个的优化版联邦配置用列采样 0.7（UCI、Orange 升级、FedAds、Santander G3、IEEE 第 1 块、mock 重合 20 / 50、Orange 大版追加销售 / 偏好），
    训练随机性没有进入区间；AGENTS 第 9 条要求结论有 ≥ 5 个 seed。原版联邦（列、行采样都为 1）与其余 8 个任务的优化版联邦不含随机性，单次拟合即完整。
  - M6 bagging 在明文代理上 7 / 14 显著（Holm 后），真实 SGB 只复核了其中 3 个（FedAds 成立、mock 重合 80 刚好成立、COIL2000 不显著）；
    其余 4 个（mock 平衡、mock 重合 50、HomeCredit、Santander 交易）没有 SGB 证据。
  S5.M7 的主动方明文直方图（与原版逐位一致，S5.M9 的 24 次前 2 棵抽查全部一致）使这些拟合能在会话容器内分段完成。
  不在本阶段：M7（需本机双虚拟机，待所有者定）；M8 的 SGB 复核（代理上没有增益）；SS-XGB / G3 五臂扩数据集；Amex（暂停）；IEEE 全交集（缺切分文件）。

decisions:

  - key: D-1
    question: 授权与范围
    decision: |
      新开「方法筛选第六阶段」，预算 2 步：
      - S5.M11：M6 在 mock 平衡、mock 重合 50、HomeCredit、Santander 交易上的真实 SGB（D-2 ~ D-3）；
      - S5.M12：上述 9 个列采样任务的优化版联邦再拟合 5 个 seed，I2 + I3 的 SGB 结论改用 6 个 seed（D-4 ~ D-5）。
      不改 S5.M1 ~ S5.M10 的方法、配置与已提交结果。
    rationale: M6 是报告默认组合「I2 + I3 + M6」的第二层，SGB 证据只覆盖 3 / 7；I2 + I3 的 SGB 结论在含随机性的 9 个任务上只有单 seed。
    falsifier: 所有者表示「继续」不指这些 → 本阶段结果作废。

  - key: D-2
    question: S5.M11 的方法与配置
    decision: |
      - M6 = 6 个 SGB 成员的概率平均：配置取自 S5.M1 结果 JSON 的优化版联邦（central），行采样 0.8，33 桶，先验初始分数，
        成员 seed 1100 ~ 1105（method_screen_sgb.bag_seeds，与 S5.M2 / S5.M4 相同）；
      - 用主动方明文直方图版本拟合；每个任务第一个成员正式拟合前抽查前 2 棵原版与明文逐位相同（同 DR-M5-016 · D-3），
        并按明文前 2 / 4 棵外推单个成员的秒数，超过 7,000 秒的任务不做；
      - 成员逐个存档，分段运行（同 DR-M5-016 · D-4：一段内只在「已用 + 外推 × 1.1 ≤ 6,800 秒」时开始下一个成员）；
      - 对照：S5.M9 已拟合的优化版联邦 SGB 打分（同一输入、seed 11）。
    rationale: 与 S5.M2 / S5.M4 同一实现、同一口径，结果可直接并列。
    falsifier: 选择或配置读了测试集 → 该任务结果作废。

  - key: D-3
    question: S5.M11 的对比与判定
    decision: |
      口径同 S5.M2 / S5.M4（method_screen_sgb.evaluate）：测试客户簇 bootstrap 1,000 次（seed 20261102）。
      - SGB 上 M6 − 优化版联邦：配对差、区间与 p；区间不含 0 且为正 → 「M6 在 SGB 上成立」；
      - M6 的 SGB 与同配置代理（6 个成员的代理平均）之差，容差 0.005（DR-M5-012 · D-1）；
      - 合并 S5.M2 / S5.M4 的 3 个任务，报告 M6 在 7 个代理显著任务上的 SGB 成立数，并逐个与代理结论对照。
    rationale: 回答「M6 的代理增益在真实 SGB 上是否成立」。
    falsifier: 无（判定规则本身）。

  - key: D-4
    question: S5.M12 的任务、seed 与检查
    decision: |
      - 任务：优化版联邦配置列采样 < 1 的全部 9 个任务（按配置判定，不看结果）：UCI、Orange 升级、FedAds、Santander G3、IEEE 第 1 块、mock 重合 20 / 50、Orange 大版追加销售 / 偏好；
      - 已有 seed 11 的优化版联邦 SGB 打分（S5.M2 / S5.M9 存档）；再拟合 seed 22 / 33 / 44 / 55 / 66（方法筛选统一的 6 个 seed），其余设置不变；
      - 用主动方明文直方图版本；每个任务第一个新 seed 正式拟合前抽查前 2 棵原版与明文逐位相同；外推、上限与分段规则同 D-2；
      - 确定性核对：原版联邦（列、行采样都为 1）在 UCI 上用 seed 22 再拟合一次，测试打分须与 seed 11 逐位相同；不同则把原版联邦也按 6 个 seed 处理并如实记录。
    rationale: 按配置是否含随机性选任务，避免按结果挑选；原版联邦不含随机性，核对一次即可。
    falsifier: 选择或配置读了测试集 → 该任务结果作废。

  - key: D-5
    question: S5.M12 的对比与判定
    decision: |
      - I2 + I3（优化版联邦 − 原版联邦）的区间改用两层 bootstrap（测试客户簇 × seed，1,000 次，seed 20261102；method_screen.two_level_bootstrap，同 S5.M1 的代理口径），
        优化版联邦取 6 个 seed，原版联邦取单次拟合（D-4 核对确定后）；点估计为 6 个 seed 测试 AUROC 的平均减原版；
      - 另报告优化版联邦 SGB 测试 AUROC 的 6 seed 标准差，以及 seed 11 单次结论与 6 seed 结论是否一致；
      - 结论改写：17 个任务的 SGB 成立数按「列采样的 9 个用 6 seed、其余 8 个用单次拟合（不含随机性）」重算。
    rationale: 使 SGB 上的 I2 + I3 结论满足 AGENTS 第 9 条（种子 ≥ 5，带区间）。
    falsifier: 无（判定规则本身）。

  - key: D-6
    question: 结论如何进报告
    decision: |
      报告升版：M6 的 SGB 部分写 7 个代理显著任务上的成立数，逐个列出与代理不一致的任务；I2 + I3 的 SGB 部分改用 D-5 的口径，单 seed 与 6 seed 结论不同的任务逐个列出。
      同时改正 v1.7 缺口表中已过时的「Orange 流失的 SGB 复核：未跑」（S5.M9 已做）。不因 SGB 结果回头修改 S5.M1 的选择或配置。
    rationale: 只增加证据层级，不事后改选择。
    falsifier: 无。

  - key: D-7
    question: 边界
    decision: |
      - 明文直方图只在实验代码里替换一个方法，不改隐语源码；用于正式联调需在隐语上游或项目封装层实现并经安全评审（技术侧自评，未经法务复核，W-001）。
      - 耗时是会话容器上单进程两方模拟的合计计算时间，不代表本机双虚拟机或汇丰环境；公开数据上的开发证据，不代表汇丰效果，不换算成命中率或收益。
      - 只提交汇总；逐行打分只在会话临时目录与本机私有目录。运行期间会话内不跑门禁或其他重计算。
    rationale: 与 DR-M5-015 / DR-M5-016 一致。
    falsifier: 无（范围声明）。

falsifier: |
  本记录整体被推翻的条件：①运行代码在启动指纹之后因看过结果而修改却未另立版本；②任何选择读了测试集；③所有者表示「继续」不授权本阶段。

review_trigger: |
  S5.M11 完成时；S5.M12 完成时。

review_20261108_s5m11: |
  S5.M11 完成时复核（6 段，2026-11-07 15:11 – 11-08 00:50）：
  - D-2 推翻条件未触发：配置、分桶与初始分数全部取自 S5.M1 结果 JSON，对照为 S5.M9 存档的优化版联邦打分，测试集只用于最后评估一次；
    6 段启动指纹中组件、依赖组件、配置与本记录的 sha256 相同，运行中未改代码（本复核在全部运行结束后追加）。
  - 抽查：4 个任务第一个成员前的前 2 棵，原版与明文打分全部逐位相同；单个成员外推 524 ~ 2,705 秒，没有任务超过 7,000 秒上限。
  - 分段：外推与实际成员拟合秒数之比 0.90 ~ 1.13，没有拟合被后台上限终止；24 个成员合计拟合约 9.5 小时（Santander 交易 6 个成员约 4.4 小时）。
    运行期间未跑门禁或其他重计算（只在临时目录跑过 S5.M12 草稿的 5 个单测）。
  - D-3 结果（SGB 上 M6 − 优化版联邦，括号内为代理 6 seed）：
    mock 重合 50 +0.0097 [+0.0054, +0.0147]（+0.0065）；mock 平衡 +0.0046 [+0.0013, +0.0080]（+0.0065）；
    HomeCredit +0.0038 [+0.0023, +0.0056]（+0.0036）；Santander 交易 +0.0116 [+0.0081, +0.0152]（+0.0099）。
    4 个任务全部成立，与代理结论一致 4 / 4；M6 与优化版联邦的 SGB − 同配置代理都在 0.005 以内（−0.0012 ~ +0.0020）。
  - 合并 S5.M2（FedAds +0.0113 成立、COIL2000 +0.0027 不显著）与 S5.M4（mock 重合 80 +0.0036 成立）：
    M6 在 7 个代理显著任务中 6 个于真实 SGB 上成立，与代理结论一致 6 / 7，不一致的只有 COIL2000（代理 +0.008 成立，SGB 区间含 0）。
  - 单次拟合口径：M6 的 6 个成员各自带行采样随机性，对照（优化版联邦）为 seed 11 单次拟合；区间只含测试集抽样。
    本步 4 个任务中只有 mock 重合 50 的优化版联邦用列采样 0.7（其余 3 个为 1，拟合不含随机性）；mock 重合 50 对照的 6 seed 结果在 S5.M12 另报告。
  - 第六阶段 1 / 2 完成；S5.M12 随后按 D-4 先做原版联邦的确定性核对。
