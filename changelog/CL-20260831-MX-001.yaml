what: |
  记录所有者对六项跨模块口径问题的决策：
  D-1 纳入增益（uplift）评估；D-2 第二组口径取汇丰卓越理财跨境升级；
  D-3 基线转化率暂定 3.0% 待 M1 校准；D-4 业务最小可察差异取相对增益 20%；
  D-5 k-匿名的 k = 10 起步并做 {5,10,20} 敏感性；
  D-6 PSI 交集倾向不明文落地（秘密分享形态），正式判决仍在 S0.9。
  同步更新 M0 / M1 / M2 / M5 / M6 的未决问题。

why: |
  这六项分散在四个模块，但彼此耦合：D-1（纳入增益）是 S0.1 的最小可行规模 N_eff ≥ 30,000
  能否成立的前提；D-3 与 D-4 直接决定该数字的取值；D-5 决定 L1 基线的竞争力，
  而 L1 是 VFL 的真正竞争对手。散落在各模块的 open_questions 里无法看出这层耦合，
  因此集中成一份跨模块 DR，并逐条写下推翻条件——口径若不能被数据推翻，就只是习惯。

