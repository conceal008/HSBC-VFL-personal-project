context: S9.H1将旧根日志换为短导航，旧changelog自评的文件行号不再指向原证据；归档测试锁定原路径永不出现及M5末步恒为X3，导致合法恢复也会失败。
decision:
- 旧changelog/冻结结果不重写。11个旧路径恢复基线Git正文逐字前缀，仅尾部加只读镜像、规范路径及暂停提示，保留原行号/锚点/文本消费；docs中的规范版本仍为主入口，二者均为冻结历史版本而非双份当前日志。
- 新检查持续核对原文/规范文件/归档字节及旧证据行号；历史暂停快照与当前registry状态分开，当前仍暂停。
- 将来只有当前registry显式resumed_by_user且提供已登记授权DR引用才允许恢复分支。归档内部.pending仍不得出现可自动执行后缀；不把当前X3位置和原文件不存在写成永久不变量。
- 本地元数据与环境恢复缺口只补索引/依赖说明和确定性复核，不启动VM，不改原盘/原实验/旧清单。
- 恢复后再次暂停不删除有效代码；保留有效owner晋升记录/精确original路径范围及组件声明，暂停状态也可保留合法已晋升资产。两种状态都校验路径不越界。
preservation:
- 58c9e65及S9.H1原迁移清单保留为当时事实
- docs/04-experiment-records内11份规范正文与13份暂停草稿字节不改
- 原results/已用数学代码/配置/数据/身份/模型份额不改或迁移
falsifier: 旧证据行号原文仍错位、正文数值丢失、无授权可进入恢复分支、私有数据上传或实验自动启动，立即阻断发布。
