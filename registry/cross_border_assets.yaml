# ⚠️ 本文件当前**不含任何合规定性**。
# 每条的 is_personal_information / legal_basis / allowed_path 均为 pending，
# 由 S0.3（前四类）与 S0.4（后四类）填写。
# 定性状态说明（DR-GOV-008 + 豁免 W-001）：
#   本项目**不设合规角色**，`approved` 状态不存在。已定性的条目状态为
#   `self_assessed_no_legal_review`——技术方依公开法条自行判断，**未经法务复核**。
#   引用这些结论的任何对外材料必须带 W-001 的 mandatory_disclaimer。
#   代偿要求：每条须引用逐字法条原文、须写明不确定点、「可以跨境」一律取最严解释。

# 条目 schema（新增条目时逐字段填写，缺字段即视为未登记）
schema:
  id: "CBA-<三位序号>，一经分配永不复用"
  asset: "资产名称，与代码中的资产类型一一对应"
  category: "八类之一：raw_feature | id_hash | psi_intersection | intermediate_embedding | gradient | aggregate_statistic | model_parameter | score_or_list"
  is_personal_information: "true | false | case_by_case —— S0.3/S0.4 的定性结论"
  legal_basis:
    - "法条引用，每条资产 ≥1 条（PIPL 第 __ 条 / PDPO 第 __ 部）"
  allowed_path: "禁止 | 协议内 | 需论证 | 相对宽松"
  applicable_routes: "该资产在哪些合规路线下可用：R-A / R-B / R-C"
  protection_required: "该资产被允许流动时必须挂载的保护措施"
  notes: "定性理由与残余风险"
  status: "active | superseded"
  superseded_by: "若 status=superseded，指向替代条目 id"

# M0 的 S0.2 必须覆盖以下八类，一类不缺（覆盖率 8/8 是量化放行判据）：
#   1 原始特征值 · 2 标识符哈希 · 3 PSI 交集结果 · 4 中间层嵌入
#   5 梯度/加密梯度 · 6 聚合统计（k-匿名） · 7 模型参数 · 8 打分结果/名单
required_categories:
  - raw_feature
  - id_hash
  - psi_intersection
  - intermediate_embedding
  - gradient
  - aggregate_statistic
  - model_parameter
  - score_or_list

# ---------------------------------------------------------------------------
# 八类跨境对象（S0.2 产出）
# 口径基准：S0.1 的预测命题——主动方（有标签方）= 内地行，被动方 = 香港行；
# 场景为跨境理财通南向通合资格投资产品的首次申购预测。
# 方向记法：cn -> hk 指从内地侧流向香港侧。
# ---------------------------------------------------------------------------
assets:

  - id: CBA-001
    asset: 原始特征值
    category: raw_feature
    description: 任一方客户的明细特征值本身（账户余额、交易流水、持仓、行为埋点等）
    direction: bidirectional
    produced_by: 双方本地数据层（M4 特征工程的输入）
    frequency: 不适用（方案前提为不发生此项流动）
    volume_estimate: 不适用
    is_personal_information: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.3
    legal_basis:
      - "PIPL 第 4 条：个人信息是以电子或者其他方式记录的与已识别或者可识别的自然人有关的各种信息，不包括匿名化处理后的信息"
      - "PIPL 第 28 条：敏感个人信息……包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息"
      - "PDPO 第 2 条：香港侧对应概念为个人资料"
    sensitive_personal_information: true
    sensitive_basis: |
      本项目的原始特征值以账户余额、交易流水、持仓为主，直接对应第 28 条明列的「金融账户」。
      按最严解释，整体按敏感个人信息处理 → 须单独同意（第 29 条）+ 事前 PIPIA（第 55 条第（一）项）。
    allowed_path: 禁止
    applicable_routes: pending          # ← S0.5–S0.7 路线推演后填
    uncertainties:
      - "「金融账户」的射程是否覆盖交易流水与持仓（而非仅账号本身），条文未细化；已取最严解释"
      - "行为埋点类特征是否属敏感个人信息存疑；已按最严解释一并纳入"
    strictest_reading: 全部原始特征值按敏感个人信息处理，任何路线下均禁止跨境
    status: active
    notes: |
      列此项不是因为方案打算传输它，而是因为清单必须能回答"它有没有跨境"——
      答案是"没有"才构成方案前提，而前提也需要登记与核验（门禁 4 的核验 4 依赖它）。

  - id: CBA-002
    asset: 标识符哈希
    category: id_hash
    description: 用于隐私集合求交（PSI）的标识符派生值（手机号 / 证件号 / 姓名等的哈希或加盲值）
    direction: bidirectional
    produced_by: M3 实体对齐组件（PSI 协议输入）
    frequency: 每次求交
    volume_estimate: 待测（随 PSI 协议选型变化）
    is_personal_information: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.3
    legal_basis:
      - "PIPL 第 73 条第（三）项：去标识化，是指个人信息经过处理，使其在不借助额外信息的情况下无法识别特定自然人的过程"
      - "PIPL 第 73 条第（四）项：匿名化，是指个人信息经过处理无法识别特定自然人且不能复原的过程"
      - "PIPL 第 4 条：不属于个人信息的排除范围**仅限匿名化**处理后的信息"
    reasoning: |
      标识符哈希属**去标识化**而非匿名化：单独哈希可被字典攻击复原（标识符空间有限、
      格式固定），不满足第 73 条第（四）项「不能复原」的要件。
      按第 4 条，只有匿名化后的信息才被排除在个人信息之外，因此哈希值**仍是个人信息**。
    allowed_path: 协议内
    applicable_routes: pending
    uncertainties:
      - "加盐或加盲后的值能否主张匿名化？取最严解释：不主张——盐值本身即「额外信息」，双方共享盐则可复原"
      - "PSI 协议内的中间消息（非最终交集）是否单独构成个人信息，需 M3 按具体协议逐一判定"
    strictest_reading: 哈希值按个人信息处理；只允许在 PSI 协议内部使用，不得以任何形式明文交换或落地
    status: active
    notes: |
      跨境标识体系不同（内地手机号 / 身份证 vs 香港身份证号 / 护照 / 境外号码），
      精确匹配覆盖率必然偏低，模糊匹配会引入假匹配——这属 M3 的一等实验变量。
      单独哈希可被字典攻击，这一点在定性时不可回避。

  - id: CBA-003
    asset: PSI 交集结果
    category: psi_intersection
    description: 双方标识符的交集（共同客户名单），及其在周期性重跑之间的差分
    direction: bidirectional
    produced_by: M3 实体对齐组件
    frequency: 每个营销周期（生产形态为离线周期性重跑）
    volume_estimate: 待测（等于 N_eff 量级，S0.1 给出下界 30,000）
    is_personal_information: true
    newly_generated: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.3
    legal_basis:
      - "PIPL 第 4 条：与已识别或者可识别的自然人有关的各种信息——「某自然人同时为两行客户」即属此类"
      - "PIPL 第 23 条：向其他个人信息处理者提供其处理的个人信息的，应当……取得个人的单独同意"
      - "PIPL 第 39 条：向境外提供个人信息的，应当……取得个人的单独同意"
      - "PDPO 保障资料原则 3（附表 1）：不得用于收集时述明目的以外的新目的，除非取得明示同意"
    reasoning: |
      交集结果不是既有信息的搬运，而是**新产生的个人信息**：
      「此人同时是内地行与香港行客户」这一事实，在求交之前任何一方都不掌握。
      它与可识别自然人有关，落入第 4 条定义。
    allowed_path: 需论证
    applicable_routes: pending
    uncertainties:
      - "以秘密分享份额形式存在的交集，单个份额是否仍构成个人信息？取最严解释：仍按个人信息处理"
      - "周期性重跑产生的**交集差分**（本期新增共同客户）是否构成独立的个人信息处理活动？倾向是，须 M7 量化其泄露面后在 S0.4 复核"
      - "PDPO 第 33 条（跨境转移）尚未生效，香港侧的跨境转移依据须按 PCPD 指引尽职，具体要求待查证"
    strictest_reading: 交集与其差分均按个人信息处理；倾向不明文落地（DR-MX-001 · D-6），正式判决在 S0.9
    status: active
    notes: |
      两点在定性时不可回避：①交集是**新产生的个人信息**，不是既有信息的搬运；
      ②周期性重跑使"第 t 期与第 t+1 期交集之差 = 本期新增共同客户"成为真实泄露面，
      属本场景特有（M7 攻击清单第 5 条）。是否明文落地由 S0.9 判决（决策点 4）。

  - id: CBA-004
    asset: 中间层嵌入
    category: intermediate_embedding
    description: 被动方（香港行）本地编码器输出、传给主动方的中间层表示
    direction: hk -> cn
    produced_by: M5 的 L3 路线（分割学习 SplitNN 等）
    frequency: 每批次（训练）/ 每次打分（推理）
    volume_estimate: 待测（随表示维度与批大小变化）
    is_personal_information: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.3
    legal_basis:
      - "PIPL 第 4 条：与已识别或者可识别的自然人有关的各种信息"
      - "PIPL 第 73 条第（四）项：匿名化须「不能复原」——嵌入可被反演重构，不满足该要件"
      - "PDPO 保障资料原则 3（附表 1）：香港侧将客户资料用于跨境联合建模属新目的，须取得明示同意"
      - "PDPO 第 35C、35E 条：若该建模服务于直接促销，使用前须告知并取得同意"
    reasoning: |
      嵌入由个人特征逐样本计算得到，与可识别自然人一一对应；且已有文献表明可通过反演攻击
      重构原始特征（M7 攻击清单第 2 条）。在不能证明「不能复原」之前，不满足匿名化要件，
      因此按个人信息处理。
    direction_note: |
      **本条的流向方向决定适用哪套法规，这一点极易搞错**：
      CBA-004 是 hk → cn，即香港侧向内地提供。
      · 对内地侧：这是**接收**境外个人信息，**不触发** PIPL 第 38/39 条
        （该两条管的是「向中华人民共和国境外提供」）；但内地接收后的处理仍须有
        PIPL 第 13 条的合法性基础，营销目的下只能是同意。
      · 对香港侧：属把个人资料转移出香港，受 PDPO 约束（DPP 3 新目的须明示同意；
        第 33 条跨境转移条文尚未生效，按 PCPD 指引尽职）。
      反向的 CBA-005（梯度，cn → hk）才触发 PIPL 第 38/39 条的出境三路径与单独同意——
      两者不可混为一谈。
    allowed_path: 需论证
    applicable_routes: pending
    uncertainties:
      - "加噪或降维后的嵌入能否主张不可复原？取最严解释：不主张，除非 M7 给出量化的反演失败率证据"
      - "PDPO 第 33 条未生效期间，香港侧跨境转移的合规依据强度存疑，须查证 PCPD 现行指引"
      - "若建模不直接服务于促销（仅产出分数、由内地侧决定是否触达），是否仍落入 PDPO 第 VIA 部？须 S0.4 结合 CBA-008 一并判定"
    strictest_reading: 嵌入按个人信息处理，必须扰动且必须论证出境依据；不因「不是原始数据」而放宽
    status: active
    notes: 可被反演重构原始特征（M7 攻击清单第 2 条），定性时须考虑扰动后的残余风险。

  - id: CBA-005
    asset: 梯度（含加密梯度）
    category: gradient
    description: 主动方（内地行）回传给被动方、用于更新其本地编码器的梯度
    direction: cn -> hk
    produced_by: M5 的 L3 路线
    frequency: 每批次
    volume_estimate: 待测
    is_personal_information: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.4
    legal_basis:
      - "PIPL 第 4 条：与已识别或者可识别的自然人有关的各种信息"
      - "PIPL 第 28 条：敏感个人信息……包括……金融账户……"
      - "PIPL 第 38 条：确需向中华人民共和国境外提供个人信息的，应当具备下列条件之一：（一）安全评估；（二）个人信息保护认证；（三）标准合同；（四）其他条件"
      - "PIPL 第 39 条：向境外提供个人信息的，应当……取得个人的单独同意"
      - "PIPL 第 55 条第（四）项：向境外提供个人信息……应当事前进行个人信息保护影响评估"
    sensitive_personal_information: true
    sensitive_basis: |
      梯度承载标签信息（明文梯度可高准确率恢复标签，M7 攻击清单第 1 条）。
      本项目的标签是「是否首次成功申购投资产品」，直接关联金融账户活动，
      按最严解释随标签一并作敏感个人信息处理。
    direction_note: |
      **本条是八类中首个真正触发 PIPL 出境条款的资产。**
      CBA-005 是 cn → hk，属「向中华人民共和国境外提供个人信息」：
      · 必须走第 38 条三条路径之一（安全评估 / 保护认证 / 标准合同）；
      · 必须按第 39 条告知境外接收方信息并取得**单独同意**；
      · 必须按第 55 条第（四）项事前完成个人信息保护影响评估。
      与 CBA-004（hk → cn，对内地是接收）的义务完全不对称——
      L3 路线的合规成本主要压在这一条上，而不是嵌入前传。
    allowed_path: 需论证
    applicable_routes: pending
    uncertainties:
      - "同态加密后的梯度是否仍属个人信息？取最严解释：是——密文可被持钥方解密，与第 73 条第（四）项「不能复原」的要件相悖"
      - "境外方仅接收密文且不持有密钥的情形，是否仍构成「向境外提供」？条文未细化；取最严解释：构成"
      - "若采用差分隐私加噪，ε 小到何种程度可主张匿名化？无法一般性判定，须 M7 给出量化证据后单独论证"
    strictest_reading: 梯度（含密文）按敏感个人信息处理，必须同时满足第 38 条路径 + 第 39 条单独同意 + 第 55 条 PIPIA
    status: active
    notes: |
      明文梯度可推标签——本项目历史阶段已实测到无防护时标签恢复接近完全成功。
      本场景的标签是"是否申购投资产品"，属金融信息，定性时须按此考虑。

  - id: CBA-006
    asset: 聚合统计（k-匿名）
    category: aggregate_statistic
    description: 被动方按分组输出的聚合量（计数 / 均值 / 分布），满足 k-匿名性后跨境
    direction: hk -> cn
    produced_by: M5 的 L1 基线（本地模型 + 对方 k-匿名聚合统计）
    frequency: 每个训练周期
    volume_estimate: 小（分组数量级）
    is_personal_information: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.4
    legal_basis:
      - "PIPL 第 73 条第（三）项：去标识化……在不借助额外信息的情况下无法识别特定自然人"
      - "PIPL 第 73 条第（四）项：匿名化……无法识别特定自然人且不能复原"
      - "PIPL 第 4 条：不属于个人信息的排除范围仅限匿名化处理后的信息"
      - "PDPO 保障资料原则 3（附表 1）：不得用于收集时述明目的以外的新目的，除非取得明示同意"
    reasoning: |
      k-匿名聚合统计满足第 73 条第（三）项的**去标识化**（在不借助额外信息时无法识别特定自然人），
      但**不当然满足**第（四）项的匿名化——匿名化要求「不能复原」，
      而 k-匿名对属性推断攻击与多源组合攻击的防护是有限的（学界共识）。
      按第 4 条，只有匿名化后的信息才被排除在个人信息之外。
      因此在给出「不能复原」的量化论证之前，**按个人信息处理**。
    project_impact: |
      ⚠️ **这条定性对项目核心结论的影响最大，须重点标记。**
      L1 基线（本地模型 + 对方 k-匿名聚合统计）此前被假定为「低一个数量级的合规成本」，
      而 L1 正是 VFL 的真正竞争对手（框架 M5）。
      若 CBA-006 同样按个人信息处理，L1 的合规成本**并不比 L3 低一个数量级**——
      两者的差距要小得多，「VFL 是否划算」的答案可能因此改变。
      M5 在比较 L1 与 L3 时必须把这条计入合规成本，不得沿用旧假设。
    allowed_path: 需论证
    applicable_routes: pending
    uncertainties:
      - "k 取多少可主张匿名化？无一般性阈值；本项目 k = 10 起步并做 {5,10,20} 敏感性（DR-MX-001 · D-5）"
      - "分组维度过细时的重识别风险随维度指数上升，须 M4 在特征分组时一并评估"
      - "多期聚合统计的**差分**是否构成新的泄露面？与 CBA-003 的周期差分同源，须 M7 量化"
      - "若能论证匿名化成立，本条可转为 is_personal_information: false——但须 M7 量化证据 + 复核，不得默认"
    strictest_reading: 在给出匿名化的量化论证前，k-匿名聚合统计按个人信息处理；L1 的合规成本不得按「显著低于 L3」估计
    status: active
    notes: |
      这是 L1 基线的基础，而 L1 是 VFL 的**真正竞争对手**（框架 M5）。
      若此项定性为非个人信息且合规成本显著低于 L3，整个方案的结论可能改变——
      因此它的定性对项目结论的影响不亚于梯度与嵌入。k 值由 M0 定义。

  - id: CBA-007
    asset: 模型参数
    category: model_parameter
    description: 训练产出的模型权重与超参（含被动方本地编码器参数）
    direction: bidirectional
    produced_by: M5
    frequency: 每次训练完成
    volume_estimate: 待测
    is_personal_information: case_by_case
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.4
    legal_basis:
      - "PIPL 第 4 条：个人信息是……与已识别或者可识别的自然人有关的各种信息——模型参数并非对个人的直接记录"
      - "PIPL 第 73 条第（四）项：匿名化要求「不能复原」——若模型记忆训练样本，则可部分复原"
    reasoning: |
      模型参数本身不是对特定自然人的记录，一般不落入第 4 条定义。
      但若模型记忆了训练样本（表现为成员推断攻击成功率显著高于随机），
      则参数集实际承载了「某人是否在训练集中」这一与可识别自然人有关的信息。
      因此定性取决于 M7 的成员推断实验结论，本步给出 case_by_case 而非一刀切。
    allowed_path: 需论证
    conditional_relaxation: |
      若 M7 实测成员推断成功率与随机猜测无显著差异（95% CI 覆盖 0.5），
      本条可放宽为 allowed_path: 相对宽松、is_personal_information: false。
      **在该实验完成前不得按放宽处理**——这是取严解释的直接要求。
    applicable_routes: pending
    uncertainties:
      - "成员推断成功率的可接受阈值未定，须 M7 在 S7.1 定义威胁模型时一并给出"
      - "被动方本地编码器参数是否比联合模型参数更易记忆？两者可能需要分别定性"
      - "若采用差分隐私训练，参数的定性是否随之改变？须结合 ε 的取值单独论证"
    strictest_reading: 在 M7 给出成员推断实验结论前，模型参数按「需论证」处理，不得明文跨境交换
    status: active
    notes: 一般不视为个人信息，但可能记忆训练样本；定性须与 M7 的成员推断实验结论对齐。

  - id: CBA-008
    asset: 打分结果与营销名单
    category: score_or_list
    description: 联合打分输出的分数、分层与最终下发营销执行系统的名单
    direction: 联合产生后交付主动方（内地行）营销执行系统
    produced_by: M8 的离线周期性联合打分链路
    frequency: 每个营销周期
    volume_estimate: 待测（Top-K，K 取业务真实触达规模）
    is_personal_information: true
    qualification_status: self_assessed_no_legal_review
    qualification_step: S0.4
    legal_basis:
      - "PIPL 第 4 条：与已识别或者可识别的自然人有关的各种信息——分数与名单均与特定自然人绑定"
      - "PIPL 第 24 条：利用个人信息进行自动化决策，应当保证决策的透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇"
      - "PIPL 第 55 条第（二）项：利用个人信息进行自动化决策……应当事前进行个人信息保护影响评估"
      - "PDPO 第 35C、35E 条：使用个人资料作直接促销前须告知并取得同意"
      - "PDPO 第 35K 条：将个人资料提供予他人以供其用于直接促销，须取得资料当事人的书面同意"
    reasoning: |
      分数与名单与特定自然人一一绑定，落入第 4 条定义，这一点无争议。
      两个容易被忽略的点：
      ① 联合打分构成**自动化决策**，触发第 24 条与第 55 条第（二）项；
      ② 名单虽在内地产生、在内地使用（**不构成出境**），但它是由含香港侧信息的模型产生的
         **下游产物**——若上游 CBA-004 / CBA-006 的跨境合规性不成立，名单的合法性基础同样有瑕疵。
         条文未直接规定下游产物的定性，本步取最严解释：名单的合法性以上游流动合规为前提。
    allowed_path: 需论证
    applicable_routes: pending
    uncertainties:
      - "营销打分是否属第 24 条意义上「对个人权益有重大影响的决定」？它决定是否被触达，而非拒绝服务；条文第 24 条其余款项原文尚未查证（legal_references.md 第五节待补），本步不引用"
      - "名单作为「境外信息的下游产物」的定性无直接条文支撑，本步为取严推断，须在 M9 一致性核验时重点复核"
      - "若建模仅产出分数、由内地侧独立决定是否触达，香港侧是否仍落入 PDPO 第 VIA 部？须结合 CBA-004 的用途一并判定"
      - "反推攻击（从下发名单反推模型与特征，M7 攻击清单第 6 条）的可行性未评估，可能影响名单的对外交付方式"
    strictest_reading: 名单按个人信息处理，且其合法性以上游 CBA-004/006 的跨境合规成立为前提；须做 PIPIA
    status: active
    notes: |
      最容易被忽略的一类：分数与名单仍是个人信息，其流转需单独论证（框架判断三）。
      且可被反推模型与特征（M7 攻击清单第 6 条）。
      本项目主动方在内地、名单在内地使用，但名单由含香港侧信息的模型产生——
      它是不是"个人信息出境"的下游产物，是 S0.3/S0.4 必须回答的问题。
