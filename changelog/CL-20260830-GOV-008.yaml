what: |
  建立 registry/glossary.yaml（权威术语表，首批 31 条），在《项目维护约束 v2》新增第 13 部分
  「术语与表达规范」（术语使用规则 T1–T7、表达规范 E1–E8），并修正现存文档中八类会造成误解的表述。

why: |
  本项目的读者包括法务与合规、需求方与评审。同一概念多种说法只是别扭，
  但用非法定术语指代法定概念会让合规论证失去依据：框架 v2 原文用「假名化」（GDPR 用语）
  指代 PIPL 第 73 条的「去标识化」，法务复核时无法对应到任何中国法条；
  「PDPO 第 6A 部」的官方条文编号是「第 VIA 部」；内地「个人信息」与香港「个人资料」
  是两个法域的两个法定概念，混用会直接影响 M0 的跨境对象定性与 M9 的一致性核验。
  这些不是文字工作，是合规论证能否成立的前提。

