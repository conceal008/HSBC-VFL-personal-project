dr_id: DR-GOV-009
title: 采用初版冲刺模式，四项标准降级并明确不降级的红线
date: 2026-09-03T18:00:00+08:00
requested_by: conceal008
approved_by: conceal008（仓库所有者）
agent: Claude (Opus 5, Claude Code)
module: GOV
status: active
related_change_id: CL-20260903-GOV-019
related_step: S-GOV.10

context: |
  所有者指示：「请你自己完成后续所有内容……目标是完成一个初版内容，
  如果相关标准导致做不了的就进行标准降级，但要进行相关说明。
  重点是数据集和算法流程，多尝试一些算法或者框架。」

decisions:
  - key: what_downgrades
    decision: |
      降级四项（详见 W-002）：一步一提交 → 一模块一提交；多路线分支卡 → 合并记录；
      M1 六维评估 → 待数据到位；M8/M9 实体交付 → 文档级设计。
    rationale: 四项的共同点是「依赖当前不存在的外部条件」（数据、框架、部署环境、法务角色）。

  - key: what_never_downgrades
    decision: |
      **不降级的四条红线**：
      ① 统计严谨性——≥5 种子、主指标带置信区间、不报虚假精度；
      ② 0.7 反指标操纵红线七条（尤其：不在测试集上选分支、合成数据不外推真实业务、
         响应率不得表述为增量）；
      ③ 数据分级与门禁 1/2/4/6 全部保持生效；
      ④ L1 基线必须与 L3 同等认真实现——**这是本项目最核心的对照，弱化 L1 等于伪造结论**。
    rationale: |
      降级的是「做不到的外部条件」，不是「结论的可信度」。
      前者影响进度，后者影响这个项目还有没有意义。

  - key: neural_network_conflict
    decision: |
      「不引入神经网络」的口径冲突（见 `项目目标与要求.md` 第 16 节）**不由技术侧裁定**。
      本初版的处理方式是：**两条路线都实现并分别报告**——
      树模型（纵向 GBDT，符合 7/29 决议）与神经网络（SplitNN，符合 v2 框架），
      让裁定者拿着两组实测数据做决定，而不是先猜一个答案再补证据。
    rationale: |
      在缺乏裁定的情况下，任选一条都会浪费另一条的信息价值；
      两条都做的边际成本远低于日后返工。

falsifier: |
  ① 若初版实验出现「L3 大幅优于 L1」且差距主要来自 L1 实现薄弱 → 本降级的补偿控制失效，须重做 L1；
  ② 若自实现算法与集中式上界（L4）差距异常（如联邦逻辑回归显著劣于集中式逻辑回归）
     → 实现有错，全部结论作废；
  ③ 若任何一份初版产出未带 mandatory_disclaimer 就被对外引用 → 降级机制失效。

review_trigger: |
  ①三个 P0 数据集到位时；②引入任何第三方 FL 框架时；③需求方裁定神经网络禁令时。

consequences:
  - "M1–M9 以「初版」形态推进，每份产出标注降级范围"
  - "所有实验结论只能作机制层判断，不得外推真实业务"
  - "M8/M9 停留在文档级，不得标记为完成"
