name: gates

# 《项目维护约束 v2》第 8 部分 · CI 门禁（按成本从低到高，前面失败不跑后面）
#
# 已生效：门禁 1（数据合规扫描）· 门禁 4（合规一致性核验）· 门禁 2（步骤元数据 + changelog schema）
#         门禁 6（可复现性：魔数 / 种子 / 环境锁 / notebook N1·N2·N4·N5）
#         另有门禁回归测试 ci/tests/run_gate_tests.sh（17 组用例），每次 push 都验证"门禁真的拦得住"
# 待实现：
#   门禁 5  代码质量（lint / 类型 / 单测覆盖 ≥70%）—— 待第一份代码组件出现
#   门禁 7  端到端冒烟 —— 待主链路出现
#   门禁 3  已取消（2026-08-30，DR-GOV-003），编号保留不复用
#   门禁 6  ci/check_reproducibility.py
#   门禁 5  lint / 类型检查 / 单元测试（等到有第一份代码组件时接入）
#   门禁 7  端到端冒烟（合并到 main 时跑，等到有主链路时接入）
# 在上述脚本上线前，对应门禁由人工在 PR 自查表中执行，见 .github/pull_request_template.md。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate1-data-compliance:
    name: 门禁 1 · 数据合规扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 运行数据合规扫描
        run: bash ci/check_secrets.sh

  gate4-cross-border-consistency:
    name: 门禁 4 · 合规一致性核验
    runs-on: ubuntu-latest
    needs: gate1-data-compliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install --quiet pyyaml
      - name: 运行合规一致性核验（7.2 六项）
        run: python3 ci/check_cross_border_consistency.py

  gate2-step-metadata:
    name: 门禁 2 · 步骤与元数据完整性
    runs-on: ubuntu-latest
    needs: gate4-cross-border-consistency
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 需要真实提交历史，PR 时要能取到 head sha
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install --quiet pyyaml
      - name: 校验提交 trailer 与 changelog step 段
        env:
          REV: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/check_step_metadata.py --rev "$REV"
      - name: changelog schema 校验（全部条目）
        run: python3 ci/check_changelog_schema.py

  gate6-reproducibility:
    name: 门禁 6 · 可复现性
    runs-on: ubuntu-latest
    needs: gate2-step-metadata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install --quiet pyyaml
      - name: 检查魔数 / 种子 / 环境锁 / notebook 规范
        run: python3 ci/check_reproducibility.py

  gate-regression:
    name: 门禁回归测试 · 拦截能力
    runs-on: ubuntu-latest
    needs: gate6-reproducibility
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install --quiet pyyaml
      - name: 跑全部门禁用例（12 组）
        run: bash ci/tests/run_gate_tests.sh
