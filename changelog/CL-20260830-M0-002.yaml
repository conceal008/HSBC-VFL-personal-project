what: |
  在 registry/cross_border_assets.yaml 中列出八类跨境对象骨架：
  CBA-001 原始特征值 · CBA-002 标识符哈希 · CBA-003 PSI 交集结果（含周期差分）·
  CBA-004 中间层嵌入 · CBA-005 梯度（含加密梯度）· CBA-006 聚合统计（k-匿名）·
  CBA-007 模型参数 · CBA-008 打分结果与营销名单。
  每条给出方向、产出环节、频次、量级待测项与定性时不可回避的要点，
  **定性字段一律 pending**。文件状态由 empty_template 转为 populating。
  同时产出 DR-GOV-007：合规角色缺位期间，区分「起草」与「批准」的代行安排。

why: |
  清单是原则三（说的和做的可机器核验）的基准物：门禁 4 的六项核验全部以它为准，
  此前它是空模板，六项核验无对象可核，等于没有生效。八类就位后，
  任何组件声明一旦引用不存在的资产、或声明的类型与清单不符，合并前即被阻断。
  本步严格「只列不定性」：定性直接决定哪些信息流被允许，是实质合规判断，
  与「有哪些东西可能跨境」是两个不同的问题，混在一步里做会让两者都做不扎实。
  CBA-001 明明是方案前提为「不流动」的一项，仍然列入——因为清单必须能回答
  「它有没有跨境」，前提也需要被登记与核验。

