title: S5.G2 G3 臂 A_secure（SS-XGB）到 6 小时上限时 141 棵，同棵数精度与明文无可分辨差异
what: |
  按冻结的 S6.P3 在 Santander 上训练 A_secure（隐语 SS-XGB，训练全程秘密分享，配置与 A 相同、不调参）。
  新增决策记录 DR-M5-010（运行方式、分段续训、上限计时口径、运行间波动）；组件 modules/m5_modeling/components/g3_ssxgb.py
  （两个本机进程各代表一方、逐棵存档、续训回放、成本记录）与单测 9 项（含替身 SecretFlow 编排检验）、组件声明 M5-g3_ssxgb；
  运行配置 configs/s5_g2_ssxgb_run.yaml；两个带汇总输出的运行入口 notebook（训练记录、续训核对与打分；精度与成本）；
  公开汇总 results/g3_santander_ssxgb_v1/（各臂指标、描述性对比、成本、运行摘要与适用边界说明）。
  状态类字段同步：M5 README（状态、当前结论、下一步、S5.G2 一节）、step_ledger（追加 S5.G2，G3 阶段预算 4/4、阶段完成）、
  BC-M5-017（安全档路线 exceeded_compute_cap）、registry/module_status.yaml 的 M5、M0（S0.9 输入）与 governance、
  项目进度总览 notebook 与组件声明计数（66→68、94→95）。
why: |
  S6.P3 的 H4：全程秘密分享训练的精度与成本（A_secure − A，只在 Santander，次要对比）。业务侧安全底线问题（Q2）需要知道：
  不接受 SecureBoost 类训练期泄漏时，安全档会损失多少精度、要付多少计算与通信。
  结果：150 棵按均值约 6.35 小时，超过预注册单次拟合上限 6 小时；按 DR-M5-010 · D-3 训到 141 棵（5.97 小时）停止，A_secure 记为未完成，
  预注册对比不报告。描述性比较（开发评估集 20,351 位客户、586 个正例）：
  A_secure − 同棵数明文集中式 L4_T = −0.001 [−0.004, 0.002]（可检出差异 0.006）；A_secure − A = +0.000 [−0.002, 0.003]；
  A_secure − L1_k10 = +0.043 [0.033, 0.054]。成本：每棵树约 152 秒（SGB 约 22 秒，约 6.9 倍，运行方式不同）、两方合计通信约 32 GiB、
  每个进程峰值内存约 3.3 GB。
