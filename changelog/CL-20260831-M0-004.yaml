what: |
  对前四类跨境对象作出定性，状态一律 self_assessed_no_legal_review：
  · CBA-001 原始特征值 → 是个人信息，且按最严解释整体作**敏感个人信息**（第 28 条明列「金融账户」），
    allowed_path = 禁止
  · CBA-002 标识符哈希 → 是个人信息。属第 73 条第（三）项的**去标识化**而非第（四）项的匿名化
    （单独哈希可被字典攻击复原，不满足「不能复原」要件），而第 4 条的排除范围仅限匿名化。
    allowed_path = 协议内
  · CBA-003 PSI 交集结果 → 是个人信息，且是**新产生的**：「此人同时是两行客户」在求交前任何一方都不掌握。
    allowed_path = 需论证
  · CBA-004 中间层嵌入 → 是个人信息（可被反演重构，不满足「不能复原」）。
    allowed_path = 需论证 + 必须扰动
  四条各附逐字法条原文、不确定点与取严说明。applicable_routes 保持 pending，待 S0.5–S0.7 推演后填。

why: |
  这四类是信息流设计的地基：CBA-001 的定性决定方案前提是否成立，
  CBA-002 决定 PSI 协议的选型空间，CBA-003 决定交集能否明文落地，
  CBA-004 决定 L3 路线是否可行。含糊过去，M3–M5 的全部设计都会建在流沙上。

  本步依豁免 W-001 绕开的是「必须由合规角色批准」这一条；
  **没有绕开**的是 W-001 的四条代偿：引用逐字法条原文、写明不确定点、
  存疑处取最严解释、对外材料带免责表述。三条已在本步执行，第四条约束后续材料。

key_finding: |
  **流向方向决定适用哪套法规**，此前文档一律笼统称「跨境」，掩盖了两侧义务的不对称：
  · CBA-004（hk → cn）：对内地是**接收**境外个人信息，**不触发** PIPL 第 38/39 条
    （该两条管的是「向中华人民共和国境外提供」）；内地接收后的处理仍须有第 13 条的合法性基础。
    对香港侧则是把个人资料转移出香港，受 DPP 3 与（尚未生效的）PDPO 第 33 条约束。
  · CBA-005（cn → hk）：才触发 PIPL 第 38 条出境三路径与第 39 条单独同意。
  两者的合规成本、举证责任与失败模式完全不同，不可合并处理。

