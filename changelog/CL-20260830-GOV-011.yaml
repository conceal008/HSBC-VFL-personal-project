what: |
  实现《项目维护约束 v2》第 9 部分与 9.1 的机器检查：
  R1 硬编码魔数（AST 扫描 .py 与 notebook 代码 cell）· R2 种子必须来自配置 ·
  R3 requirements 与 lock 文件一致 · R4 notebook 命名符合 N1 ·
  R5 首个代码 cell 打印运行指纹（config / seed / git）· R6 execution_count 单调且无未执行 cell。
  同时把回归套件从 12 组扩到 17 组，新增 gate6 job 并让回归 job 依赖它。

why: |
  9.1 的六条纪律里，N1（命名）、N4（运行指纹）、N5（执行顺序）本来就是可判定的，
  却一直只写在 PR 自查表里靠自觉；而「硬编码魔数 = 0」写进规范已久，从未有过判定方式——
  没有判定方式的判据等于没有判据。
  notebook 尤其需要这道门禁：它天然鼓励把参数写死在 cell 里、乱序执行到跑通为止，
  而这两件事恰好是可复现性最先失守的地方。趁 modules/ 下还没有任何 .py 与 .ipynb 先上线，
  等 M0 开始产出时它自动生效，不用回头返工。

