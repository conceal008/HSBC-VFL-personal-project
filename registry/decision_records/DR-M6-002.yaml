agent: Claude (claude-opus-5-5, Claude Code)
requested_by: conceal008（所有者 2026-10-26 指示「继续恢复实验，你根据最终目的自主判断上述决策」，2026-10-27「继续」；DR-GOV-016、DR-GOV-017）
module: M6
status: active
supersedes: null
related_step: S6.P4
related_change_id: CL-20261027-M6-001
preregistration: modules/m6_evaluation/configs/s6_p4_fedads_addendum.yaml

context: |
  DR-GOV-017 · D-1 把第二组证据由 HSBC mock 改为 FedAds（官方纵向切分），并要求在 S5.G3 接触评估标签之前由 M6 补充冻结。
  S6.P3 对 FedAds 只写了「官方自然切分、按用户、封存段为按时间最晚的一段」。核对本机文件后有三处无法照写执行：
  没有时间列；没有显式用户号；被动方没有自有标签。另外主动方有 10 万级基数的标识类列，S6.P3 的编码对它没有规定。
  本机文件指纹已核对：两个 ZIP 与 8-9月/数据集/MANIFEST.sha256 一致，展开的 CSV 与 ZIP 内文件 CRC32 一致（DR-GOV-017 · D-3 推翻条件未触发）。

decisions:

  - key: D-1
    question: 用户单位、分组与封存段
    decision: |
      以 l_u_fea_1 为用户号（训练文件前 20 万行中约 18.7 万个不同值）。用户号加盐 SHA-256 分 10000 桶（盐 G3-FEDADS-2026）：
      训练文件取桶 [0, 580) 为训练、[580, 810) 为内层验证；测试文件取桶 [2000, 2535) 为开发评估、[5000, 5535) 为封存段（本步不抽取）。
      全部组的桶区间互不重叠，四组用户两两不相交。开发评估与封存段的桶数按训练文件正例率（0.5923%）与测试文件每桶行数（243.2）
      一次算出 535，目标 700 个正例行、安全系数 1.1（与 S6.P3 同一规则，g3_santander.eval_buckets_needed）。
    rationale: 没有时间列，按时间划封存段做不到；用户哈希分桶在看标签之前即可确定，且保证开发评估与封存段互为同分布、与训练用户不相交。
    falsifier: 筛选结果中任一组用户与另一组重叠，或开发评估集用户出现在训练、内层验证组 → 分组作废，重做筛选。

  - key: D-2
    question: 训练规模
    decision: 训练约 15 万行、内层验证约 6 万行（训练文件用户的约 5.8% 与 2.3%），不随结果调整。
    rationale: 隐语 SGB 单进程两方模拟的耗时与行数近似成正比（S5.G1：9.9 万行约 55 分钟）；比较的检出力由开发评估集正例数决定，与训练规模无关。
    falsifier: 隐语 SGB 在该规模上单次训练超过 4 小时 → 不缩小训练集重跑，A 记为未完成，主对比改用集中式代理 L4 报告并注明（A-4 的无损前提另行核对）。

  - key: D-3
    question: 编码
    decision: |
      主动方在训练组内不同值超过 1000 的列做频数编码（训练组出现次数，未见值为 0），其余主动方列与全部被动方列做序号编码（未见值为 -1）。
      不用目标编码。用户号 l_u_fea_1 只作分组与客户簇，不作特征（四组用户不相交，作特征时评估组全为未见值）。L1 的香港统计为分段内各类别占比。
    rationale: 频数编码不用标签，不会把标签信息带进特征；被动方 5 列基数都不超过 5，序号编码即可。
    falsifier: 频数或序号编码的任一状态用到了内层验证或开发评估组的数据 → 编码作废重做。

  - key: D-4
    question: 各臂的适配
    decision: |
      L1 分段 = l_u_fea_2 × l_u_fea_3 × l_u_fea_4 × l_u_fea_5（主动方低基数用户列）；k = 5/10/20，k 按不同用户数计。
      B_T1 与 S6.P3 相同（被动方序号编码上 10 棵深 3 随机树，k = 10）。B_T2 不适用（被动方没有自有标签），B_best 在 B_T1 与 L1_k10 中选；
      对应的两项次要对比（B_T2 − L1_k10、A_secure − A）本数据集不做，Holm 仍按 S6.P3 完整家族 9 项计。其余臂、seed、调参候选与统计方法全部继承 S6.P3。
    rationale: 只改 S6.P3 在 FedAds 上无法执行的部分，其余不动，使两个数据集的结果可以并列阅读。
    falsifier: 开发评估之后任一臂的定义、k、候选或指标被改动 → 按 S6.P3 停止规则作废。

falsifier: |
  本记录整体被推翻的条件：①开发评估集标签在 S6.P4 冻结提交之前被计算或查看；②所有者要求另选第二组证据或照字面先跑 HSBC mock（DR-GOV-017 · D-1 的推翻条件）。

