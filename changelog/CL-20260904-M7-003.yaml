title: 恶意参与方攻防：两项防护必须同时开启，补上防护基线自身的漏洞
what: '放开此前全部结论所依赖的**半诚实**假设，实现两类恶意攻击：A6 恶意主动方探针攻击（发构造的残差直接把被动方特征「问」出来）与A7 恶意被动方定向抬分（发构造的部分 logit 把指定人群顶进名单），以及残差合法性检查这一防御维度。

  据此更新 M8 的防护基线：新增残差合法性检查为**强制项**，名单稳定性阈值由 0.9 收紧至 0.95，护栏规则由 6 条增至 8 条，威胁模型声明由「半诚实」改为「半诚实 + 部分恶意」。'
key_finding: "\U0001F534 **C10 · 上行加噪与残差合法性检查必须同时开启，任一单独存在时另一条即失效。**\n  只加噪（幅度不受约束）：幅度放大到 1000 时**仅需 100\
  \ 次重复**即攻破 σ=0.1；\n  只查合法性（无噪声）：伪装探针（叠在真实残差上、幅度压在 1 以内）R²=0.859，**26 次全部未被标记**；\n  两者同时：合法幅度下需约 **10⁸\
  \ 次重复**，实际不可行。\n机制：单次探针的信号量级是 lr·amplitude/n，而噪声固定为 σ——**信噪比与幅度成正比**。约束幅度的唯一手段就是合法性检查。\n→ **合法性检查把攻击成本抬高六个数量级。它不是锦上添花，是让加噪防护有意义的前提。**\n\
  **而这条此前不在 M8 的防护基线里——本步补上的是我自己配置的漏洞。**\n\n\U0001F534 **C11 · 恶意被动方可操纵名单，且中等幅度不触发原有告警。**\n抬分幅度 1.0 时\
  \ 45% 的目标客户被顶进 Top-10% 名单，而名单重合度仍有 0.93——**高于旧阈值 0.9，不会告警**。基线已收紧至 0.95。但这只是**检测**手段，不是防护：攻击者压低幅度仍可缓慢渗透。\n\
  \n另一处方法上的修正：最初把探针幅度固定为 1 来测，得到「攻击在噪声下彻底失效」的结论——**但恶意攻击者凭什么受这个限制？** 幅度参数化之后结论才立得住。这提醒一件事：**给攻击者设的限制，必须说得出是谁在强制执行它。**"
why: '《实验结果与结论》§9 把「恶意参与方设定」列为**目前唯一最可能改变结论**的缺口。半诚实假设在真实场景中往往不成立——协议由代码执行，而代码由某一方控制，对方无从验证收到的数字是不是真按协议算的。

  补齐后确实改变了结论，而且改的是本项目自己的防护配置。'
