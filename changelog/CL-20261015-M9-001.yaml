    will_not_produce：不训练、不计算新效果指标/置信区间、不运行攻击或PSI、不重跑D2；不读行数据内容、不迁移/改写冻结数据或results、不删除历史、失败和凭证；本地私有资产/虚拟机备份不上传。


    success_criteria：新Agent从唯一入口能定位规范、现状、每轮方法与结果、失败与未执行边界、环境恢复和暂停草稿；迁移清单与原文件可核对、旧入口可达；工程发布门禁通过后同步Public/main。质量验证仅做代码/文档门禁，不视为科研实验或自动恢复。


    risk：旧相对链接与机器证据路径容易因搬移断裂，因此冻结结果/配置/源码路径保持原位；仅移动独立日志/报告正文并机械修正链接，旧路径变导航。暂停草稿未完成验收，文件使用.pending后缀、显式缺陷清单，不能冒充可用实现。


