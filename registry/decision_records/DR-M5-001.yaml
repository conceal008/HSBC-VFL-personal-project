dr_id: DR-M5-001
title: 本轮采用双虚拟机功能模拟与安全预对齐训练
date: 2026-10-01
agent: Codex
module: M5
status: active
requested_by: 仓库所有者
approved_by: 用户本轮明确要求将物理隔离改为功能模拟，并实施独立账户、目录、虚拟机和权限
related_step: S5.P2
related_change_id: CL-20261001-M5-001
context: S3.P1 阻断物理双主机与明文 PSI 输出；用户授权功能模拟，但要求继续保护双方数据。
decision: 本轮不要求双物理主机，改为双 Linux 虚拟机。复用 S1.P2 预对齐冻结输入，在 MPC 内验证键与顺序一致性；不运行明文交集 PSI。M0/S0.9
  真实业务裁定维持待定。
consequences:
- 标签及最终预测仅 Alice 可见；Bob 和控制端不接收明文权重、标签、残差或预测。
- 采用安全 L1 组聚合对照并先于安全 L3；其开销不可代表原低成本 L1。
- 每次训练独立不可覆盖目录，分别保存代码、新增数据、结果和日志；所有数据派生结果留在仓库外。
- 半诚实参与方和可信宿主管理员是显式假设，绝对零泄漏与生产安全不是验收结论。
- 后续本地模拟默认沿用该功能隔离与逐次归档要求；更强威胁模型、真实业务试点或生产上线须另行验收，不以本步骤自动放行。
falsifier: 虚拟机/账户/访问负例或输出检查失败则禁止数据训练；若需要抵抗恶意参与方或宿主管理员、采用真实业务数据或声称物理隔离，须重新验收。
