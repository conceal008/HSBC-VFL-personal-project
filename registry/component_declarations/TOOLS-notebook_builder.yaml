  ⚠️ **残留风险**：门禁 6 只校验 notebook 的形式（命名 / 指纹 / 执行顺序），不校验它**现在还跑不跑得起来**。组件接口变更后，已提交的 notebook 可能静默过时。当前缓解是「改组件后随手重建相关
