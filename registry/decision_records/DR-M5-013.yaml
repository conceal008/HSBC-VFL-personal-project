  - D-2 推翻条件未触发：选择只读训练集交叉验证；测试集每个选出的组合评一次。
  - 运行中的修改（如实记录）：14:18 mock_overlap20 启动即失败——分组月份存成 object 数组，np.load 拒绝加载；改为定长字符串后续跑。
    改动只在 build_groups 的 mock 分支，修正前完成的 6 个任务（行 / 分组方案）不经过这段代码；修正时尚未看到任何 mock 结果。
    修正前后的组件 sha256 都记在启动指纹文件里；S5.M3-1 用修正后的组件从头重跑 UCI 与 COIL2000，结果与批量运行逐项相同。
  - 发现：R1 在 13 / 14 个任务上选了带 M6 的组合；S5.M1 变差的 Orange 流失 / 偏好改选 P+M6 / P，变为不显著；
    新增显著：Santander G3（M1+M6）、HomeCredit（P+M6）、FedAds（P+M6；R2 为 M1x+M6）。
