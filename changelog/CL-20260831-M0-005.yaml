what: |
  完成后四类定性，八类跨境对象定性至此全部完成：
  · CBA-005 梯度（cn → hk）→ 个人信息，随标签作敏感个人信息。**首个真正触发 PIPL 出境条款的资产**：
    须同时满足第 38 条三路径之一、第 39 条单独同意、第 55 条第（四）项 PIPIA。
  · CBA-006 聚合统计（k-匿名）→ 个人信息。k-匿名满足第 73 条第（三）项的去标识化，
    但不当然满足第（四）项的匿名化（要求「不能复原」）。
  · CBA-007 模型参数 → case_by_case，取决于 M7 的成员推断实验结论；实验完成前按「需论证」处理。
  · CBA-008 打分名单 → 个人信息，且构成自动化决策（第 24 条、第 55 条第（二）项）；
    名单虽不出境，但作为含香港侧信息的模型的下游产物，其合法性以上游跨境合规成立为前提。
  八类分布：禁止 1 · 协议内 1 · 需论证 6，**无一类可自由跨境**。

why: |
  八类定性完成，M0 的核心判据（跨境对象覆盖 8/8、每类 ≥1 条法条引用）达成，
  信息流设计从此有了基准——M3 的 PSI 选型、M5 的 L3 路线、M8 的名单交付都受它约束。

  其中 CBA-006 的定性最值得单独强调：L1 基线（本地模型 + 对方 k-匿名聚合统计）
  此前被假定为「低一个数量级的合规成本」，而 L1 正是 VFL 的真正竞争对手。
  若 k-匿名聚合统计同样按个人信息处理，L1 与 L3 的合规成本差距要小得多，
  「VFL 是否划算」的答案可能因此改变。这条结论已同步写入 M5 的 README，
  确保 M5 开工时必然看到，而不是埋在 M0 的 YAML 里。

