dr_id: DR-GOV-008
title: 明确不设合规角色，建立豁免登记机制并降级 M0 / M9 的法务复核类判据
date: 2026-08-31T12:00:00+08:00
agent: Claude (Opus 5, Claude Code)
requested_by: conceal008（仓库所有者）
approved_by: conceal008（仓库所有者，2026-08-31 明确指示「明确不设并降级 M0 的 DoD，你自己做，继续推进；如果遇到一些强制性的要求阻拦推进，你可以适当的绕开，但必须进行相关说明」）
module: GOV
status: active
supersedes: "DR-GOV-007 · 限制 L1 中「qualification_status: approved 只能由合规角色赋予」一句"
related_change_id: CL-20260831-GOV-016
related_step: S-GOV.8

context: |
  DR-GOV-007 曾把合规角色视为「暂时缺位」，安排定性可起草、待复核后转 approved。
  所有者 2026-08-31 明确：不设合规角色，降级 M0 的 DoD，由技术方自行完成。
  同时授权：遇到强制性条款阻拦推进时可适当绕开，但必须说明。

decisions:

  - key: no_compliance_role
    decision: |
      本项目**不设合规角色**。这不是暂时缺位而是结构性缺失——课题线内无具备法务资质的成员，
      且不打算引入。因此 `qualification_status: approved` 这一状态**在本项目中不再存在**，
      改用 `self_assessed_no_legal_review`，避免造成"已获批准"的错觉。
    rationale: |
      把 M0 长期挂在「待复核」，会让后续每个模块都带一个永远不会关闭的前置条件，
      到 M8/M9 时形成一堆无法收尾的半成品。如实降级比无限期挂起更诚实，也更可用。

  - key: waiver_registry
    decision: |
      建立 `registry/waivers.yaml`（append-only）作为豁免登记表，并在《维护约束 v2》
      新增第 12.1 部分说明机制。每条豁免必须写全五项：被绕开的条款 / 为什么做不到 /
      实际怎么做 / 代偿措施 / 失效条件。changelog 援引豁免写 `waiver_ref`，门禁 2 校验其存在。
    rationale: |
      「可以适当绕开」若没有固定位置，三个月后没人说得清哪些条款还生效，规范就名存实亡。
      给它一个登记表，绕行就从「破例」变成「有代价、有期限、可追溯的降级」。
      门禁 2 校验编号存在，使这条纪律不依赖自觉。

  - key: never_waivable
    decision: |
      划出不可绕清单：第 2 部分数据分级 · 0.7 反指标操纵红线七条 ·
      第 12 部分禁止事项的数据类与科学性类 · 第 16 条（不得改文档消除说做不一致）。
    rationale: |
      「适当」需要边界，否则授权会被逐步扩大解释。
      判据：绕开流程性条款是为了推进项目；绕开这四类是让项目失去存在意义——
      前者影响速度，后者影响结论可不可信、数据会不会泄。

  - key: w001_scope
    decision: |
      登记 W-001：豁免 M0 / M9 的法务复核类判据与 cross_border_assets.yaml 的合规 approve 要求。
      代偿措施四条（见 waivers.yaml）：定性必须引用逐字法条原文；必须写明不确定点；
      「可以跨境」的判断一律取最严解释；对外材料必须带固定免责表述。
      失效条件四条：进入真实业务数据试点 / 被作为实际上线依据 / 日后指定了合规角色 /
      出现一次对外发布遗漏免责表述。
    rationale: |
      豁免的是「必须由合规角色批准」，**不豁免**的是「必须引用原文、必须标注未经复核、
      必须取严解释」。前者是角色配置问题，后者是工作质量问题，不能一起绕。

falsifier: |
  ① 若出现援引 W-001 却未带免责表述的对外材料 —— 代偿措施未被执行，豁免机制失效，
     须暂停对外发布并复审；
  ② 若 waivers.yaml 中出现无 `expiry_condition` 的条目 —— 说明本机制已退化为第 16 条禁止的
     「改文档消除不一致」，须整体作废重建；
  ③ 若不可绕清单中的任一条被援引豁免 —— 边界失守，须冻结豁免机制并回溯清理。

review_trigger: |
  ①每次新增豁免时复核不可绕清单是否需要扩充；②M8 上线准入与 M9 交付准入前必须复核全部 active 豁免；
  ③项目若进入真实数据试点，W-001 自动失效，须立即复审。

consequences:
  - "M0 / M9 的完成标记改为「技术侧完成（未经法务复核）」，不得标记为通过法务判据"
  - "六份规范文件中五处法务复核类条款已加豁免注记，指向 W-001"
  - "cross_border_assets.yaml 的定性状态字段改用 self_assessed_no_legal_review"
  - "门禁 2 新增 waiver_ref 校验；回归套件 17 → 18 组"
  - "所有对外材料必须带 W-001 的 mandatory_disclaimer"
