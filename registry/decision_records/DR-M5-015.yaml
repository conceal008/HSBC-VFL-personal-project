context: |
  所有者 2026-11-02 20:38 要求：论文与期刊里的优化方法放到全部数据集上，有未做的实验就立即开始。
  方法筛选第一 ~ 三阶段（DR-M5-012 ~ DR-M5-014）已完成。报告 v1.4 §5.2 的未做项中：
  - M7（LR 轨道求解器）需本机双虚拟机，会话约定不启动，仍待所有者定；Amex 暂停、IEEE 全交集缺切分文件、SS-XGB 扩数据集信息增益低，均不在本阶段；
  - **M3 后半「主动方明文直方图」**：报告写明需先核对隐语 1.13 `sgb_v` 中主动方直方图是否走 HEU 密文路径。
    核对结果（读源码，未读任何项目数据）：`GradientEncryptor.cache_to_workers` 在默认模式（label_holder_feature_only = False）下把
    **同一份梯度密文** 发给所有参与方，**包括主动方自己**；`calculate_bucket_sum_level_wise` 随后对每一方（含主动方）的特征做密文分桶求和，
    再由主动方解密。主动方本来就持有明文梯度与私钥，这一段加密对主动方没有保护作用，只增加开销。
    SecureBoost（Cheng 等，IEEE Intelligent Systems 2021）的原始设计里，主动方在自己的特征上直接用明文求分裂。
  - Orange 大版（S5.M5）未做真实 SGB 复核，预筛的 SGB 成本下降也未实测（报告 §3.9「未在 SGB 上实测」）。
  可行性试验（只用合成数据，4,000 行 × 两方各 20 列，5 棵树；不涉及任何项目数据）：把主动方那一份换成明文后，
  两组参数（不采样；列采样 0.7 + 行采样 0.8）下逐行打分都逐位相同，拟合耗时下降约三成。

decisions:

  - key: D-1
    question: 授权与范围
    decision: |
      新开「方法筛选第四阶段」，预算 2 步：
      - S5.M7：主动方明文直方图（M3 后半）的逐位一致与耗时（D-2 ~ D-4），以及 Orange 大版流失上预筛列数的 SGB 单树开销（D-5）；
      - S5.M8：Orange 大版流失的真实 SGB 复核（D-6），**只在 S5.M7 的 D-3 判定为「逐位一致」时做**，否则不做并如实记录。
      M7 仍不在本阶段。不改 S5.M1 ~ S5.M6 的方法、配置与已提交结果。
    rationale: 两项都只用公开数据，在会话容器内可完成；M3 是候选文档里仍有一半没做的方法，Orange 大版是 17 个任务中唯一没有任何真实 SGB 证据的数据集。
    falsifier: 所有者表示「继续」不指这些 → 本阶段结果作废。

  - key: D-2
    question: 主动方明文直方图怎么实现
    decision: |
      在实验代码里替换 `GradientEncryptor.cache_to_workers`（不改隐语源码）：
      - 被动方：与原实现相同，收到同一份梯度密文（同一次加密、同一编码器）；
      - 主动方：收到自己明文梯度的 HEU 明文对象（同一编码器），即隐语 label_holder_feature_only 分支里主动方那一份的做法；
      - label_holder_feature_only = True 时沿用原实现。
      其余组件（分桶、打乱、兄弟节点相减、解码、求分裂）不动。
      信息流：被动方收到的消息逐字节不变；主动方只是不再给自己加密。协议安全性不变（技术侧自评，未经法务复核，W-001）。
    rationale: 改动最小，与 SecureBoost 原设计一致；隐语自己的 label_holder_feature_only 分支已经用这种明文对象走同一套分桶求和，正确性有现成路径。
    falsifier: 被动方收到的消息与原实现不同 → 方法作废。

  - key: D-3
    question: 逐位一致怎么判定
    decision: |
      任务与配置：S5.M2 已做真实 SGB 的 6 个任务的优化版联邦（F_opt_p，配置、分桶、初始分数全部取自 S5.M1 结果，seed 11）：
      UCI Bank、Orange 偏好（小版）、Santander G3、mock 重合 80、FedAds、COIL2000。
      用明文直方图版本完整拟合一次，测试集逐行打分（float32 存档）与 S5.M2 已存档的打分比较：
      - 全部 6 个任务逐行打分完全相同 → 判定「逐位一致」；
      - 有任务不同但最大差 ≤ 1e-6 且测试 AUROC 相同 → 判定「数值等价」，写明不同的行数；
      - 否则判定「不等价」，S5.M8 不做。
    rationale: 存档打分来自 S5.M2 的同一组件与同一私有输入；同配置下隐语 SGB 的拟合是确定的（S5.M2 notebook 已在 UCI 上复现优化版逐位相同）。
    falsifier: 无（判定规则本身）。

  - key: D-4
    question: 耗时怎么测
    decision: |
      同样 6 个任务、同样配置，但只训练前 min(10, 配置棵数) 棵树：
      - 每个任务先做一次 2 棵树的预热拟合（不记录），然后按「原版、明文、明文、原版」顺序各拟合两次，每次重新 sf.init；
      - 记录每次的拟合秒数，以及两方各自的分桶求和秒数（包一层计时，不改计算）；四次拟合的逐行打分须两两完全相同；
      - 报告每个任务：两种版本的平均每棵树秒数、节省比例 1 − 明文 / 原版（两次重复的范围）、主动方列数占比；
      - 运行期间会话内不跑门禁或其他重计算。
      口径：debug_mode 单进程顺序执行，两方的计算串行相加，测得的是「两方合计计算时间」；真实部署中两方并行，
      墙钟时间的节省取决于主动方是否在关键路径上，如实写明，不换算成部署时长。
    rationale: ABBA 顺序抵消漂移；只训前 10 棵树控制总时长（每棵树的开销结构相同）。
    falsifier: 四次拟合的打分不完全相同 → 该任务的计时作废并记录原因。

  - key: D-5
    question: 预筛列数的 SGB 单树开销
    decision: |
      Orange 大版流失（S5.M5 的 final 视图 fit 行 40,000 行；列清单与排序取自 S5.M5 的私有敏感性矩阵，不重新预筛），
      每方 k = 100 / 300 / 1000 列，配置为 S5.M5 选定的优化版联邦配置（central），只训练 5 棵树，原版与明文各一次（k 之间交替先后）。
      报告每棵树秒数随两方总列数的变化，按线性拟合外推到全部清洗后列（每方约 6,650 列；外推值明确标为外推，不实测：
      全部列的单次拟合内存与时长超出会话容器）。
    rationale: S5.M5 只在明文代理上验证了预筛的精度，报告写明预筛的意义在 SGB 成本但「未在 SGB 上实测」。
    falsifier: 无（描述性测量）。

  - key: D-6
    question: S5.M8 Orange 大版流失的真实 SGB 复核（有条件）
    decision: |
      前提：D-3 判定为「逐位一致」。用明文直方图版本（与原版逐位相同，只是更快）在 Orange 大版流失、每方 k = 300（S5.M5 主分析的列清单）上各拟合一次（seed 11）：
      - 原版联邦（F_def：隐语默认配置、10 桶、初始分数 0.5）与优化版联邦（F_opt_p：S5.M5 选定配置、33 桶、先验初始分数）；
      - 对比：I2 + I3 在 SGB 上（F_opt_p − F_def）、SGB 与同配置代理之差（DR-M5-012 · D-1 的容差 0.005），测试行 bootstrap，口径同 S5.M2；
      - 内地单边只有明文代理（单方模型无需密文），「优化版联邦 SGB − 内地单边代理」只作描述。
      时长：用 D-5 的单树秒数估算；单次拟合估计超过 7,000 秒（会话后台单段上限约 7,150 秒）的不做，如实记录，不为此改配置或减棵数。
    rationale: Orange 大版是 17 个任务里唯一没有真实 SGB 证据的数据集；流失是三任务中正例最多（测试 734）、I2 + I3 增益最大的一个。
    falsifier: 选择或配置读了测试集 → 结果作废。

  - key: D-7
    question: 边界
    decision: |
      - 明文直方图只在实验代码里替换一个方法，不改隐语源码；要用于正式联调，需要在隐语上游或项目封装层实现并经安全评审（W-001）。
      - 耗时是会话容器（单进程两方模拟、OU）上的测量，不代表本机双虚拟机或汇丰环境的时长。
      - 公开数据上的开发证据，不代表汇丰效果，不换算成命中率或收益。
      - 只提交汇总；逐行打分只在会话临时目录与本机私有目录。
    rationale: 与 S5.M2 / S5.M4 的边界一致。
    falsifier: 无（范围声明）。

falsifier: |
  本记录整体被推翻的条件：①运行代码在启动指纹之后因看过结果而修改却未另立版本；②任何选择读了测试集；③所有者表示「继续」不授权本阶段。

review_trigger: |
  S5.M7 完成时（决定 S5.M8 做不做）；S5.M8 完成或判定不做时。

review_20261104_s5m7: |
  S5.M7 完成时复核（计时 12:09、单树开销 13:02、逐位比较 14:15 完成）：
  - D-2 推翻条件未触发：只替换 `GradientEncryptor.cache_to_workers`，被动方收到的梯度密文与原实现是同一次加密；三段启动指纹中组件、依赖组件与配置的 sha256 相同，运行中未改代码。
  - D-3 判定「逐位一致」：6 个任务明文版本完整拟合（14 ~ 83 棵树），测试集逐行打分与 S5.M2 存档全部相同（不同 0 行，最大差 0），测试 AUROC 相同。
    notebook 用仓库组件在 UCI Bank 上重跑，判定相同。
  - D-4：每棵树两方合计计算时间省 29% ~ 43%（ABBA 两对的范围 27% ~ 46%），每个任务四次拟合打分两两相同；省下的全在主动方（分桶求和约 1 / 12，主动方解密约 0），被动方不变。
  - D-5：Orange 大版流失每方 100 / 300 / 1000 列，每棵树原版 25.0 / 73.1 / 241.7 秒、明文 14.6 / 41.7 / 126.8 秒；外推到全部清洗后列原版约 1,730 秒 / 棵（外推，不实测）。
  - S5.M8 决定：D-3 为「逐位一致」，按 D-6 做。D-6 估算（每方 300 列明文 41.72 秒 / 棵 × 层数比 × 棵数）：优化版联邦 3,922 秒，原版联邦 6,953 秒，都不超过 7,000 秒，两个方法都拟合，各一个后台段。
  - 第四阶段 1 / 2 完成。
