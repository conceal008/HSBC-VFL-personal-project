  验证的假设：①新判据在零效应下的第一类错误率 ≤ 0.07；②以 S0.1P 预测的可检出差异为真时，功效落在 [0.707, 0.879]。
  ①成立（0.038、0.045）；②在 441 个正例档以 0.001 之差不成立（0.880），按预定后果改用模拟法：
  检出 0.02 约需 693 个正例，S0.1P 默认相关 0.8 偏乐观（合成设定约 0.69）。
  旧判据功效约 0.1；5 个 seed 的符号翻转功效恒为 0；6 个 seed 的符号翻转在零效应下拒绝率约 0.8。
