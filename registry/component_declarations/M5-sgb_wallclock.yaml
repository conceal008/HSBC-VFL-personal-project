component: sgb_wallclock
module: M5
path: modules/m5_modeling/components/sgb_wallclock.py
purpose: S5.M10 主动方明文直方图在两进程生产模式下的墙钟（DR-M5-016 · D-7）：两个本地进程各自一方（sf.init(cluster_config, ray_mode=False)，本机回环通信），每个进程只读自己那一方的特征；明文直方图替换（sgb_cost_screen.plaintext_label_holder）在两个进程里同样开启；每个任务先预热一次，再按原版、明文、明文、原版各训前 n 棵树，记录两方训练墙钟、启动到结束的总墙钟与回环网卡发送字节数，四次测试打分须两两逐位相同；按方拆出的私有输入副本用完即删。
inputs:
- S5.M1 / S5.M5 的私有输入矩阵与结果 JSON（MS_PRIVATE_ROOT、MS_RUN_DIR、MS_LARGE_DIR）
- 配置 modules/m5_modeling/configs/s5_m10_wallclock.yaml
outputs:
- 运行输出（MS_M10_DIR）：每个任务的计时 JSON（只含聚合指标：两方墙钟、回环字节、打分是否一致）、每次运行的日志与内地写出的测试打分、启动指纹
- 公开汇总 modules/m5_modeling/results/sgb_wallclock_v1/
tests:
- modules/m5_modeling/tests/test_sgb_wallclock.py
cross_border_assets: []
cross_border_note: 公开数据上会话容器内两个本地进程的模拟，只走本机回环，不接触真实个人信息、不向境外传输任何数据，故无跨境资产。
caveat: 容器 2 核、本机回环通信，墙钟不代表跨境网络或汇丰环境，只作两种实现的相对比较。明文直方图只是实验代码里的替换，用于正式联调需在隐语上游或项目封装层实现并经安全评审（技术侧自评，未经法务复核，W-001）。测试打分只存会话临时目录，不入仓库。
declared_at: '2026-11-05'
declared_by: Claude (claude-opus-5-5, Claude Code)
