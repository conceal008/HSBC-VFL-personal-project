title: S5.M10 主动方明文直方图在两进程生产模式下的墙钟——每棵树省 31% ~ 41%，与单进程合计计算的节省基本相同
what: |
  方法筛选第五阶段（DR-M5-016）第 2 步。
  - 可行性：合成数据（5,000 行 × 两方各 20 列，不涉及项目数据）上，在会话容器内起两个本地进程各自一方（sf.init(cluster_config, ray_mode=False) 生产模式，本机回环），
    sgb_v 能拟合，明文替换在两个进程里同样开启后两种版本打分逐位相同。
  - 正式计时：UCI Bank、Santander G3、mock 重合 80、Orange 大版流失（每方 300 列），S5.M1 / S5.M5 选定的优化版联邦配置；
    每个任务先做一次 2 棵树的预热，再按原版、明文、明文、原版各训前 10 棵（大版 5 棵）；记录两方训练墙钟、总墙钟与回环发送字节，四次打分须两两逐位相同。
  - 每个进程只读自己那一方的特征（标签只在内地进程）；按方拆出的私有输入副本用完即删。
  新增：
  - 组件 sgb_wallclock 与单测、组件声明 M5-sgb_wallclock；
  - 运行配置 configs/s5_m10_wallclock.yaml；
  - 带汇总输出的运行入口 notebook S5.M10_1（用仓库组件在 UCI Bank 上重起两进程、原版与明文各 2 棵并核对逐位一致）；
  - 公开汇总 results/sgb_wallclock_v1/；
  - DR-M5-016 复核段 review_20261105_s5m10。
  状态类字段同步：BC-M5-018（plaintext_wallclock 完成）、step_ledger（追加 S5.M10，第五阶段 2 / 2 完成）、registry/module_status.yaml 的 M5 与 governance、
  M5 README、项目进度总览（notebook 80 → 81、带输出 52 → 53；组件声明 104 → 105）。
why: |
  S5.M7 测的是单进程模拟中两方计算串行相加的「合计计算时间」，部署中两方并行时墙钟能省多少是交接里列出的开放问题。
  结果（开发证据，容器 2 核、本机回环）：
  - 每棵树墙钟（原版 → 明文）：UCI Bank 2.98 → 1.79 秒（省 40%，S5.M7 单进程 40%）；Santander G3 22.4 → 15.3 秒（31%，29%）；
    mock 重合 80 22.0 → 14.7 秒（33%，32%）；Orange 大版流失 47.5 → 28.0 秒（41%，43%）。两方并行时的墙钟节省与合计计算的节省基本相同。
  - 两种版本的回环发送字节平均相差不到 2%，与同一版本两次之间的波动同量级，与「被动方收到的消息不变」一致；四次打分两两逐位相同。
  - 两进程的原版墙钟比单进程合计计算时间短（Orange 大版流失 47.5 对 73.1 秒），两方仍有部分计算重叠。
