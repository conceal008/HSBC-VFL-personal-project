# S6.P3 · G3 五臂对比预注册（机器可读部分）
# ---------------------------------------------------------------------------
# 状态：frozen（2026-10-26，S5.G0）。冻结前按第九节补齐了代码与环境指纹，并在 freeze.amendments 中逐条记录
# 冻结前对 proposed 版的修改（均在打开开发评估集标签之前）；冻结后只能另写 DR 改，且只对之后的运行生效。
# 恢复授权见 DR-GOV-016；本文件不含任何行数据或逐行结果。
# 评估口径：modules/m6_evaluation/evaluation_protocol.md v1（DR-M6-001）。
# ---------------------------------------------------------------------------
step_id: S6.P3
purpose: 预先写定 G3 五臂对比的数据、臂、seed、调参预算、指标、统计方法、封存确认集与停止规则，供恢复实验后执行
status: frozen
protocol_ref: modules/m6_evaluation/evaluation_protocol.md
protocol_version: v1

# 一、主对比与关心尺度
primary:
  dataset: santander
  contrast: [A, L1_k10]          # 主对比：双向联邦相对低成本替代方案
  metric: roc_auc
  delta_of_interest: 0.02        # 统计关心尺度（AUROC 绝对差）；业务意义另由 precision_at_k 与 S6.P2 盈亏平衡判断
secondary_contrasts:             # 次要对比，Holm 校正，家族 = 本列表 × 每个数据集
  - [A, L0]
  - [L1_k10, L0]
  - [B_T1, L1_k10]
  - [B_T2, L1_k10]
  - [A, B_best]                  # 单向形态代价；B_best 在开发评估前按内层验证集选定，选定规则见 arms.B_best
  - [A_secure, A]
  - [NC, L0]                     # 阴性对照
  - [L1_k5, L1_k10]
  - [L1_k20, L1_k10]

# 二、臂
arms:
  L0:       {who_trains: mainland, model: local_gbdt, uses_counterparty: none}
  L1_k5:    {who_trains: mainland, model: local_gbdt, uses_counterparty: k_anonymous_aggregates, k: 5}
  L1_k10:   {who_trains: mainland, model: local_gbdt, uses_counterparty: k_anonymous_aggregates, k: 10}
  L1_k20:   {who_trains: mainland, model: local_gbdt, uses_counterparty: k_anonymous_aggregates, k: 20}
  B_T1:     {who_trains: mainland, model: local_gbdt, uses_counterparty: hk_random_tree_embedding_k_anonymous, k: 10, flow: hk_to_cn_once}
  B_T2:     {who_trains: mainland, model: local_gbdt, uses_counterparty: hk_own_label_score, flow: hk_to_cn_once}
  B_T3:     {alias_of: L1_k10}     # DR-MX-002 · D-4：L1 本身作为单向形态下界，不另跑
  B_best:   {select_from: [B_T1, B_T2, L1_k10], rule: highest_inner_validation_auc, decided_before_dev_eval: true}
  A:        {who_trains: both, model: secretflow_sgb, flow: two_way_encrypted_gradients}
  A_secure: {who_trains: both, model: secretflow_ss_xgb, flow: secret_shared, config: copy_of_A}   # 不另调参，只比精度与成本
  NC:       {who_trains: both, model: secretflow_sgb, config: copy_of_A, passive_rows: shuffled_within_aligned_customers}

# 三、数据
datasets:
  santander:
    role: primary
    source: 原始 1,364.7 万行月度快照（本机）
    unit: customer
    sampling: 按客户抽样；排除 10/21 汇报样本与 S5 系列 santander_product 任务中出现过的客户（排除名单只在本机构造，不入库）
    eval_positives_target: 700   # 开发评估集按客户去重的期望正例数；样本量按训练月份的正例率预先算出，不看评估月标签
    lockbox: 最新一个观察月份 × 未进入开发集的客户
  fedads:
    role: secondary
    source: 官方自然切分（本机）
    unit: user
    lockbox: 按时间最晚的一段，开发前划出
  hsbc_mock:
    role: secondary_mechanism   # 合成机制数据，只回答重合率的影响，不作业务证据
    variants: [overlap20, overlap50, overlap80]
    unit: customer
    eval_positives_target: 700
    lockbox: 同生成器另一随机种子生成，开发期间不生成

# 四、随机性与调参预算
seeds:
  training: [11, 22, 33, 44, 55, 66]   # ≥6，满足 evaluation_protocol v1 第三节
  split: 20261101                      # 冻结时确认；开发/内层验证/评估三分一次划定
  tuning: 20261102
tuning:
  method: random_search
  configs_per_arm: 20                  # 每臂同样的候选数，在内层验证集上选，用 tuning seed 一次
  no_tuning_arms: [A_secure, NC, B_T3]
  inner_validation_share: 0.2
  dev_eval_share: 0.3
compute_caps:
  a_secure_datasets: [santander]       # SS-XGB 约慢 11 倍，只在主数据集上跑
  max_wall_clock_hours_per_fit: 6
  max_repair_rounds_per_arm: 2

# 五、指标
metrics:
  primary: roc_auc
  secondary: [precision_at_k, recall_at_k, lift_at_k, log_loss]
  k_share: 0.10                        # 名单规模占评估人群 10%；业务真实触达规模给出后另版
  cost: [wall_clock_seconds, bytes_sent, peak_memory_mb]
  privacy_reported_separately: true    # A1/A2 攻击另按 M7 预声明，不并入本对比

# 六、统计（引用 evaluation_protocol v1，不另定）
statistics:
  bootstrap_reps: 2000
  cluster: customer
  ci_level: 0.95
  detectable_gap_method: conservative
  multiplicity: holm
  verdicts: [可分辨的提升, 可分辨的下降, 未达可检出规模, 在预声明尺度上无可分辨差异]

# 七、停止规则
stopping_rules:
  - 数据流违规或安全硬门失败：立即停止全部运行，不用预测收益抵偿
  - 阴性对照的配对差区间不含 0：该数据集所有含联邦臂的结论作废，先排查泄漏或容量差异
  - 某臂修正超过 max_repair_rounds_per_arm 仍失败：记为失败分支保留，不再重试
  - 开发评估之后不新增臂、不改关心尺度、k、指标或调参预算
  - 主数据集开发评估正例数低于 eval_positives_target：不追加样本重评，主对比结论只能写「未达可检出规模」或按实际可检出差异报告
  - 封存确认集只在决策写定后打开一次

# 八、结果到决策的映射（写在看结果之前）
decision_map:
  A_minus_L1_gain: L3 有增量 → S0.9 在形态 A 与 B_best 之间比较；进入 G4 盈亏平衡
  A_minus_L1_no_diff: L3 在关心尺度上没有增量 → 建议采用 L1 或不做联邦
  A_minus_L1_underpowered: 无法判定 → 报告可检出差异，不下结论
  B_best_minus_L1_gain: 单向形态可行 → 单向形态代价 = A − B_best
  all_B_not_better_than_L1: DR-MX-002 · D-4 推翻条件触发 → S0.9 只在形态 A 与不做联邦之间选
  NC_not_null: 联邦增益不能归因于信息互补，主结论作废

# 九、冻结记录（2026-10-26，S5.G0；本节之后的字段在运行时只读）
freeze:
  frozen_at: '2026-10-26T12:40:00+08:00'
  frozen_by: Claude (claude-opus-5-5, Claude Code)，按 DR-GOV-016 所有者授权
  evidence_before_freeze: 只看过训练组的正例率（0.0378）与开发评估候选桶在 2016-03 的客户数；开发评估集标签未计算
  santander_prep:
    raw_file: 数据集/santander-product-recommendation/train_ver2.csv.zip
    raw_zip_sha256: a8a185741d39fcf1c5c12033bf88c6a1bbc5bfb2cda33d0eeef64d2e88054957
    salt: G3-2026
    n_buckets: 10000
    groups:
      train: {buckets: [0, 100], feature_months: ['2015-01', '2016-01']}
      inner_val: {buckets: [100, 200], feature_months: ['2015-11', '2016-02']}
      dev_eval: {buckets: [1000, 1223], feature_months: ['2016-03', '2016-03']}
      lockbox: {buckets: [5000, 5223], feature_months: ['2016-04', '2016-04'], extracted: false}
    eval_bucket_rule: {target_positives: 700, safety: 1.1, train_rate: 0.0378, customers_per_bucket: 91.38, buckets: 223}
    selected_rows_sha256: 85b0b058f00d9aef67d685431d34b60583a0b85519038b7eb52f6bd5563cd3e1   # 私有，本机 8-9月/G3五臂对比/
  arm_details:
    search_space:                     # 4 × 4 × 4 × 3 = 192 组网格，用 seeds.tuning 不放回抽 20 组
      max_depth: [3, 4, 5, 6]
      learning_rate: [0.05, 0.1, 0.2, 0.3]
      num_boost_round: [50, 100, 150, 200]
      reg_lambda: [0.1, 1.0, 10.0]
    split_seed_note: seeds.split 不再使用，客户分组由 santander_prep 的加盐哈希决定
    xgboost_max_bin: 33               # 与 SGB sketch_eps 0.03（约 33 桶）一致，所有 XGBoost 臂相同
    sgb_sketch_eps: 0.03
    sgb_he_schema: ou
    tuning_candidates_shared: true    # 20 组候选由 tuning seed 一次抽定，所有需调参的臂相同
    a_tuned_on: central_plaintext_proxy
    l1_segments: {quantile_bins: {age: 5, renta: 4}, categorical: [segmento], statistics: host_feature_means, period: train}
    b_t1: {n_trees: 10, depth: 3, k: 10, encoding: one_hot}
    b_t2: {hk_label: next_month_ind_actividad_cliente, config: {max_depth: 4, learning_rate: 0.1, num_boost_round: 100, reg_lambda: 1.0}}
    nc: {implementation: central_plaintext_proxy_with_A_config, shuffle_seeds: [11, 22, 33, 44, 55, 66]}
    n_jobs: 2
  amendments:
    - A-1 Santander 抽样改为客户号加盐哈希分桶（见 santander_prep）；开发评估集桶数按规则算出 223，只用训练正例率与客户数
    - A-2 不再排除 10/21 样本与 LR 路线 santander_product 的客户：前者由团队仓库脚本在已失效的云端会话生成，本机无副本，排除名单无法完整重建；预期重叠约为全体客户的 0.8% 与 5%，报告中注明
    - A-3 XGBoost（subsample=colsample=1）与 SGB 均为确定性训练，确定性臂只拟合一次，seed 维度方差为 0，不报告其符号翻转检验；只有 B_T1（嵌入随机性）与 NC（打乱随机性）跑 6 个 seed
    - A-4 臂 A 的超参在明文集中式代理（同一 20 组候选、max_bin 33）上按内层验证集选定，再用隐语 SGB 训练一次
    - A-5 阴性对照 NC 用 A 的配置在明文集中式代理上实现（6 个打乱 seed），不再跑 SGB；同时报告 A（SGB）与集中式代理 L4 的配对差作为无损性核对
    - A-6 L1 的分段由内地特征定义（年龄 5 分位 × 收入 4 分位 × 客群类别），香港返回训练期 k-匿名分段均值；明文实现需要香港知道每位客户的分段号（内地→香港），安全实现（LR 路线 L1_secure）在秘密计算内完成，本步只测精度
    - A-7 B_T1：香港训练期特征上的 10 棵深 3 随机树嵌入，叶子内不同客户数 < 10 的并入被抑制档，独热后发给内地
    - A-8 B_T2：香港自有标签取次月活跃度（香港侧字段派生，与主标签不同），香港用固定配置训练后只发分数
    - A-9 A_secure（SS-XGB）不在本批，按 DR-GOV-016 · D-2 的顺序另立 S5.G2
    - A-10 FedAds 与 HSBC mock 不在本批，另立 S5.G3
  falsifiers_added:
    - A（SGB）与集中式代理 L4 的配对差区间不含 0 且绝对值 > 0.005 → A-4、A-5 的代理前提不成立，NC 与 A 的调参须改用 SGB 重做
