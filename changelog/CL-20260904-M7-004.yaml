title: 模型窃取与信息累积：噪声防不住标签，却防得住模型资产
what: 补齐最后两类偏离：A9 模型窃取（被动方由已证的 A1 反解主动方逐样本打分）与 A8 多次建模的信息累积（最现实的一类「合谋」）。据此为 M8 基线新增 model_asset_protection（下行
  σ≥1.0），护栏由 8 条增至 9 条。
key_finding: '🔴 **C12 · 被动方可独立复现整份名单。**

  推导完全建立在已证的 A1 之上，不需要任何新假设：能推断标签 → 反解 logit →减去自己算得出的 partial_b → 得到主动方的全部贡献，逐样本。无防护时 Top-10% 名单重合度 **1.000**。

  后果不是「偷到几个参数」，而是**被动方可以不依赖主动方独立出名单**——商业资产的直接转移。**「原始特征没出域」不等于「资产没被拿走」。**


  **一个有用的不对称**：σ=1.0 时标签推断准确率仍是 1.0000（C3 得到印证），但名单复现重合度已从 1.000 跌到 0.126（随机水平 0.10）。加强攻击（平均收敛段末 200 轮）也只到
  0.408。

  机制清楚：**标签只需要残差的符号**——轮间恒定的一位信息，跨轮平均即可恢复；**模型窃取需要残差的精确数值**——随训练变化不可跨轮平均，且信号量级只有 O(正样本率)=0.03，被 σ=1.0
  完全淹没。

  → **不要因为「噪声防不住标签」就不加噪声。它保的是另一样东西，且代价近零。**


  **C13 · 多次建模累积不构成实际威胁，但完全依赖合法性检查在场。**合法幅度下 6000 次重训（约每天重训 16 年）仍失败；幅度不受限时 100 次即攻破。已配对照实验单独验证，避免把「攻击太弱」误读为「防护有效」。


  **过程中修正一处攻击写弱的问题**：A9 初版用固定阈值 0 切分残差，把一个排序完美（AUC=1.0）的信号切得很差，因而误得「噪声挡住了模型窃取」。改为按已知正样本率取分位后，标签准确率才恢复到
  1.0000——**结论的方向没变，但理由完全不同了**：不是噪声挡住了标签，而是噪声只挡住了数值、挡不住符号。'
why: 《实验结果与结论》§9 把合谋与模型窃取列为最后未覆盖的偏离类型。模型窃取尤其值得做——它问的不是「数据有没有泄露」，而是「资产还在不在」，这是需求方真正关心的问题，而此前整个项目都没回答过。
