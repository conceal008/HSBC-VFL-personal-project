what: 新增两份根目录文档：《实验结果与结论.md》汇总 M2/M3/M5/M6/M7 的全部实测结果与三个主结论；《初版完成说明与降级清单.md》逐条说明本次降级了哪些标准、降到什么程度、代偿是什么、何时必须恢复。同步更新
  registry/module_status.yaml。
key_finding: '**三个主结论：**

  C1 · L1 只捕获纵向联邦价值的 12.3%——商业前提成立，但成立得比预期窄。

  C2 · 价值高度依赖互补性这一个条件（λ 跨度八倍），不是普遍成立。

  C3 · 逐轮加高斯噪声不是有效防护——跨轮平均攻击下泄露 AUC 回到 1.0000；压到 0.67 需 σ=30，此时可用性 0.6352 低于 L0 基线 0.7089。


  **降级清单同时记录了两处绕开的强制要求**（用户授权，须说明）：

  ① 门禁 5（代码质量）与门禁 7（端到端冒烟）的触发条件本次首次满足但未实现，列为初版合入后第一优先项；

  ② L3 三条路线未逐路线建分支卡，代偿为三条路线结果分别独立报告，未做择优隐藏。'
why: 用户指令要求「标准导致做不了的就降级，但要进行相关说明」。降级若不留痕，后来者会把降级后的产物当作满足原标准的产物使用——这比不做更危险。故降级清单与结果文档同等重要，且必须并列在根目录。
