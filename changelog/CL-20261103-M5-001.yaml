title: S5.M1 方法筛选：文献优化方法 × 14 个公开数据集任务，I2 + I3 与 M6 普遍有效
what: |
  按所有者 2026-11-02 指示，在 14 个公开数据集任务上补做文献优化方法的实验：
  Santander G3、HSBC mock 四档、FedAds、Orange 小版三任务、UCI、HomeCredit、COIL2000、Santander 交易、IEEE 第 1 块。
  方法：I2 分解、I3、M4、M1 / M1x、M6、M2 融合与蒸馏、I6（ε = 1 / 2 / 4）、M5（错配 5% / 10%）。
  新增：
  - 决策记录 DR-M5-012（新开方法筛选阶段，2 步）与分支卡 BC-M5-018；
  - 组件 method_screen / method_screen_data 与单测；
  - 运行配置 configs/s5_m1_method_screen.yaml；
  - 两个带汇总输出的运行入口 notebook；
  - 公开汇总 results/method_screen_v1/。
  状态类字段同步：
  - M5 README；
  - step_ledger（追加 S5.M1，新阶段预算 1/2）；
  - registry/module_status.yaml 的 M5 与 governance；
  - 项目进度总览（notebook 70 → 72、带输出 42 → 44；组件声明 95 → 97）。
why: |
  盘点显示，已有的 7 项 SGB 创新只在 1–4 个数据集上做过，候选 M1–M8 一个都没执行。所有者要求先列缺口、再立即补做，
  并把在个别数据集上有明显增益的方法写进报告。
  结果（6 seed，两层 bootstrap；开发证据）：
  - I2 + I3 在 11 / 14 上显著（+0.005 ~ +0.048）；M6 bagging 在其上 7 / 14 显著（+0.004 ~ +0.010，无变差）；
  - 优化版联邦相对同等调参的内地单边 10 / 14 显著，原版参数只有 7 / 14；
  - 只在个别任务上有效：I3（FedAds +0.026）、M1x（FedAds +0.009）、M1（Santander 交易 +0.008，另 5 个变差）；
  - M4、M5 无增益；
  - 单一验证集选组合不可靠：3 / 14 优于优化版，2 / 14 变差。
