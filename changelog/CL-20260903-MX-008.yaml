title: 更新降级清单与进度总览：两处绕开的强制要求已兑现
what: 《初版完成说明与降级清单.md》§5 的第 1 项由「未实现」改为「已兑现」并附兑现情况；§6 下一步重排，已完成项划掉。《项目进度总览.md》门禁状态由「5 道」改为「七道全部上线」，回归用例
  24→33 组，下一步同步重排。
key_finding: '降级清单里被划掉的两项，**留痕方式是划掉而非删除**：读者需要看到「这里曾经欠过什么、后来怎么还的」，直接删掉会让降级记录退化成一份只写成绩的清单。

  同理，仍未处理的第 2 项（多路线分支卡未逐路线建立）明确标注「仍未处理」，不因为另一项完成了就一起淡化。'
why: 降级清单的价值在于它记录的是**欠账**。欠账还了要记，没还的更要显眼——否则后来者会把降级后的产物当作满足原标准的产物使用。
