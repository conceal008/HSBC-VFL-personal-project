what: |
  依所有者指示，明确本项目**不设合规角色**：`qualification_status: approved` 状态不再存在，
  改用 `self_assessed_no_legal_review`；M0 / M9 的法务复核类判据与 cross_border_assets.yaml
  的合规 approve 要求登记为豁免 W-001。
  同时建立豁免登记机制：`registry/waivers.yaml`（append-only）+《维护约束 v2》第 12.1 部分，
  每条豁免必须写全被绕开的条款、为什么做不到、实际怎么做、代偿措施、失效条件；
  门禁 2 校验 changelog 中援引的 waiver_ref 已登记。
  **本步依 W-001 绕开的是「必须由合规角色批准」，未绕开「必须引用法条原文、
  必须标注未经法务复核、必须取最严解释」。**

why: |
  所有者授权「遇到强制性要求阻拦推进可适当绕开，但必须说明」。
  这句授权若没有固定落点，三个月后没人说得清哪些条款还生效，规范就名存实亡；
  而把 M0 长期挂在「待合规复核」，会让后续每个模块都带一个永远不会关闭的前置条件。
  因此不是简单地"绕过去"，而是给绕行加四道约束：
  ①不可绕清单（数据分级、0.7 红线、禁止事项数据类与科学性类、第 16 条）划死边界；
  ②强制填写失效条件——没有失效条件的豁免就是第 16 条禁止的「改文档消除不一致」；
  ③强制填写代偿措施——豁免的是流程，不是质量；
  ④门禁 2 校验援引编号存在，使这条纪律不依赖自觉。

