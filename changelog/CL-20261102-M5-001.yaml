title: S5.G2R A_secure 超限补训到 150 棵：与 SGB 无可分辨差异，累计 6.44 小时
what: |
  按所有者 2026-11-02 指示「继续重新训练之前剩余的部分」，把 A_secure（隐语 SS-XGB）从 S5.G2 停下的 141 棵续训到 150 棵。
  新增决策记录 DR-M5-011（补训方式、结果定性、阶段预算另授权 1 步）；运行配置 configs/s5_g2r_ssxgb_full150.yaml（参数沿用 S5.G2 配置）；
  两个带汇总输出的运行入口 notebook（补训记录与打分；精度与成本）；公开汇总 results/g3_santander_ssxgb_full150_v1/。
  组件 g3_ssxgb 不改（sha256 0f55ee4a…）。状态类字段同步：M5 README（状态、当前结论、下一步、S5.G2R 一节）、step_ledger（追加 S5.G2R，
  G3 阶段预算 5/5）、BC-M5-017（安全档路线 completed_over_cap）、registry/module_status.yaml 的 M5 与 governance、项目进度总览 notebook 计数（68→70）。
why: |
  S5.G2 在预注册单次拟合上限（6 小时）处停在 141 棵，A_secure 记为未完成，预注册的 A_secure − A 未报告。所有者要求训完剩余部分，
  以得到完整 150 棵的精度与成本。结果（开发评估集 20,351 位客户、586 个正例）：A_secure − A = +0.000 [−0.002, 0.003]，p = 0.79，
  Holm p = 1.0，可检出差异 0.006，在预声明尺度上无可分辨差异；A_secure − L4 = −0.001 [−0.004, 0.002]；A_secure − L1_k10 = +0.043 [0.033, 0.054]。
  150 棵累计拟合墙钟 23,172 秒（6.44 小时），每棵约 154 秒，约为 SGB 的 7.0 倍；两方每棵约 32 GiB 通信。
  结论与 141 棵的描述性结果一致；S5.G2 的预注册结论（上限内未完成）不改，本步结果标注「超出预注册单次拟合上限，所有者指示补训」。
