  declaration: '# S3.P3 通用秘密输出求交功能验证


    > 编写日期：2026-10-12 ｜ 版本：v1.0 ｜ 状态：已声明；工程准备，等待训练释放VM

    > 数据来源：既有UCI/Hillstrom各VM冻结本方记录键；纯合成已知答案控制

    > 口径基准：所有者明确继续保护交集名单；DR-M3-002、DR-M5-001


    will_produce:

    - 采用成熟SPU/CHEETAH安全排序/比较，对本方SHA-256字符串键编码作通用秘密求交，不依赖公开键域枚举；不是另造密码原语，也不称原生RR22秘密输出。

    - 输入本方字符串及重复键在本方验证；跨方仅密态256-bit字和固定长度索引。交集成员标志与本方到对方的匹配行位置只保存秘密份额，任何一方不重建明文交集/计数；原生明文输出接口保持禁用。

    - 已知答案纯合成排序/完全重叠/零重叠/部分重叠/乱序/重复拒绝控制；真实两数据集五seed、预先设定资源上限下的构造ID验证。记录耗时、控制布尔、份额存在性和权限/认证/输出库存，Notebook/代码及审查工程汇总同步main。

    - 与S3.P2区分：移除公开全集枚举依赖；仍是构造记录键的功能验证，不是自然跨机构实体匹配或工业千万级性能验证。

    will_not_produce:

    - 不把RR22明文结果改文件名当秘密分享；不新授权任何参与方明文交集/交集规模、对方身份、特征或标签。

    - 不与S5.X1同时使用VM计算端口，不改任何冻结原数据、训练配置/结果；不读取sealed确认，不接入既有训练模型。

    - 不声称抵抗恶意/合谋/宿主root，或达到生产安全；不得以正确性布尔测试代替证明。

    success_criteria:

    - 密态编译、纯合成已知答案和实际构造键库存/权限/认证/份额输出验证通过；全部固定seed完成，失败保留。

    - 无秘密结果reveal，host不导出原键/向量/份额；来源/源码/配置和运行目录完整追溯。

    risk:

    - 安全排序的成本高于专用Circuit-PSI或RR22，资源限制必须预先声明，不外推规模性能；如锁定版SPU不支持编译/比较或数值/权限失败立即停止。

    - SHA-256压缩后的匹配为计算安全假设，不表示自然客户身份正确性；构造ID在现有源中本来预对齐，不证明真实匹配质量。


    ## 执行前固定细节补记（2026-10-13）


    本方输入各固定填充64行、公开顺序seed101/102/103/104/105；本方私有熵决定保留概率0.8和乱序，其余填充本方独有随机虚键，不根据交集改变长度。源仅S3.P2已冻结keys.json，经管理员在对应owner
    VM内复制；不读原始特征/标签或sealed。构造键原本预对齐、可来自可枚举公域，不据本轮宣称解决自然身份字典攻击或真实客户匹配。


    交集四元组（双方成员标志/peer位置）不reveal，只dump各方membership.share。唯一公开的密态检查结果是联合正确性布尔位：实际键只在MPC中以独立all-pairs
    equality核对排序输出；不得把两方实际键交给Python oracle。纯合成控制可用公开已知答案。布尔位、固定填充长度和计时是显式允许披露的工程元数据，不是零侧信道证明。


    64行sort与已知答案/实际结构oracle已做frontend-only编译通过；未读实际键、未执行MPC。之前直接JAX CPU求值SIGILL、回调签名错误及临时日志在VM重启后不可用均保留，不把编译通过当协议成功；当前已重新保留可持续编译日志。ARM虚拟机用户home路径预检一次失败后按getent实测修正，不改模型或输出政策。纯逻辑17测试通过；实际执行仍须认证/权限/份额与完整Notebook验收。


    ## 执行前时序调整（2026-10-13，尚未执行实际求交）


    为响应所有者高效率继续的要求，取代准备期“等S5.X1全部远端CI结束后再开始”的时序建议：先核验S5.X1完整本地门禁（399测试、53回归）、普通main推送293c5af及30文件远端字节一致后，即可开始独立本地方秘密求交。远端CI38332090151继续单独核验登记；尚未结束不能记为通过，若失败立即诊断，并阻断本步骤发布。该调整不更改S5.X1已发表数据或声明边界，也不提前推送未验收的S3.P3，不运行生产或读取sealed，不引入新披露。两环境无共同计算端口，S5.X1实际训练已正常结束。

