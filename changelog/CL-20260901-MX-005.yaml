what: |
  综合 2026-05 整合方案、2026-06 项目实时日志、**2026-07-29 会议纪要（最高效力）**、
  2026-08-28 三份 v2 规范与本阶段 M0 的实际推进结论，产出 `项目目标与要求.md`（362 行，19 节）。

  三部分：
  · **目标**——项目是什么 · 四层目的 · 本阶段命题 · 核心要回答的三个问题 ·
    五条全局收敛判据 · **什么算失败，以及为什么「失败」也可能是合格交付**
  · **要求**——步进式微循环 · 统计严谨性硬要求（种子 ≥5、切分与初始化种子分别记录、
    CI 必给、测试集代码级冻结）· 三条解释边界 · 四级数据分级 · 八类跨境资产定性 ·
    结果可见性 N1–N6 · 术语与表达 T1–T6 · 门禁与仓库 · 协作留痕 · 禁止事项汇总
  · **现状与约束**——已定的 13 项口径 · **口径冲突** · 待裁定 6 项 · 当前状态 · 文件索引

  README 已加入口。

key_finding: |
  **标记出一处此前无人发现的口径冲突，且它会直接决定 M5 能否开工：**

  2026-07-29 会议纪要（根目录 AGENTS.md 标为「最高效力」）明确
  「**不引入神经网络**，以线性模型、树模型为核心」；
  而 2026-08-28 的 v2 框架 M5 把 **SplitNN（分割学习）** 列为 L3 的四条路线之一，
  本阶段 M0 推演出的「形态 A / 形态 B」更是完全建立在
  **中间层嵌入**与**梯度回传**之上——这些都是神经网络类方法的产物。

  若神经网络禁令仍然有效，后果有三：
  ①L3 只能是 SecureBoost（树）或联邦逻辑回归（线性）；
  ②**S0.6/S0.7 的形态 A/B 区分基本失效**——树模型的 VFL 交换的是加密梯度直方图而非嵌入，
    「单向流动」这条合规出路可能不成立；
  ③CBA-004（中间层嵌入）的定性在树模型路线下无适用对象。

  两种解读均有依据（时间优先级「后者覆盖前者」 vs AGENTS.md 明写 7/29 最高效力），
  **不由技术侧自行决定**，已列为待裁定第 3 项。

why: |
  此前项目的「目标」与「要求」分散在五处：整合方案（角色分工）、项目实时日志（四层目的）、
  根目录 AGENTS.md（口径纪律与禁区）、三份 v2 规范（模块判据与流程）、
  本阶段的 DR 与豁免（已定口径）。**没有一份能一次读完「这个项目要什么、怎么做才算合格」**，
  新人接手或需求方询问时只能逐个翻。

  整理过程本身产生了额外价值：把 7/29 决议与 v2 框架并置阅读时，
  上述冲突才显现出来——单独读任何一份都发现不了。
  这也说明这类「综合文档」不只是汇总，它是一次交叉检验。

