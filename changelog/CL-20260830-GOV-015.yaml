what: |
  门禁 6 解析 notebook 代码 cell 时，先剥掉「lstrip 后以 % / ! / ? 开头」的行以避开 IPython 魔法。
  但字符串格式化的续行（例如 `      % (a, b)`）同样以 % 开头，被一并剥掉后整个 cell 语法被破坏，
  结果是 WARN「无法解析为 Python，跳过魔数扫描」——**魔数检查被静默跳过**。
  改为只剥行首无缩进且形如 %name / %%name / !cmd / ?obj 的行，并在回归夹具中补一条 % 续行覆盖。

why: |
  这是门禁最危险的失效形态：不是报错，而是悄悄不检查了，还只留一条容易被忽略的 WARN。
  写第一个真实 notebook 时就撞上了它——说明它不是边缘情况，而是常规写法。
  同时给回归脚本补上「必须不出现」的断言能力，此后这类"静默跳过"可以被测试直接钉住。

