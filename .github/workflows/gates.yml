name: gates

# 《项目维护约束 v2》第 8 部分 · CI 门禁（按成本从低到高，前面失败不跑后面）
#
# 当前状态：只有门禁 1 已实现并生效。其余门禁按附录 B 的优先实现顺序补齐：
#   门禁 4  ci/check_cross_border_consistency.py  ← 下一个实现（原则三载体，越早上线 M9 越省事）
#   门禁 2  ci/check_step_metadata.py             ← 步进机制的强制力来源
#   门禁 3  ci/check_step_scope.py
#   门禁 2  ci/check_changelog_schema.py
#   门禁 6  ci/check_reproducibility.py
#   门禁 5  lint / 类型检查 / 单元测试（等到有第一份代码组件时接入）
#   门禁 7  端到端冒烟（合并到 main 时跑，等到有主链路时接入）
# 在上述脚本上线前，对应门禁由人工在 PR 自查表中执行，见 .github/pull_request_template.md。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate1-data-compliance:
    name: 门禁 1 · 数据合规扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 运行数据合规扫描
        run: bash ci/check_secrets.sh

  gate2-step-metadata:
    name: 门禁 2 · 步骤与元数据完整性（未实现）
    runs-on: ubuntu-latest
    needs: gate1-data-compliance
    steps:
      - uses: actions/checkout@v4
      - name: 未实现提示
        run: |
          echo "门禁 2 尚未实现：ci/check_step_metadata.py / ci/check_changelog_schema.py"
          echo "当前由 PR 模板中的自查表人工执行（Step-Id / Step-Score≥10 / 声明 / 证据 / cross_border_impact）。"
          echo "实现计划见 registry/decision_records/DR-GOV-001.yaml 的 init_scope 决策。"
