# 权威术语表 · 全项目唯一术语来源
# ---------------------------------------------------------------------------
# 规则（《项目维护约束 v2》第 13 部分）：
#   · 一词一义、一义一词——同一概念在全项目只用 term 字段这一个说法
#   · 首次出现写全称并括注英文与缩写，此后只用缩写
#   · forbidden 列出的说法一律不得使用（含历史文档，改写时一并修正）
#   · 项目自定义术语必须标 source: 本项目定义，并给出可判定的定义
