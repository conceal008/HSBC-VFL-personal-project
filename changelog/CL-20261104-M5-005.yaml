title: S5.M7 M3 后半——主动方明文直方图与原版逐位一致，两方合计计算每棵树省 29% ~ 43%；Orange 大版预筛加明文直方图约为全部列原版的 1 / 41（外推）
what: |
  方法筛选第四阶段（DR-M5-015）第 1 步。隐语 secretflow-lite 1.13.0b0 `sgb_v`，debug_mode 单进程两方模拟，OU；配置全部取自 S5.M1 / S5.M5 的结果，不再调参。
  - 实现：只替换 `GradientEncryptor.cache_to_workers`。被动方收到同一份梯度密文；主动方收到自己明文梯度的 HEU 明文对象（隐语 label_holder_feature_only 分支的做法），
    即 SecureBoost 原设计。不改隐语源码。
  - D-3 逐位比较：S5.M2 的 6 个任务优化版联邦（seed 11）用明文版本完整拟合，测试集逐行打分与 S5.M2 存档比较。
  - D-4 计时：每个任务 2 棵树预热，再按 ABBA 顺序各拟合前 10 棵树，记录两方合计计算时间与两方分项（分桶求和、取回 / 解密）。
  - D-5 单树开销：Orange 大版流失（S5.M5 选定的优化版联邦配置，深度 3），每方 k = 100 / 300 / 1000 列各 5 棵树，原版与明文各一次；线性外推到全部清洗后列。
  新增：
  - 组件 sgb_cost_screen 与单测、组件声明 M5-sgb_cost_screen；
  - 运行配置 configs/s5_m7_sgb_cost.yaml；
  - 带汇总输出的运行入口 notebook S5.M7_1（用仓库组件在 UCI Bank 上重跑逐位比较并核对）；
  - 公开汇总 results/sgb_cost_v1/；
  - 决策记录 DR-M5-015（第四阶段，2 步）与复核段 review_20261104_s5m7。
  状态类字段同步：BC-M5-018（新增 plaintext_label_holder_histogram 完成、orange_large_sgb 进行中）、step_ledger（追加 S5.M7，新增第四阶段预算 1 / 2）、
  registry/module_status.yaml 的 M5 与 governance、M5 README、项目进度总览（notebook 77 → 78、带输出 49 → 50；组件声明 101 → 102）。
why: |
  所有者 2026-11-04 10:35 回复「继续」。报告 v1.4 缺口清单中，候选文档 M3 只做了前半（两方特征预筛，S5.M5），后半「主动方明文直方图」没做；
  Orange 大版也没有任何真实 SGB 开销数据。两项都只用公开数据，可在会话容器内完成。
  结果（开发证据）：
  - 6 个任务全部逐位一致（不同 0 行，最大差 0，测试 AUROC 相同），判定「逐位一致」，按 D-6 做 S5.M8。
  - 每棵树两方合计计算时间省 29% ~ 43%（ABBA 两对范围 27% ~ 46%）；省下的全在主动方（主动方分桶求和约 1 / 12，主动方解密约 0），被动方不变。
  - Orange 大版流失每方 100 / 300 / 1000 列：原版 25.0 / 73.1 / 241.7 秒 / 棵，明文 14.6 / 41.7 / 126.8 秒 / 棵，省 42% ~ 48%；
    外推到全部清洗后列（13,295 列）原版约 1,730 秒 / 棵（外推，不实测），预筛到每方 300 列约为其 1 / 24，再加明文直方图约 1 / 41。
  - 这是开销上的改进，不改变任何 AUROC 结论；耗时是单进程模拟的合计计算时间，不是部署墙钟。
