title: 各级别超参搜索：C1 未被翻转，反而从 12.3% 收紧到 2.1%
what: '实现逐级别超参搜索组件，在 3 场景 × 5 种子上按 60/20/20 三分划分，各级别按自身网格在**验证集**上选参、在**测试集**上报告。依 DR-GOV-009 的红线，L1 的搜索空间刻意给到最大——60
  组，是 L0 的 12 倍。

  另做 oracle 上界实验：让 L1 直接在测试集上挑最优点（等于作弊，非有效估计），给出「调参最多能帮 L1 到什么程度」的上限。'
key_finding: '**C1 未被翻转，反而更强。**

  - 正规口径（验证集选参）：L1 − L0 = +0.0026，L3a − L0 = +0.1230 → **L1 只捕获 2.1%**

  - oracle 口径（测试集选参，作弊）：L1 − L0 = +0.0193 → **也只有 15.5%**

  - 此前 40 种子安慰剂对照给出 12.3%，正好落在两者之间

  **三个独立口径互相印证：调参救不回 L1。** 其瓶颈是结构性的——分段键只能用主动方特征，回传统计量因而是主动方特征的函数。


  **方法自检成立**：「验证减测试」的乐观量随网格增大而增大（L3b 的 81 组差 0.0412 > L3c 的 54 组 0.0241 > L3a 的 27 组 0.0114），说明选参乐观度被正确检出，而非被实现掩盖。


  顺带的次级发现：调参后 **L3a 联邦LR（0.8352）与 L3c SplitNN（0.8210）的差距缩小**，而 L3b 纵向 GBDT（0.7954）在本合成数据上始终落后——本 SCM 的信号是潜变量的线性组合，对线性模型有利，这是**生成假设带来的偏向**，不可外推到真实数据。'
why: 《实验结果与结论.md》§9 把「未做超参搜索」列为可能改变结论的第 5 项。C1 是本项目最核心的结论，它若只是调参不当造成的假象，整个商业前提就要重估。而验证一个结论「经得起推敲」与推翻它同样有价值——两种结果都只有做了才知道。
