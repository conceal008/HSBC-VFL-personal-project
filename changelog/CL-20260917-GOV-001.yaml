title: 修复 Bash 3.2 下门禁中文输出缺失
what: |
  将门禁脚本中后接中文字符的 `$var` 改为 `${var}`，修复 macOS Bash 3.2
  把后续中文字符并入变量名、导致文件名和标签从输出消失的问题。
why: |
  框架整理后的全量门禁暴露了 5 个回归断言失败。实际扫描均已阻断，但输出标签缺失，
  会让回归验证失败，也会降低人工诊断信息的完整性。
key_finding: |
  Bash 3.2 在 UTF-8 locale 下会把 `$f（`、`$label：`、`$name（` 解析成超出 ASCII
  变量名的表达式。使用花括号明确变量边界后，扫描命中数不变，47 组回归全部恢复。
