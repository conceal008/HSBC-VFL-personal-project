# S5.4 · 各级别超参搜索配置
#
# 目的：检验 C1（L1 只捕获 VFL 价值的 12.3%）是否只是「L1 欠调参」的假象。
# 依 DR-GOV-009 的红线「L1 必须与 L3 同等认真实现」，**L1 的搜索空间刻意给到最大**——
# 若调参能翻转 C1，那必须让它有机会翻转。
#
# 划分：训练 60% / 验证 20% / 测试 20%。**选参只看验证集**，测试集只用于最终报告。
# 在测试集上选参会让所有级别一起虚高，且对搜索空间大的级别虚高更多——
# 那正好是 L1，会在**有利于 L1** 的方向上污染结论，同样不可接受。
step_id: S5.4
seeds: [11, 22, 33, 44, 55]
scenarios: [S1_基准, S3_高互补, S8_稀疏正样本]
split:
  train: 0.6
  valid: 0.2

grids:
  L0_LR:
    c_reg: [0.01, 0.1, 1.0, 10.0, 100.0]
  L1_LR:                      # 最大搜索空间：5 × 4 × 3 = 60 组
    c_reg: [0.01, 0.1, 1.0, 10.0, 100.0]
    n_segments: [16, 64, 256, 1024]
    k_anonymity: [5, 10, 20]
  L2_LR:
    c_reg: [0.01, 0.1, 1.0, 10.0, 100.0]
  L4_LR:
    c_reg: [0.01, 0.1, 1.0, 10.0, 100.0]
  L3a_联邦LR:
    flr_rounds: [200, 400, 800]
    flr_lr: [0.1, 0.5, 1.0]
    flr_l2: [0.00001, 0.0001, 0.01]
  L3b_纵向GBDT:
    n_rounds: [30, 60, 120]
    max_depth: [2, 3, 4]
    gbdt_lr: [0.05, 0.1, 0.3]
    reg_lambda: [0.1, 1.0, 10.0]
  L3c_SplitNN:
    dim_hidden: [8, 16, 32]
    dim_embed: [2, 4, 8]
    nn_epochs: [8, 16]
    nn_lr: [0.003, 0.01, 0.03]

fixed:
  n_bins: 32
  min_gain: 0.0
  batch_size: 256
