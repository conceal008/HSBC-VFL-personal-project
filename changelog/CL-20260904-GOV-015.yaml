type: fix
title: 整体审视：修四处文档与事实不符，并补上让它们能通过的那个盲区
what: '对全仓做一次整体审视，修复四类确凿缺陷，并补上其根因——M9 证据链此前只查「证据文件在不在」，不查「文档里的数字对不对」。

  新增第四项核验「数字一致」，配 6 个单元测试与 2 组回归用例；tools/ 补测试并纳入门禁 5 管辖。'
key_finding: '🔴 **审视发现的最严重一处：入口文档的摘要表与正文冲突。**

  《实验结果与结论》的一句话结论表 C1 仍写「L1 只捕获 12.3%」，而正文 §2.2b 已被 S5.4 收紧到 2.1%（正规选参口径）。**读摘要和读正文会得到两个不同的数**，而全部门禁绿灯。同类问题在《项目进度总览》第
  128 行与决策影响表 I1。已统一为「2.1%–15.5%（三口径）」。


  另三处陈述与事实不符：`ci/README.md` 写着 17 组用例、12 组用例；《项目目标与要求》写着 22 组——实际 47 组；`platform/README.md` 写着「当前为空，等待第一个组件落地」，而实际已有
  2 个组件、9 个测试。


  **根因是我自己刚建那套机制的盲区**：证据链核验只确认证据文件存在，而**入口文档里的一个陈旧数字比缺一个证据文件更容易误导人**——读者不会去核对，只会照着用。


  新检查上线后**立刻抓到了我自己**：加完两组回归用例（真值 45→47）后忘了改文档，四份文件同时被拦。这比任何设计论证都更能说明它有用。


  另一处结构性缺陷：`tools/` 共 651 行、是全部 11 份 notebook 的**唯一生成入口**，却既无测试也不在门禁 5 的组件管辖内——坏掉不会有任何检查发现。已补 14 个测试并纳入管辖。'
why: 用户要求「重新审视整体，看哪里需要优化改进」。审视的价值不在于列出一堆改进项，而在于**找出那些「全绿但实际是错的」的地方**——因为它们不会自己暴露。四处缺陷全部属于这一类。
