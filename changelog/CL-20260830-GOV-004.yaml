what: |
  实现《项目维护约束 v2》8.2 的门禁 2：校验一个提交的 commit trailer（Change-Id / Step-Id /
  Step-Score / Branch-Card / Cross-Border）与它引用的 changelog 条目是否完整且自洽——
  声明非空、四维评分每项有证据引用、总分等于四维之和且 ≥通过线、无单项 ≤1、四道硬门全 pass、
  修正轮次 ≤2、cross_border_impact 为四枚举之一、type=exp 有分支卡、type=decision 的 DR 含 falsifier。
  通过线默认 10，模块 step_ledger 的 metrics.pass_threshold 被上调为 11 时自动取 11。

why: |
  它是步进式微循环唯一的强制力来源。没有它，1.3 阶段四的判定表（≥10 通过 / 8–9 修正 / ≤7 重做）
  与 1.4 的证据绑定都只是自觉；有了它，"未写声明就执行""无证据的满分""修正三轮硬提交"
  这三类最常见的自评虚高路径在合并前就被挡住。
  附录 B 把它排在 check_cross_border_consistency.py 之后、其余脚本之前，本步即按此顺序。

