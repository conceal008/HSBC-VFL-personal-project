title: S0.6R 出境机制补关键信息基础设施运营者前提，训练与试点人群分开计数
what: |
  依 DR-MX-002 · D-3：
  ① legal_references.md 一之二节补正三处摘录（第五条第（四）项、第七条、第八条漏掉的限定语
     「关键信息基础设施运营者以外的数据处理者」，并补第七条第（一）项原文），原文以删除线或粗体补字保留；
     「决定性影响」段加补正说明，指出训练人群与试点人群被视为同一批人。
  ② export_mechanism.required_mechanism 新增 is_ciio 参数（默认 False，与既有结果逐格一致）与 strictest 函数。
  ③ 新增配置 s0_6r_ciio_precondition.yaml、带输出 notebook S0.6R_ciio_precondition.ipynb、
     两张结果表 export_mechanism_matrix_ciio.csv 与 form_a_training_vs_pilot.csv、单元测试 test_export_mechanism_ciio.py（13 项，含与 S0.6 已发布矩阵的逐格回归）。
  ④ route_B.md 第三节、M0 README（状态、当前结论、未决问题、下一步）加补正说明；组件声明、step_ledger、
     registry/module_status.yaml 的 M0 条目、项目进度总览.md 的 notebook 计数（56→57）同步。
  ⑤ 本次会话交接记录 docs/03-handoff/HO-20261025-Claude-MX-constraint-review.md。
  已发布的 export_mechanism_matrix.csv、S0.5–S0.7 notebook 与结果不改。
why: |
  W-001 的代偿措施要求「引用逐字法条原文」，而原摘录漏掉的限定语恰好决定第五条第（四）项豁免与
  第八条标准合同或认证路径是否适用。组件按漏字后的读法实现，属于「说的和做的」都偏离法条原文，
  按 AGENTS.md 第 6 条须改实现，不能只改文档。
  验证的假设：若汇丰银行（中国）为关键信息基础设施运营者，形态 B 的豁免不成立；
  非关键信息基础设施运营者前提下，形态 A 的出境机制取决于训练人群而非试点人群。两条在 notebook 中逐格确认。
