title: 合规证据链、DPIA 与对外表述红线：三项核验均 100%
what: '把「结论 → 证据文件」的映射做成**可执行检查**（13 条结论 · 7 条风险 · 10 项交付），接入 run_all_gates.sh 与 CI，配 6 组回归用例。

  并产出 M9 输出契约要求的全部交付物：对外表述红线 · DPIA · 模型卡 · 跨境流动清单 · 审计日志规格 · 同意管理规格 · 数据卡 · 剩余风险签署。'
key_finding: '**三项核验均 100%**：一致性 13/13 · 风险溯源 7/7 · 交付清单 10/10。


  **先做机器核验再写文档**，因为 M9 的验收人是法务与合规而非技术方——写成「已核验」四个字，谁也不知道核了什么。核验器防的是一类很安静的事故：**有人删掉或重命名一个结果文件，引用它的结论就此失去依据，而七道门禁照样全绿。**

  写本模块的过程中它就抓到过一次：证据映射引用了不存在的 funnel_scenarios.csv，通过率掉到 92.3%。


  **《对外表述红线》是本步最有分量的产出。** 本项目实测到的东西推翻了这个领域里几句流传很广的话，沿用它们会被一问就穿，且在合规上站不住。列出 9 条绝对不能说，其中第一条是「原始数据不出本地，所以是安全的」——C4
  已证明无防护协议双向完全泄露。

  同时要求三句必须**主动说**，不能等人问，其中「无防护的协议是双向完全泄露的」尤其不能省：**隐去它去讲「联邦学习保护隐私」，是把风险留给下一个人。**


  `residual_risk_signoff.yaml` **未签署且无人可签**——本项目不设合规角色。保留该文件而不删除，是为了让「谁该签而没签」显式可见；删掉它会让缺口消失于无形。'
why: 框架给 M9 的定位是「验收人不是技术方，而是法务与合规」。对这类验收人来说，最没用的交付物是一份自称已核验的文档；最有用的是一份能自己跑一遍、告诉你哪条结论追不到依据的检查。
