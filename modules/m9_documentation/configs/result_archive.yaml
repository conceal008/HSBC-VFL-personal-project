- 'group regularization / secure tree / independent unopened confirmation: not run'
limitations:
- 历史S5.4/S5.P2自评全部通过已被独立复评撤销，旧指标仅作历史记录；全部版本/冒烟不得与最终预注册组混作正式实验。
- 共享冻结人群的CI只覆盖已有采样/seed条件，不等于独立人群或银行收益；旧test已查看，不可再作新确认。
- 字段切分/重叠率等构造条件需明确标注，特征组AUC差非可加。
- S3.P2只有有限公开域MPC秘密求交，时间是该构造协议的计时，不是原生RR22/千万客户PSI，也尚未接入实际训练。
- S7.P1属性探针为有利辅助条件下的MPC oracle；Bob仍无实际分数权限，常量binary不能以低误差/高重合解释安全或成功窃取。
- 只上传公开研究数据集的汇总指标，原始/清洗行数据、逐行分数、身份/交集规模、学习参数、梯度范数、权重和份额均排除。
- S1.P5准备原状态passed但生命周期审计G3失败、升级7/12；S1.P6修复后工程准备完成。准备回执不代表模型训练完成。
display_metrics:
