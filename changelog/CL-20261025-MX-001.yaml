what: |
  新增 registry/decision_records/DR-MX-002.yaml（五项决策：显著性判据前瞻修订、离线比较正例下界、
  出境推演补「关键信息基础设施运营者」前提并分开计训练与试点人群、神经网络禁令下的树或线性单向形态候选、
  恢复后第一批顺序）与 docs/03-handoff/约束与步骤复核_20261025.md（15 项逐条对照仓库原文的复核表，
  含 3 项对仓库外判断的更正）。
  状态类标注：项目目标与要求.md 第 8 节显著性一行按删除线 + 修订说明处理、第 17 节表后补充新待裁定事项；
  START_HERE 与 RESTART_PLAN 顶部加指引，原文不改；registry/module_status.yaml 更新 governance、M5、M6 与新增复核条目。
  不改任何代码、配置、notebook、结果文件、冻结报告与已发布结论；experiment_pause 不变。
why: |
  所有者要求复核约束与步骤并修正不合理之处。逐条核对发现四类需要改口径的问题：
  ① 「跨 ≥5 seed 且区间不重叠」不是差异检验，且 5 个 seed 的符号翻转检验最小 p=0.0625，按 0.05 不可能通过；
  ② 离线 AUROC 比较从未声明正例下界（S0.1P 已补算）；
  ③ legal_references.md 的法条摘录漏掉「关键信息基础设施运营者以外的数据处理者」限定语，
     且出境人数把训练人群与随机对照试点人群当成同一批人；
  ④ S0.9 所需的形态 B 代价证据只有被禁的 SplitNN 结果，恢复顺序也把核心问题一（L3 相对 L1）排在最后。
  显著性判据只前瞻适用，避免违反禁止事项第 23 条（实验后修改评估口径）。
